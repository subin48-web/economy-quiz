력을 동원하여 부족자금을 신속하게 대출 해주는 기능을 말한다."},{"t":"최종수요/중간수요","d":"어떤 재화나 서비스를 구매하고자 하는 능력과 욕구를 수요라 하는데 이는 용도에 따라 중간수요와 최종수요로 나눌 수 있다."},{"t":"추가경정예산","d":"추가경정예산이란 행정부가 예산을 성립한 후에 발생한 사회·경제적인 변동으로 인해 기 존의 예산을 추가·삭감하여 바꾼 예산을 가리킨다."},{"t":"추심","d":"일반적으로 어음·수표소지인이 거래은행에 어음·수표대금 회수를 위임하고 동 위임을 받 은 거래은행은 어음·수표 발행점포 앞으로 동 대금의 지급을 요청하는 일련의 절차를 말 한다."},{"t":"출구전략","d":"출구전략(Exit Strategy)이란 경제 위기 발생시 경기를 부양하기 위해 취하였던 각종 완 화정책을 정상화하는 것을 말한다."},{"t":"출금이체","d":"출금이체(Debit Transfer)는 수취인이 자신이 거래하는 금융기관에 추심을 의뢰하여(즉, 인출지시) 지급인의 계좌로부터 이체금액을 출금하여 수취인 자신의 계좌에 입금하도록 하는 계좌이체방식을 말한다."},{"t":"치앙마이 이니셔티브(CMI)","d":"1999년 3월 ASEAN+3 정상회의에서 협력과제의 하나로 통화·금융협력을 제시하고 역 내 금융지원체제를 구축하기로 합의함에 따라 2000년 5월 태국 치앙마이에서 개최된 ASEAN+3 재무장관 회의에서 마련한 방안을 말한다."},{"t":"치킨게임","d":"치킨게임(Chicken Game)은 다양한 분야에서 이해 당사자가 모두 최악의 상황에 직면 할 가능성을 초래하는 극단적인 경쟁을 가리키는 용어로 쓰이고 있다."},{"t":"칩플레이션(Cheapflation)","d":"저가 상품 가격상승률이 고가 상품보다 더 큰 현상을 말한다."},{"t":"카르텔","d":"카르텔(Cartel)이란 동종 혹은 유사 산업에서 경쟁하는 기업들이 상호간의 경쟁을 제한하 고 완화함으로써 시장을 지배할 목적으로 결성한 기업연합체를 말한다."},{"t":"캐리트레이드","d":"상대적으로 금리가 낮은 국가의 통화로 자금을 빌려(carry) 금리가 높은 국가의 주식 채 권 등의 자산에 투자(trade)하는 행위를 의미한다."},{"t":"캐즘(Chasm)","d":"캐즘(Chasm)은 새로운 기술이나 제품이 개발돼 대중에서 소개된 뒤 대중화되는 과정에 서 처음의 수요가 후퇴하거나 정체하는 현상을 말한다."},{"t":"커버드본드(이중상환청구권부 채권)","d":"커버드본드(Covered Bond)란 금융기관이 부동산담보대출 등 자신이 보유한 고정자산을 담보로 발행한 채권을 말하며 우리나라에는 2014년 4월 도입되었다."},{"t":"컨트리리스크","d":"해외 투자자가 평가하는 특정 국가의 대외신인도를 일컫는 말로 투자상대국 정부의 예 상치 못한 제도 변경이나 정책 변화로 투자자가 손실 또는 불이익을 입게 될 가능성을 의 미한다."},{"t":"코리보","d":"코리보(KORIBOR)는 국내 은행들이 서로 자금거래를 할 때 기준이 되는 금리를 말한다."},{"t":"콜론","d":"콜론(Call Loan)은 여유 자금을 가진 금융기관이 다른 기관에 초단기(보통 하루)로 자금 을 대여하는 행위를 말한다."},{"t":"콜머니","d":"콜머니(Call Money)는 콜론과 반대되는 개념으로 자금이 부족한 금융기관이 하루 또 는 이틀 정도의 초단기 자금을 다른 금융기관으로부터 빌리는 것을 말한다."},{"t":"콜시장","d":"콜(Call)시장은 금융기관들이 일시적인 자금 과부족을 조절하기 위하여 상호간에 초단기 로 자금을 차입하거나 대여하는 시장이다."},{"t":"콜옵션","d":"콜옵션(Call Option)이란 거래당사자들이 미리 정한 가격(행사가격, strike price)으로 장래의 특정 시점 또는 그 이전에 일정자산(기초자산)을 살 수 있는 권리를 매매하는 계 약이다."},{"t":"크라우드펀딩","d":"크라우드펀딩(Crowd Funding)은 온라인 플랫폼(중개업자)을 통해 다수의 개인들로부 터 자금을 조달하는 금융서비스이다."},{"t":"타행환공동망","d":"타행환공동망은 금융공동망 중계센터인 금융결제원과 금융기관들의 전산시스템을 상호 연결하여 송금인과 수취인의 거래은행이 다르더라도 전국 어느 금융기관의 점포에서나 상호간 자금이체업무를 처리할 수 있게 한 시스템으로 1989년 12월 가동되었다."},{"t":"탄소국경세(Carbon Border Adjustment Mechanism, CBAM)","d":"CBAM은 EU 역외에서 생산돼 유럽연합(EU)로 수입되는 시멘트, 전기, 비료, 철·철강, 알 루미늄, 수소 등 6가지 품목 제품을 생산하는 과정에서 나오는 탄소배출 추정치를 계산 해 일종의 세금을 부과하는 제도이다."},{"t":"탄소배출권","d":"탄소배출권(Carbon Emission Permit)은 온실가스 감축을 유도하기 위한 대표적인 시장 기반 정책 수단이다."},{"t":"탄소중립경제","d":"탄소중립은 대기중 온실가스 온도가 인간활동에 의해 더 증가되지 않도록 순배출량이 0 이 되도록 하는 것을 말한다."},{"t":"탈세계화(De-globalization)","d":"탈세계화는 세계화의 반대되는 개념으로, 세계 각국간의 상호교류와 협력이 줄어들고 자 국 중심적인 정책을 강화하는 현상을 말한다."},{"t":"테이퍼링(Tapering)","d":"미국은 2008년 9월 리먼브라더스 파산에 따른 금융위기 이후 큰 경기 후퇴를 겪게 되는 데 이를 대공황에 빗대어 대침체(great recession)라고 한다."},{"t":"테일러 준칙(Taylor’s Rule)","d":"테일러 준칙(Taylor’s Rule)이란 1993년 미국 경제학자인 존 테일러(John Taylor) 가 제안한 금리준칙으로 중앙은행이 거시경제 안정을 달성하기 위해 물가변동뿐만 아니라 산출변동에도 금리가 조정되도록 한 금리준칙을 말한다."},{"t":"텔레뱅킹(폰뱅킹)","d":"텔레뱅킹(폰뱅킹)은 고객이 은행창구에 나가지 않고 가정이나 사무실 등에서 전자식 전 화기를 통하여 자동응답 서비스를 이용하거나 은행직원과 통화함으로써 자금이체, 조회, 분실신고 및 FAX 통지 등을 할 수 있는 서비스이다."},{"t":"토빈세(Tobin Tax)","d":"미국 예일대학교의 제임스 토빈(James Tobin) 교수가 1978년에 주장한 것으로 국제 투 기자본(핫머니)의 급격한 자금유출입으로 각국의 통화가치가 급등락하여 통화위기가 촉 발되는 것을 막기 위한 국경 간 자본이동 규제방안의 하나이다."},{"t":"통상임금","d":"통상임금은 근로자에게 소정근로의 대가로서 정기적·일률적으로 지급되는 임금을 의미 하며, 우리나라 근로기준법상 매우 중요한 개념이다."},{"t":"통합발행제도","d":"통합발행제도(Fungible Issue 또는 Reopening Issue)란 일정기간(3개월, 6개월, 1년 등) 동안 계속해서 발행하는 채권의 표면금리와 만기 등 발행조건을 일치시켜 그 기간 동안 발행한 채권을 동일한 채권으로 만드는 제도이다."},{"t":"통화스왑","d":"통화스왑이란 외환스왑과 마찬가지로 거래당사자 간에 서로 다른 통화를 교환하고 일 정기간 후 원금을 재교환하기로 약정하는 거래를 말한다."},{"t":"통화승수","d":"중앙은행이 공급한 본원통화는 예금은행의 신용창출과정을 통해 이의 수 배에 달하는 통 화를 시중에 유통하게 한다."},{"t":"통화신용정책보고서","d":"통화신용정책보고서는 한국은행이 통화신용정책 결정 내용과 배경, 향후 통화정책방향 등을 종합적으로 정리해 국회에 정기적으로 제출하는 법정 보고서로, 한국은행법 제96조 에 따라 연 2회 작성하고 있다."},{"t":"통화안정계정","d":"통화안정계정은 금융시장 유동성 조절을 위한 일종의 기한부 예금(term deposit)이다."},{"t":"통화안정증권","d":"통화안정증권은 「한국은행법」 제69조 및 「한국은행 통화안정증권법」에 따라 한국은행 이 유동성 조절을 목적으로 발행하는 채무증서이다."},{"t":"통화유통속도","d":"통화유통속도(Velocity of Circulation of Money)는 통화 한 단위가 일정 기간(통상 1년) 동안 각종 거래를 매개하기 위해 몇 번 유통되었는지를 나타내는 지표를 말한다."},{"t":"통화정책","d":"통화정책이란 독점적 발권력을 지닌 중앙은행이 통화량이나 금리에 영향을 미쳐 물가안 정, 금융안정 등을 달성함으로써 경제가 지속가능한 성장을 이룰 수 있도록 하는 정책을 말한다."},{"t":"통화정책수단","d":"중앙은행이 활용하고 있는 통화정책 수단으로는 지급준비제도, 공개시장운영, 중앙은행 여수신제도 등을 들 수 있다."},{"t":"통화정책 운영체제(Monetary Policy Regime)","d":"중앙은행은 역사적으로 경제구조의 변화, 금융시장의 발달 정도 등에 따라 다른 형태 의 통화정책 운영체제를 도입해 왔다."},{"t":"통화정책체계(Monetary Policy Framework)","d":"중앙은행은 통화정책을 수행함에 있어 정책수단과 최종목표(물가안정, 금융안정 등)를 이 어줄 수 있는 다양한 지표를 활용하는 것이 일반적이다."},{"t":"통화정책 커뮤니케이션","d":"통화정책 커뮤니케이션이란 중앙은행이 통화정책 수행과정에서 가계, 기업, 정부 등 경 제주체 및 시장과 행하는 일련의 소통행위를 말한다."},{"t":"통화정책 파급경로","d":"통화정책이 실물경제에 파급되는 경로에는 금리경로, 자산가격경로, 환율경로, 기대경로, 신용경로, 위험선호경로 등이 있다."},{"t":"통화지표","d":"한 나라의 경제가 건강하게 유지되려면 경제규모에 맞는 적정량의 통화가 필요하다."},{"t":"투입계수","d":"각 산업부문이 재화나 서비스의 생산에 사용하기 위하여 다른 산업으로부터 구매한 원재 료, 연료 등 중간재별 투입액을 총투입액으로 나눈 것으로서 각 부문 생산물 1단위 생산 에 필요한 중간재들의 단위를 나타낸다."},{"t":"투자율","d":"투자율이란 일정 기간 동안 국민경제가 생산한 생산물 또는 수취한 소득에 대한 투자의 비율을 의미하는 것으로 투자액을 국민총처분가능소득으로 나누어 구한다."},{"t":"투자은행","d":"투자은행(Investment bank)이란 상업은행(commercial bank)에 대비되는 개념으로 상 업은행이 예금을 바탕으로 기업에 자금을 공급하는 전통적 은행업에 주력했다면 투자은 행은 기업의 자금조달을 지원하기 위해 자본시장에서 유가증권의 인수 및 발행 주선을 주 요 업무로 수행한다."},{"t":"트리핀 딜레마(Triffin’s Dilemma)","d":"트리핀 딜레마(Triffin’s Dilemma)는 예일대 교수 로버트 트리핀(Robert Triffin)이 1960년대 미국의 무역수지 적자가 심화되는 상황을 설명하면서 제기한 개념으로, 기축통 화가 안고 있는 구조적 모순을 뜻한다."},{"t":"특별인출권(SDR)","d":"1968년 4월 국제통화기금(IMF) 이사회의 결의에 따라 국제유동성 부족에 대처하기 위 하여 1970년 도입된 일종의 국제준비통화이다."},{"t":"특수목적기구(SPV)","d":"자산유동화증권(ABS; Asset-Backed Securities) 발행에는 자산보유자, 특수목적기구 (SPV), 자산관리자 및 신용평가기관 등이 참가하게 된다."},{"t":"파레토최적","d":"경제적 최적의 의미를 규정하는 개념의 하나이다."},{"t":"파생금융상품","d":"파생금융상품(Financial Derivatives)은 그 가치가 통화, 채권, 주식 등과 같은 기초금융 자산(underlying asset)의 가치변동에 의해 결정되는 금융상품을 말한다."},{"t":"펀드","d":"펀드(Fund)란 다수의 투자자들로부터 자금을 모아 전문적인 운용기관인 자산운용사가 주 식, 채권, 부동산 등 자산에 투자하여 운용한 후 그 실적에 따라 투자자에게 되돌려주는 금융상품이다."},{"t":"페더럴펀드","d":"페더럴펀드(Federal Funds)는 미 연방준비은행에 지급준비금 예치의무가 있는 예금은 행이 지급준비금 과부족을 조절하기 위해 여타 예금은행, 정부보증기관(government- sponsored enterprises) 등으로부터 무담보로 차입한 자금을 말한다."},{"t":"평가절상/평가절하","d":"환율은 일반적으로 거래 대상물인 외국환(외국통화) 한 단위와 교환되는 자국 통화의 양으로 정의되는데, 원화절상은 외환시장에서 외환의 공급이 수요를 초과하여 외환의 가 치가 하락하고 원화의 가치는 상승하는 현상을, 반대로 원화절하는 외환의 수요가 공급 을 초과하여 외환의 가치가 상승하고 원화의 가치는 하락하는 현상을 의미한다."},{"t":"평잔/말잔","d":"평잔과 말잔은 금융기관의 업무에서 자주 사용되는 용어로, 각각 평균잔액(average balance)과 기말잔액(end-of period balance)의 줄임말이다."},{"t":"표면금리","d":"표면금리(Coupon Rate)란 채권의 액면가에 대한 연간 이자지급 비율을 채권표면에 표시 한 것으로서 계약기간 동안 지급을 약속한 고정금리이다."},{"t":"풋옵션","d":"풋옵션(Put Option)이란 거래당사자들이 미리 정한 가격(행사가격, strike price)으로 만 기일 또는 그 이전에 일정자산(기초자산)을 팔 수 있는 권리를 매매하는 계약이다."},{"t":"프로그램매매","d":"프로그램매매(Program Trading)란 주식시장에서 시장분석, 투자시점 판단, 매매 지시 등의 과정을 컴퓨터 프로그램을 통해 일괄 처리하여 다수의 종목을 동시에 거래하는 기법 을 말한다."},{"t":"프로젝트 파이낸싱","d":"프로젝트 파이낸싱(PF; Project Financing)이란 석유개발, 탄광채굴, 조선소, 발전소, 고 속도로 건설 등 대규모 사업을 추진하는 경우 그 프로젝트에 필요한 대규모의 소요자금과 각종 금융수요를 충족하기 위해서 동원되는 다수의 금융수단이나 투자금융기법을 통칭하 는 말이다."},{"t":"프로젝트 한강","d":"프로젝트 한강은 한국은행이 미래 디지털 금융인프라 구축을 위해 추진하는 중앙은행 디 지털화폐(CBDC) 및 예금토큰 활용성 테스트 사업을 말한다."},{"t":"플라자 합의","d":"플라자 합의는 1985년 9."},{"t":"플랫폼 노동자","d":"플랫폼 노동자는 온라인플랫폼을 통해 노동을 제공하고 대가를 받는 사람을 말한다."},{"t":"피셔효과","d":"1920년대 미국의 경제학자 어빙 피셔(Irving Fisher)가 발표한 이론으로, 피셔방정식 (Fisher equation)은 명목금리가 실질금리와 기대인플레이션의 합계와 같다고 표현한다."},{"t":"피용자보수","d":"한 나라 국민이 생산활동에 참여한 결과 발생한 소득은 노동, 자본, 경영 등의 생산요소를 제공한 경제주체에 나누어진다."},{"t":"피용자보수비율","d":"한 나라에서 생산활동으로 발생된 소득은 노동, 자본 등 생산요소를 제공한 경제주체에 게 분배된다."},{"t":"핀테크","d":"핀테크(FinTech)는 ‘금융’(finance)과 ‘기술’(technology)의 합성어로 디지털 기술 혁신 을 통해 금융서비스를 획기적으로 효율화하거나 새 금융서비스를 개발하는 것을 뜻한다."},{"t":"필립스곡선","d":"뉴질랜드 출신의 영국인 경제학자 필립스(W."},{"t":"한계비용","d":"한계비용은 재화나 서비스를 한 단위 더 생산하는데 들어가는 비용의 증가분을 의미한 다."},{"t":"한계소비성향","d":"개인의 소득은 소비와 저축으로 나누어지는데, 소득 중에서 소비로 쓰이는 비율을 소비성 향, 저축에 들어가는 비율을 저축성향이라고 한다."},{"t":"한계효용","d":"어떤 상품이나 서비스의 소비를 한 단위 늘림에 따라 추가로 증가한 효용을 한계효용이라 한다."},{"t":"한국은행","d":"우리나라의 중앙은행인 한국은행은 1950년 6월 12일 「한국은행법」에 의하여 설립되었 다."},{"t":"한시적 근로자","d":"근로기간이 정해져 있지 않는 상시 근로자와 달리 근로 기간이 정해져 있는 계약직, 일용 직 등을 비정규직 근로자라 한다."},{"t":"한은금융망(BOK-Wire+)","d":"한국은행이 금융기관간 자금결제를 위하여 1994년 12월부터 가동 운영하고 있는 거액지 급시스템으로 금융기관의 콜거래, 외환 및 증권매매 등에 따른 원화자금 이체는 대부분 한은금융망을 이용하여 한국은행에 개설된 당좌예금을 이용해 계좌이체하는 방식으로 처 리한다."},{"t":"할당관세제도","d":"특정물품의 수입이 정부가 정한 일정수량에 이를 때까지는 저율의 관세가 부과되나 일정 량을 초과하면 그 이후에는 고율의 관세가 부과되는 제도를 할당관세제도라고 하며 이때 부과되는 고율 또는 저율의 관세를 할당관세라 한다."},{"t":"합계출산율","d":"한 여성이 가임기간인 15세에서 49세 사이에 낳을 것으로 기대되는 평균 출생아 수를 측 정하는 통계를 말하는데, 실제로는 5년 단위 간격으로 구분한 연령대별 출산율을 계산한 후 이를 합한 개념이기 때문에 합계출산율(Total Fertility Rate)이라고 부른다."},{"t":"해외외국환업무취급기관(RFI)","d":"해외외국환업무취급기관(RFI; Registered Foreign Institution)이란 외국환 거래법 등 관 련 법령에서 정한 요건을 충족해 외환당국에 등록한 해외 소재 외국 금융회사를 말한다."},{"t":"헤지펀드","d":"개인 및 연기금, 보험사 등 기관투자자를 대상으로 모집한 자금을 고수익 또는 위험회피 등을 목적으로 국제증권시장이나 국제외환시장에 투자하는 사적투자조합 또는 투자계 약을 말한다."},{"t":"현금자동인출기(CD)공동망","d":"현금자동인출기(CD)공동망은 금융공동망 중계센터인 금융결제원과 금융기관들의 전산 시스템을 상호 연결하여 특정 금융기관 고객이 다른 금융기관의 CD 또는 ATM을 이용하 여 현금인출, 계좌이체, 잔액조회 등의 서비스를 받을 수 있도록 구축된 시스템으로 1988 년 7월 가동되었다."},{"t":"현시비교우위지수(RCA)","d":"현시비교우위지수(RCA; Revealed Comparative Advantage Index)는 한 국가가 어 떤 특정 품목에서 국제무역상 상대적으로 경쟁력이 있는지를 계량적으로 보여주는 지 표이다."},{"t":"현용화폐","d":"현용화폐는 현재 대한민국에서 법적으로 통용되고 있는 공식적인 지급수단으로서, 한국 은행이 독점 발행권을 가지고 있는 은행권(지폐)과 주화(동전)를 의미한다."},{"t":"현지금융","d":"현지금융이란 거주자(개인은 제외), 거주자의 국외지점 및 현지법인이 외국에서 사용하기 위하여 외국에서 외화자금을 차입(증권발행에 의한 경우 포함)하거나 지급보증을 받는 것을 말한다."},{"t":"현지법인","d":"현지법인이라 함은 거주자가 외국환거래규정에 의하여 신고 등을 하고 국외에서 해당국 의 법에 따라 설립한 법인을 말한다."},{"t":"협의통화(M1)","d":"협의통화(M1)는 경제 내에 유통되는 화폐규모를 측정하는 통화지표 중 화폐의 지급결제 수단으로서의 기능에 초점을 맞춘 지표로서 유동성이 가장 높은 통화를 의미한다."},{"t":"혼합형결제시스템","d":"혼합형결제시스템(Hybrid Settlement System)은 신용리스크가 발생하지 않는 실시간총 액결제방식의 장점과 결제유동성을 절약할 수 있는 차액결제방식의 장점이 결합된 거액 지급시스템을 말한다."},{"t":"홀로그램","d":"은행권 위조방지를 위한 장치의 하나로 사진용 필름과 유사한 표면에 3차원 이미지를 기 록하여 기울여 보면 문양 변화 효과를 확인할 수 있다."},{"t":"화폐교환","d":"화폐교환이란 고객의 요구에 따라 다른 종류의 화폐로 바꾸어 주거나 훼손·오염 또는 마 모 등의 사유로 손상된 화폐를 사용할 수 있는 화폐로 바꾸어 주는 것을 말한다."},{"t":"화폐발행/화폐발행액","d":"화폐발행은 중앙은행인 한국은행의 독점적인 권한으로 금융시장에서 국공채 매입, 은행에 대출, 외환 매입, 금융기관의 예금 인출 요청 등의 형태로 화폐를 시중에 공급하는 것을 말한다."},{"t":"화폐의 액면체계","d":"화폐의 액면체계는 한 국가의 화폐를 구성하는 액면금액의 틀을 의미하는데, 보통 액면 체계는 ‘일상적인 거래 편의 도모’라는 대원칙 아래 국가의 경제·사회적 여건과 국민의 화폐사용 습관의 영향을 받는다."},{"t":"화폐환수","d":"한국은행이 발행하여 시중에서 유통되는 화폐는 예금 또는 세금 납부 등으로 금융기관으 로 입금되며, 금융기관은 입금된 화폐 중 일부를 고객의 예금인출에 대비하여 시재금으로 보유하고 나머지는 한국은행에 예금지급준비금과 결제자금 등으로 입금하는데, 이처럼 한국은행에서 발행된 화폐가 다시 한국은행으로 되돌아 들어오는 것을 화폐의 환수라 한 다."},{"t":"환경계정","d":"환경계정이란 1993년 UN이 경제활동과 환경 간의 상호 관계를 체계적으로 분석하기 위 하여 국민계정의 위성계정 형태로 새로 도입한 「환경경제통합계정」(SEEA; System of Integrated Environmental and Economic Accounts)을 말한다."},{"t":"환경권","d":"환경권(Environmental Rights)이란 모든 국민이 건강하고 쾌적한 환경 속에서 인간답 게 살 수 있는 권리를 말한다."},{"t":"환리스크","d":"장래의 예상하지 못한 환율변동으로 인하여 보유한 외화표시 순자산(자산-부채) 또는 현 금흐름의 가치가 변동될 수 있는 불확실성을 의미한다."},{"t":"환리스크 헤지","d":"장래의 예상하지 못한 환율변동으로 인하여 기업 등이 보유하고 있는 외화표시 순자산(자 산-부채)의 가치 또는 현금흐름의 순가치가 변동될 수 있는 불확실성을 제거하는 것을 의 미한다."},{"t":"환매조건부매매/RP/Repo","d":"미래의 특정 시점에 특정 가격으로 동일한 증권을 반대방향으로 매수 및 매도할 것을 약 정하고 이루어지는 증권의 매매거래를 말한다."},{"t":"환어음","d":"환어음은 발행인이 직접 어음금액을 지급하지 아니하고 제3자인 지급인에게 일정한 금액 의 지급을 위탁하는 형식의 지급위탁증권이다."},{"t":"환율조작국","d":"1988년에 제정된 미국의 종합무역법에서 규정된 개념으로 동 법은 현저한 대미 무역흑 자 및 상당한 경상수지 흑자를 보인 국가를 환율조작국으로 지정할 수 있다."},{"t":"환전영업자(환전상)","d":"환전영업자는 외국통화의 매입·매도 또는 외국에서 발행한 여행자수표의 매입을 업으로 영위하는 자를 말한다."},{"t":"환차손/환차익","d":"환위험은 크게 회계적 환위험(또는 환산환위험)과 거래적 환위험으로 나누는데, 이중에 서도 회계적 환위험이란 해외지사 및 자회사의 재무제표를 모기업의 재무제표와 연결시 키기 위해 자산과 부채의 가치를 동일한 통화로 환산하는 과정에서 발생하는 환위험을 말한다."},{"t":"회사채","d":"회사채란 민간기업이 비교적 장기로 불특정 다수로부터 설비투자 자금 등 거액의 자금을 조달하기 위하여 정해진 이자와 원금의 지급을 약속하면서 발행하는 채권을 말한다."},{"t":"후방연쇄효과","d":"후방연쇄효과란 특정 산업에서 제품의 생산이 이루어질 때 그에 필요한 원자재, 부품, 기 계, 에너지, 물류 등 중간재의 수요가 증가하여 유발되는 경제적 파급 효과를 말한다."},{"t":"후순위금융채","d":"자기자본비율을 산정할 때 보완자본의 일종으로 분류되는 채권이다."},{"t":"후행종합지수","d":"개별 경제지표로는 파악하기 어려운 국민경제의 총체적인 경기수준을 파악하기 위하여 경기종합지수를 작성한다."},{"t":"Beyond GDP","d":"GDP(국내총생산)는 한 국가의 거시경제 성과를 파악하기 위해 고안된 경제지표이지만 인간의 총체적인 후생복지를 측정하기에는 여러 가지 한계가 있다는 지적을 받아 왔다."},{"t":"BIS 자기자본비율","d":"국제결제은행(BIS)의 바젤은행감독위원회(이하 ‘BCBS’)가 “국제업무를 수행하는 은행 의 자기자본비율은 8%를 초과해야 한다”고 제정한 국제적인 통일기준으로, 은행 보유 자 산에 내재된 리스크(위험가중자산) 대비 복원력(자기자본)의 비율로 산출한다."},{"t":"CAMEL-IR 방식/ROCA 방식/CACREL 방식","d":"은행의 경영실태평가방식으로는 CAMEL-IR, ROCA 및 CACREL 방식이 있는데, 일반 은행 본점 및 현지법인에 대해서는 CAMEL-IR 방식, 외은지점 및 국내 일반은행 국외 지점에 대해서는 ROCA 방식, 특수은행에 대해서는 CACREL 방식에 의해 평가한다."},{"t":"CDS프리미엄","d":"신용파산스왑(CDS; Credit Default Swap)은 채권 발행 기업이나 국가가 부도날 경우 제 3자로부터 손실액을 보상받을 수 있는 신용파생상품 거래이다."},{"t":"CLS은행","d":"CLS은행은 외환결제리스크 감축에 관한 국제결제은행(BIS)의 권고에 따라 1999년 주요 국제 상업은행들이 세계 주요 통화가 게재된 외환거래의 동시결제를 구현할 목적으로 설 립한 국제외환결제전문은행이다."},{"t":"CMO","d":"CMO(Collateralized Mortgage Obligation)는 미국에서 발행되는 주택담보대출증권의 일종으로, 패스스루(pass-through) 증권 및 모기지를 기초자산으로 하며, 해당 자산에 서 발생하는 현금흐름을 만기, 이자율, 조기상환 민감도가 서로 다른 여러 개의 트렌치 (tranche)로 구조화함으로써 투자자의 다양한 선호에 부합하도록 설계된 상품이다."},{"t":"CVIX","d":"CVIX(Currency Volatility Index, 외환시장 변동성 지수)는 향후 30일 동안의 환율변동 성에 대한 시장의 기대치를 나타내는 지수로 도이치방크나 JP모건 등 대형 투자은행이 발 표한다."},{"t":"DebtRank","d":"금융시스템의 상호연계성을 기반으로 부실전염 리스크를 정량적으로 평가하여 금융시스 템 전체의 안정성을 모니터링하는 지표로서, 특정 금융업권의 도산에 따른 충격이 상호거 래 익스포저를 통해 거래상대방에게 순차적으로 확산되어 나타나는 손실 합계가 전체 금 융업권 내 자본에서 차지하는 비중을 업권별로 계산하여 이를 단순 평균한 값이다."},{"t":"EC방식","d":"중앙은행이 통화정책을 수행함에 있어 금리와 통화량 가운데 어느 것을 보다 중시할 것인 지에 대한 판단은 시대에 따라 변해왔다."},{"t":"ESG경영","d":"환경(Environmental), 사회(Social), 지배구조(Governance)의 세 가지 요소를 중시하면 서 기업을 경영하는 방식을 말한다."},{"t":"ESTR","d":"ESTR(€STR, Euro Short-Term Rate)은 유럽중앙은행(ECB)이 발표하는 유로지역의 단 기금리 벤치마크이다."},{"t":"FedWatch","d":"FedWatch는 미 연준(Fed; 미국의 중앙은행)의 금리 결정에 대한 시장 참가자들의 기대 를 나타내며, 시카고상업거래소(CME; Chicago Mercantile Exchange)가 제공한다."},{"t":"FIMA Repo Facility","d":"FIMA Repo Facility(Foreign and International Monetary Authorities Repo Facility)는 미 연준이 외국 중앙은행 등이 보유하고 있는 미 국채를 환매조건부로 매입하 여 미 달러화 자금을 외국 중앙은행 등에게 공급하는 제도이다, 미 연준은 코로나19 팬데 믹에 대응하여 2020년 3월 이 제도를 한시적으로 도입하였다가 2021년 7월 상설제도로 전환하였다."},{"t":"FOMO현상","d":"FOMO현상(Fear Of Missing Out)은 다른 사람들이 누리는 중요한 경험이나 투자 기회 등을 자신만 놓치고 있다는 불안감이나 두려움을 느끼는 현상을 말한다."},{"t":"FTSE 지수","d":"영국의 FTSE Russell사가 작성, 발표하는 세계 주가지수를 말하며 ‘FT 지수’라고도 한다."},{"t":"G2(Group of Two)","d":"세계에서 경제적으로 영향력이 큰 두 국가라는 의미로서 미국과 중국을 가리키는 비공식 적인 용어이다."},{"t":"G7(Group of Seven)","d":"미국, 일본, 영국, 프랑스, 독일, 이탈리아, 캐나다 등 7개 선진국의 모임을 지칭한다."},{"t":"G20(Group of 20)","d":"G7에 속하는 7개국, 신흥시장국 12개국 및 유럽연합, 아프리카연합을 포함한 21개 회원 으로 구성된 국제회의체이다."},{"t":"GDP갭","d":"한 나라의 생산요소인 노동과 자본을 모두 동원(완전고용)하여 달성할 수 있는 최대 수준 의 GDP를 잠재GDP라고 한다."},{"t":"GDP디플레이터","d":"명목GDP를 실질GDP로 나누어 얻어지는 값을 GDP디플레이터라 한다."},{"t":"Herstatt 리스크","d":"외환결제과정에 내재된 리스크 중의 하나로서 외환거래 후 매도통화를 지급하였으나 거 래상대방이 파산하여 매입통화를 수취하지 못할 가능성, 즉 원금리스크를 Herstatt 리스 크라고도 부른다."},{"t":"IC카드","d":"IC(Integrated Circuit)카드는 신용카드 크기의 플라스틱카드에 마이크로프로세스와 IC 메모리가 내장된 IC칩을 탑재한 카드를 말한다."},{"t":"IFRS17","d":"IFRS17은 기존의 IFRS4를 대체하여 적용되고 있는 보험계약에 관한 새로운 국제회계기 준이다."},{"t":"IMF 스탠드바이협약","d":"IMF 스탠드바이협약(SBA; Stand-By Arrangement)은 국제통화기금(IMF)이 회원국과 체결하는 금융지원계약의 일종으로 회원국이 단기적인 국제수지 불균형이나 외환위기로 급격한 외환부족 사태에 직면하게 되었을 때 IMF로부터 신속하게 자금을 지원받아 경제 안정에 활용할 수 있도록 하는 제도이다."},{"t":"IMF 쿼타","d":"국제통화기금(IMF)에 대한 회원국의 출자금으로서 IMF 회원국의 국제수지 불균형 조정 등을 위한 신용공여 재원으로 사용될 뿐 아니라 투표권을 산출하고 IMF 신용 이용한도 와 특별인출권(SDR) 배분규모를 결정하는 기준이 된다."},{"t":"J커브효과","d":"이론적으로 환율이 상승할 경우 수출은 늘어나고 수입은 줄어들어 경상수지가 개선된다."},{"t":"KIKO","d":"환율이 특정 구간(barrier)에 도달하는 경우 옵션이 발효(KI; Knock-In)되거나 소멸(KO; Knock-Out)되는 조건이 부과된 비정형적인 통화옵션 상품이다."},{"t":"KP스프레드","d":"KP(Korean Paper)는 한국정부, 공기업, 금융기관 등이 해외시장에서 달러화 등 외화로 발행한 채권을 뜻한다."},{"t":"M&A","d":"기업경영의 효율성 제고와 시너지효과 창출 등을 위해 외부경영자원을 활용하는 것으로 우리나라에서는 ‘인수합병’으로 불리고 있다."},{"t":"MOVE","d":"MOVE(Merrill Lynch Option Volatility Estimate)는 미국 채권시장의 단기 변동성에 대한 시장의 기대치를 나타내는 지수로, BoA메릴린치가 발표한다."},{"t":"MSCI 지수","d":"미국의 모건스탠리 캐피털 인터내셔널(Morgan Stanley Capital International)사가 작 성, 발표하는 세계 주가지수를 말한다."},{"t":"N-B SRS","d":"은행간 상호연계성을 통해 전염되는 시스템 리스크를 측정하는 지표로, Network-Based Systemic Risk Scoring의 약자이다."},{"t":"NFC(Near Field Communication) 기술","d":"NFC(Near Field Communication) 기술은 근거리 무선 통신 기술로, 통상 10cm 이 내의 짧은 거리에서 기기간 무선 데이터 통신을 가능하게 하는 기술이다."},{"t":"Nowcasting","d":"“Now”와 “Forecasting”의 합성어로 현재 또는 가까운 미래의 경제 상황을 실시간 또는 매 우 짧은 시차로 추정하는 기법을 말한다."},{"t":"OIS","d":"OIS는 Overnight Index Swap의 약자로 금융기관 간에 단기 변동금리와 고정금리를 일 정 기간(주로 1일) 동안 서로 교환하는 금리스왑 계약을 말한다."},{"t":"P2P대출","d":"P2P대출(Peer-to-Peer Lending)은 온라인상에서 자금공급자(투자자)와 자금수요자 (차입자) 간 전통적인 금융회사의 중개 없이 자금중개가 이뤄지는 금융활동의 하나이다."},{"t":"P-CBO(Primary Collateralized Bond Obligation)","d":"P-CBO는 회사채 시장이 위축되거나 기업의 신용등급이 낮아 회사채를 직접 발행하기 어 려운 경우에 이들 기업의 회사채를 모아(pooling) 하나의 자산으로 유동화한 후 신용보증 기금 등 공공기관의 선순위 증권에 대한 지급보증을 통해 발행된 증권을 말한다."},{"t":"PF-ABCP","d":"유동화를 목적으로 설립된 특수목적회사(SPC; Special Purpose Company)가 부동산 개발사업 PF(Project Financing) 대출을 기초자산으로 하여 발행한 기업어음(Asset- Backed Commercial Paper)을 말한다."},{"t":"SOFR","d":"SOFR(Secured Overnight Financing Rate, 담보부 익일금리)은 미국채를 담보로 현 금을 하루(overnight) 동안 빌릴 때 적용되는 실거래 기반의 기준금리로 뉴욕 연준(FRB NY)이 발표하는 미달러화 단기금리의 대표적인 벤치마크이다."},{"t":"SWIFT","d":"SWIFT(Society for Worldwide Interbank Financial Telecommunication)는 금융거 래 관련 메시지를 안전하고 효율적으로 주고받기 위해 유럽 및 미주지역 은행들이 1973 년 브뤼셀에 설립한 국제금융통신망이다."},{"t":"Treasury Bill(T/B)","d":"Treasury Bill(T/B)은 미국 재무성이 발행하는 만기 4주(1개월), 13주(3개월), 26주(6 개월), 52주(1년) 등 1년 이하의 단기국채로서 이자지급이 없는 할인채(zero coupon bond)의 형태로 발행된다."},{"t":"VAN사업자","d":"통신사업자로부터 회선을 대여 받아 고도의 통신처리기능으로 부가가치를 높여 서비스 를 제공하는 통신회사를 말한다."},{"t":"VaR(Value at Risk)","d":"일정한 보유기간에 일정 신뢰구간내에서 시장가격이 불리한 방향으로 움직일 경우 대상 포지션으로부터 발생할 수 있는 추정 ‘최대손실금액’으로, 금융기관의 잠재적인 손실을 측정하는 지표이다."},{"t":"VIX Index","d":"미국 주식시장의 단기 변동성에 대한 시장의 기대치를 나타내는 지수로 시카고옵션거래 소(CBOE)에서 제공되며, 정식명칭은 CBOE Volatility Index이다."},{"t":"V-KOSPI","d":"V-KOSPI는 한국 증시의 변동성을 나타내는 지수로, 코스피200 옵션 가격을 기반으로 투자자들이 예상하는 미래 변동성을 측정한다."}];
let count=5,level='easy',qs=[],idx=0,score=0,wrong=[];
function chips(id,set){document.querySelectorAll('#'+id+' .chip').forEach(x=>x.onclick=()=>{document.querySelectorAll('#'+id+' .chip').forEach(y=>y.classList.remove('active'));x.classList.add('active');set(x.dataset.v)})}chips('counts',v=>count=+v);chips('levels',v=>level=v);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeQs(source){return shuffle(source).slice(0,Math.min(count,source.length)).map(item=>{let others=shuffle(terms.filter(x=>x.t!==item.t)).slice(0,3);return {item,q:`“${item.d}”에 해당하는 경제용어는?`,opts:shuffle([item,...others])}})}
function start(custom){let r=document.getElementById('range').value;let src=custom||terms;qs=makeQs(src);idx=0;score=0;wrong=[];setup.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');render()}
function render(){let q=qs[idx];qnum.textContent=`${idx+1} / ${qs.length}`;scoreNow.textContent=`정답 ${score}`;bar.style.width=`${idx/qs.length*100}%`;kind.textContent='개념 확인';question.textContent=q.q;options.innerHTML='';feedback.classList.add('hidden');next.classList.add('hidden');q.opts.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o.t;b.onclick=()=>answer(b,o,q);options.appendChild(b)})}
function answer(btn,o,q){document.querySelectorAll('.opt').forEach(b=>b.disabled=true);let ok=o.t===q.item.t;if(ok){score++;btn.classList.add('correct')}else{btn.classList.add('wrong');wrong.push(q.item);[...document.querySelectorAll('.opt')].find(b=>b.textContent===q.item.t)?.classList.add('correct')}feedback.innerHTML=`<b>${ok?'맞았어요!':'정답은 '+q.item.t+'예요.'}</b><br>${q.item.d}`;feedback.classList.remove('hidden');next.classList.remove('hidden');scoreNow.textContent=`정답 ${score}`}
next.onclick=()=>{idx++;if(idx<qs.length)render();else finish()};function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');bar.style.width='100%';let pct=Math.round(score/qs.length*100);finalScore.textContent=`${pct}점`;summary.textContent=`${qs.length}문제 중 ${score}문제를 맞혔어요.`;wrongList.innerHTML=wrong.length?'<h3>다시 볼 용어</h3>'+[...new Map(wrong.map(x=>[x.t,x])).values()].map(x=>`<div class="feedback"><b>${x.t}</b><br>${x.d}</div>`).join(''):'<div class="feedback">전부 맞혔어요. 다음에는 응용 문제에 도전해 보세요.</div>';retryWrong.style.display=wrong.length?'block':'none'}
startBtn=document.getElementById('start');startBtn.onclick=()=>start();retryWrong.onclick=()=>{count=wrong.length;start([...new Map(wrong.map(x=>[x.t,x])).values()])};restart.onclick=()=>{result.classList.add('hidden');setup.classList.remove('hidden')};
</script></body></html>
