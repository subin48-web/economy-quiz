<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경제용어 퀴즈</title><style>
:root{--bg:#f6f7fb;--card:#fff;--text:#15171a;--muted:#6d7480;--accent:#315efb;--good:#15803d;--bad:#c2410c;--line:#e7e9ee}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}main{max-width:680px;margin:auto;padding:22px 16px 70px}.brand{font-weight:900;font-size:24px}.sub{color:var(--muted);margin:6px 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 28px #1111;margin-bottom:14px}h1,h2,p{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chip,.opt,button,select{font:inherit}.chip{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:center;cursor:pointer}.chip.active{border-color:var(--accent);background:#eef2ff;color:#244bd4;font-weight:700}button.primary{width:100%;border:0;background:var(--accent);color:white;padding:15px;border-radius:15px;font-weight:800;cursor:pointer;margin-top:14px}.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:14px;border-radius:14px;margin:9px 0;cursor:pointer}.opt:hover{border-color:#aab7ff}.opt.correct{border-color:#86d29c;background:#f0fdf4}.opt.wrong{border-color:#f0a58a;background:#fff7ed}.progress{height:8px;background:#e9ecf3;border-radius:99px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:var(--accent);width:0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.feedback{padding:14px;border-radius:14px;background:#f6f7fb;margin-top:12px;line-height:1.55}.hidden{display:none}.score{font-size:46px;font-weight:900;margin:8px 0}.small{font-size:14px;color:var(--muted)}select{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:white;margin:6px 0 12px}label{font-size:14px;font-weight:700}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#315efb;font-size:12px;font-weight:700;margin-bottom:10px}
</style></head><body><main><div class="brand">경제용어 퀴즈</div><div class="sub">경제 용어를 문제로 익히고, 틀린 개념은 다시 풀어보세요.</div>
<section id="setup" class="card"><span class="tag">오늘의 학습</span><h2>퀴즈 설정</h2><label>학습 범위</label><select id="range"><option value="all">전체 용어</option><option value="market">시장·금융</option><option value="macro">거시경제</option></select><label>문제 수</label><div class="grid" id="counts"><div class="chip active" data-v="5">5문제</div><div class="chip" data-v="10">10문제</div></div><label style="display:block;margin-top:14px">난이도</label><div class="grid" id="levels"><div class="chip active" data-v="easy">개념 확인</div><div class="chip" data-v="hard">응용 문제</div></div><button class="primary" id="start">퀴즈 시작</button><p class="small" style="margin-top:12px">현재는 샘플 경제용어 10개가 들어 있는 데모 버전입니다.</p></section>
<section id="quiz" class="card hidden"><div class="meta"><span id="qnum"></span><span id="scoreNow"></span></div><div class="progress"><div class="bar" id="bar"></div></div><span class="tag" id="kind"></span><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden"></div><button class="primary hidden" id="next">다음 문제</button></section>
<section id="result" class="card hidden"><span class="tag">학습 결과</span><h2>퀴즈 완료!</h2><div class="score" id="finalScore"></div><p id="summary"></p><div id="wrongList"></div><button class="primary" id="retryWrong">틀린 문제 다시 풀기</button><button class="primary" style="background:#20242b" id="restart">새 퀴즈 시작</button></section>
</main><script>
const terms=[
{t:'인플레이션',d:'물가 수준이 전반적으로 지속 상승하는 현상',c:'macro',ex:'여러 상품과 서비스의 가격이 계속 올라 같은 돈으로 살 수 있는 양이 줄어드는 상황은?'},
{t:'디플레이션',d:'물가 수준이 전반적으로 지속 하락하는 현상',c:'macro',ex:'경기 위축과 함께 전반적인 물가가 계속 내려가는 현상은?'},
{t:'기준금리',d:'중앙은행이 통화정책의 기준으로 정하는 금리',c:'market',ex:'중앙은행이 물가와 경기 등을 고려해 결정하며 여러 시장금리에 영향을 주는 금리는?'},
{t:'유동성',d:'자산을 가치 손실을 크게 보지 않고 현금으로 바꾸기 쉬운 정도',c:'market',ex:'어떤 자산을 빠르게 현금화하기 쉬운지를 나타내는 개념은?'},
{t:'채권',d:'정부·기업 등이 돈을 빌리고 원금과 이자를 지급하기로 약속한 증권',c:'market',ex:'기업이 투자자에게 돈을 빌리고 만기에 원금과 약속된 이자를 지급하는 금융상품은?'},
{t:'GDP',d:'일정 기간 한 나라 안에서 생산된 최종 재화와 서비스의 시장가치',c:'macro',ex:'한 나라의 일정 기간 국내 생산 규모를 나타내는 대표 지표는?'},
{t:'CPI',d:'가계가 소비하는 대표 상품·서비스의 가격 변화를 측정한 지수',c:'macro',ex:'소비자가 구매하는 상품과 서비스의 가격 변화를 측정해 물가 흐름을 보는 지표는?'},
{t:'환율',d:'한 나라 통화와 다른 나라 통화를 교환하는 비율',c:'market',ex:'1달러를 사는 데 몇 원이 필요한지처럼 두 통화의 교환 비율을 뜻하는 말은?'},
{t:'시가총액',d:'상장기업의 현재 주가에 발행주식 수를 곱한 값',c:'market',ex:'상장기업의 시장에서 평가되는 주식 전체 가치를 나타내는 지표는?'},
{t:'경기침체',d:'경제활동이 전반적으로 위축되는 상태',c:'macro',ex:'생산·소비·투자 등 경제활동이 전반적으로 약해지는 상태는?'}];
let count=5,level='easy',qs=[],idx=0,score=0,wrong=[];
function chips(id,set){document.querySelectorAll('#'+id+' .chip').forEach(x=>x.onclick=()=>{document.querySelectorAll('#'+id+' .chip').forEach(y=>y.classList.remove('active'));x.classList.add('active');set(x.dataset.v)})}chips('counts',v=>count=+v);chips('levels',v=>level=v);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeQs(source){return shuffle(source).slice(0,Math.min(count,source.length)).map(item=>{let others=shuffle(terms.filter(x=>x.t!==item.t)).slice(0,3);return {item,q:level==='hard'?item.ex:`“${item.d}”에 해당하는 경제용어는?`,opts:shuffle([item,...others])}})}
function start(custom){let r=document.getElementById('range').value;let src=custom||terms.filter(x=>r==='all'||x.c===r);qs=makeQs(src);idx=0;score=0;wrong=[];setup.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');render()}
function render(){let q=qs[idx];qnum.textContent=`${idx+1} / ${qs.length}`;scoreNow.textContent=`정답 ${score}`;bar.style.width=`${idx/qs.length*100}%`;kind.textContent=level==='hard'?'상황 응용':'개념 확인';question.textContent=q.q;options.innerHTML='';feedback.classList.add('hidden');next.classList.add('hidden');q.opts.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o.t;b.onclick=()=>answer(b,o,q);options.appendChild(b)})}
function answer(btn,o,q){document.querySelectorAll('.opt').forEach(b=>b.disabled=true);let ok=o.t===q.item.t;if(ok){score++;btn.classList.add('correct')}else{btn.classList.add('wrong');wrong.push(q.item);[...document.querySelectorAll('.opt')].find(b=>b.textContent===q.item.t)?.classList.add('correct')}feedback.innerHTML=`<b>${ok?'맞았어요!':'정답은 '+q.item.t+'예요.'}</b><br>${q.item.d}`;feedback.classList.remove('hidden');next.classList.remove('hidden');scoreNow.textContent=`정답 ${score}`}
next.onclick=()=>{idx++;if(idx<qs.length)render();else finish()};function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');bar.style.width='100%';let pct=Math.round(score/qs.length*100);finalScore.textContent=`${pct}점`;summary.textContent=`${qs.length}문제 중 ${score}문제를 맞혔어요.`;wrongList.innerHTML=wrong.length?'<h3>다시 볼 용어</h3>'+[...new Map(wrong.map(x=>[x.t,x])).values()].map(x=>`<div class="feedback"><b>${x.t}</b><br>${x.d}</div>`).join(''):'<div class="feedback">전부 맞혔어요. 다음에는 응용 문제에 도전해 보세요.</div>';retryWrong.style.display=wrong.length?'block':'none'}
startBtn=document.getElementById('start');startBtn.onclick=()=>start();retryWrong.onclick=()=>{count=wrong.length;start([...new Map(wrong.map(x=>[x.t,x])).values()])};restart.onclick=()=>{result.classList.add('hidden');setup.classList.remove('hidden')};
</script></body></html>
