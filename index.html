<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경제용어 퀴즈</title><style>
:root{--bg:#f6f7fb;--card:#fff;--text:#15171a;--muted:#6d7480;--accent:#315efb;--good:#15803d;--bad:#c2410c;--line:#e7e9ee}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}main{max-width:680px;margin:auto;padding:22px 16px 70px}.brand{font-weight:900;font-size:24px}.sub{color:var(--muted);margin:6px 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 28px #1111;margin-bottom:14px}h1,h2,p{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chip,.opt,button,select{font:inherit}.chip{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:center;cursor:pointer}.chip.active{border-color:var(--accent);background:#eef2ff;color:#244bd4;font-weight:700}button.primary{width:100%;border:0;background:var(--accent);color:white;padding:15px;border-radius:15px;font-weight:800;cursor:pointer;margin-top:14px}.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:14px;border-radius:14px;margin:9px 0;cursor:pointer}.opt:hover{border-color:#aab7ff}.opt.correct{border-color:#86d29c;background:#f0fdf4}.opt.wrong{border-color:#f0a58a;background:#fff7ed}.progress{height:8px;background:#e9ecf3;border-radius:99px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:var(--accent);width:0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.feedback{padding:14px;border-radius:14px;background:#f6f7fb;margin-top:12px;line-height:1.55}.hidden{display:none}.score{font-size:46px;font-weight:900;margin:8px 0}.small{font-size:14px;color:var(--muted)}select{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:white;margin:6px 0 12px}label{font-size:14px;font-weight:700}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#315efb;font-size:12px;font-weight:700;margin-bottom:10px}
</style></head><body><main><div class="brand">경제용어 퀴즈</div><div class="sub">경제 용어를 문제로 익히고, 틀린 개념은 다시 풀어보세요.</div>
<section id="setup" class="card"><span class="tag">오늘의 학습</span><h2>퀴즈 설정</h2><label>학습 범위</label><select id="range"><option value="all">전체 용어</option><option value="market">시장·금융</option><option value="macro">거시경제</option></select><label>문제 수</label><div class="grid" id="counts"><div class="chip active" data-v="5">5문제</div><div class="chip" data-v="10">10문제</div></div><label style="display:block;margin-top:14px">난이도</label><div class="grid" id="levels"><div class="chip active" data-v="easy">개념 확인</div><div class="chip" data-v="hard">응용 문제</div></div><button class="primary" id="start">퀴즈 시작</button><p class="small" style="margin-top:12px">2026 경제금융용어 800선 PDF를 바탕으로 789개 설명 항목을 수록했습니다.</p></section>
<section id="quiz" class="card hidden"><div class="meta"><span id="qnum"></span><span id="scoreNow"></span></div><div class="progress"><div class="bar" id="bar"></div></div><span class="tag" id="kind"></span><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden"></div><button class="primary hidden" id="next">다음 문제</button></section>
<section id="result" class="card hidden"><span class="tag">학습 결과</span><h2>퀴즈 완료!</h2><div class="score" id="finalScore"></div><p id="summary"></p><div id="wrongList"></div><button class="primary" id="retryWrong">틀린 문제 다시 풀기</button><button class="primary" style="background:#20242b" id="restart">새 퀴즈 시작</button></section>
</main><script>
const terms=[{"t":"가계부실위험지수(HDRI)","d":"가구의 소득 흐름은 물론 금융 및 실물 자산까지 종합적으로 고려하여 가계부채의 부실 위험을 평가하는 지표로, 가계의 채무상환능력을 소득 측면에서 평가하는 원리금상환비 율(DSR; Debt Service Ratio)과 자산 측면에서 평가하는 부채/자산비율(DTA; Debt To Asset Ratio)을 결합하여 산출한 지수이다."},{"t":"가계수지","d":"가정에서 일정 기간의 수입(명목소득)과 지출을 비교해서 남았는지 모자랐는지를 표시한 것을 가계수지(Household’s Total Income and Expenditure)라 한다."},{"t":"가계순저축률","d":"일반적으로 저축률은 저축액을 처분가능소득으로 나눈 비율을 말한다."},{"t":"가계신용통계","d":"가계신용통계는 가계부문에 대한 신용공급 규모를 나타내는 통계이다."},{"t":"가계처분가능소득","d":"가계처분가능소득(PDI; Personal Disposable Income)은 가계가 마음대로 소비와 저 축으로 처분할 수 있는 소득을 의미한다."},{"t":"가교은행","d":"청산 대상 금융기관의 자산, 부채를 임시로 넘겨받아 예금, 출금 등의 업무를 대행하고 합 병, 채권채무관계 조정 등 후속조치를 수행하는 은행을 말한다."},{"t":"가산금리","d":"신용도 등의 차이에 따라 기준금리에 덧붙이는 금리를 가산금리(또는 스프레드, spread) 라고 한다."},{"t":"가상자산","d":"가상자산(Virtual Asset)은 분산원장 및 암호화 기술을 바탕으로 민간에 의해 디지털 토큰 형태로 발행되어 전자적으로 거래 또는 이전 가능한 자산이다."},{"t":"가상자산공개(ICO)","d":"가상자산공개(ICO; Initial Coin Offering)는 주로 혁신적인 신생기업(startup)이 가상 자산(virtual asset) 또는 디지털 토큰(digital token, 일종의 투자증명)을 이용하여 자 금을 조달하는 크라우드펀딩(crowd funding)의 한 방식이다."},{"t":"간접금융/직접금융","d":"자금 잉여주체와 자금 부족주체 사이에 은행이나 저축은행 신용협동기구 등 금융기관이 개입하여 자금을 중개하는 방식을 간접금융(Indirect Financing)이라고 한다."},{"t":"간접세/직접세","d":"조세는 납세의무자와 실제로 세금을 부담하게 되는 조세부담자가 일치하는지 여부에 따 라 간접세(Indirect Tax)와 직접세(Direct Tax)로 구분된다."},{"t":"간편 송금","d":"간편 송금은 모바일 앱이나 온라인 서비스를 통해 상대방에게 손쉽게 금전적 가치를 이전해 주는 서비스이다."},{"t":"감독자협의회(Supervisory College)","d":"다국적 금융기관들에 대한 효과적인 규제·감독을 위하여 다국적 금융기관의 본점이 소 재한 국가(home country)의 감독 당국과 동 기관의 지점 또는 자회사가 소재한 진출국 (host country)의 감독 당국들로 구성된 정보공유 및 감독협력 협의체를 의미한다."},{"t":"갑기금(Capital A)","d":"외국은행 국내지점의 대차대조표상 자본금계정으로 ① 외국은행 국내지점의 설치 및 영 업행위를 위하여 본점이 한국은행 등에 외화자금을 매각하여 해당 지점에 공급한 원화 자 금 ② 해당 외국은행 국내지점의 적립금에서 전입하는 자금 ③ 외국은행 국내지점을 추가 로 설치하기 위하여 이미 국내에 설치된 외국은행 국내지점의 이월이익잉여금에서 전입 하는 자금 등이 이에 해당한다."},{"t":"거래정보저장소","d":"거래정보저장소(TR; Trade Repository)는 장외파생상품(OTC Derivatives) 거래에 대한 상세 정보를 중앙 집중적으로 수집, 보관 및 관리하는 금융시장인프라(FMI)이다."},{"t":"거시건전성 정책","d":"개별 금융회사의 부실 방지를 목적으로 하는 미시건전성정책(Microprudential policy) 과 달리 경제전체의 금융안정을 위해 시스템 리스크(systemic risk)를 억제하는 정책을 의 미한다."},{"t":"거액익스포저 규제","d":"금융기관의 특정 차주 등에 대한 신용공여가 과도한 경우 해당 거래상대방의 채무불이행 등의 발생시 해당 금융기관의 자본건전성을 심하게 훼손할 가능성(편중리스크)이 있다."},{"t":"거액지급시스템","d":"참가기관 간에 주로 거액의 자기자금 또는 고객자금 이체를 위한 지급지시가 이루어지 는 시스템을 말한다."},{"t":"결제","d":"결제(Settlement)는 개인이나 기업 등 경제주체가 자금거래 또는 금융자산 거래를 한 후 각각의 지급지시에 따라 자금 또는 증권이 이전되어 법적인 채권·채무가 종결되는 과정 이다."},{"t":"결제리스크","d":"결제리스크는 예기치 못한 사정으로 인하여 결제가 예정대로 이루어지지 않을 가능성 또 는 그로 인하여 야기되는 손실발생 가능성으로 정의할 수 있다."},{"t":"결제부족자금 공동분담제","d":"결제부족자금 공동분담제(Loss-Sharing)는 참가기관이 거래에 따른 지급의무를 이행하지 않는 경우 지급되지 않은 채무를 여타 참가기관들이 공동분담함으로써 결제가 완료되도록 보장하는 방안이다."},{"t":"결제완결성","d":"지급결제시스템을 통해 이루어진 참가기관의 지급지시가 결제된 이후에는 어떠한 상황 이나 법률에 의해서도 취소되거나 무효화되지 않고 해당 지급결제시스템의 운영 규칙 에 따라 무조건적으로 종결되는 것을 의미한다."},{"t":"겸업주의/전업주의","d":"하나의 금융회사가 제공할 수 있는 금융서비스의 종류를 어떻게 정하느냐에 따라 겸업주 의(Universal banking)와 전업주의(Specialized banking)로 구분된다."},{"t":"경기","d":"경기(Business Conditions)라는 단어는 일상생활에서 경제적인 형편을 뜻하는 말로 자 주 사용된다."},{"t":"경기순응성","d":"경기순응성이란 통상 경제주체의 위험인식 및 행위, 금융의 제도 및 규제 등의 효과가 경 기변동의 움직임과 같은 방향으로 움직이는 것을 의미한다."},{"t":"경기조절정책/경제안정화정책","d":"경기조절정책(Business Adjustment Policy) 또는 경제안정화정책(Stabilization Policy) 은 경기가 지나친 확장 또는 수축 현상을 보일 경우 이를 정상 수준으로 되돌리기 위해 정 책당국이 취하는 제반 조치를 말한다."},{"t":"경기종합지수","d":"산업생산지수, 소매판매액지수 등 개별 경제지표들은 경제활동의 한 측면만을 반영하고 있어 나라 경제의 전반적인 상황을 종합적으로 파악하기 어렵다."},{"t":"경상수지","d":"경상수지는 재화나 서비스를 외국과 사고파는 거래 즉 경상거래의 결과로 나타나는 수지 를 말한다."},{"t":"경영실태평가/은행경영실태 평가등급제도","d":"경영실태평가는 금융감독당국이 임점 검사 시 금융기관의 경영실태 전반을 점검·평가 하기 위한 제도로, 각 금융기관의 경영실적, 경영의 건전성, 경영진의 경영능력, 법규준 수 상황 및 리스크 관리실태 등 다양한 평가부문을 종합적이고 통일적인 방식에 따라 일 정한 등급으로 평가하여 금융기관의 경영상태를 체계적이고 객관적으로 확인하는 방법 의 하나이다."},{"t":"경제 서프라이즈 지수","d":"경제 서프라이즈 지수는(ESI; Economic Surprise Index)는 실제로 발표된 경제지표가 시장의 전망치(예상치, 컨센서스)와 얼마나 차이가 있는지를 수치로 나타내는 지표이다."},{"t":"경제성장률","d":"경제성장률이란 일정 기간(분기 또는 연간) 중 한 나라의 경제규모, 즉 국민소득 규모가 늘어난 정도를 백분율로 표시한 것이다."},{"t":"경제심리지수","d":"경제심리지수란 한국은행이 기업가 또는 소비자들의 경제에 대한 인식을 조사하여 작성한 지표이며, 대표적으로 조사대상을 기업가로 하는 기업경기실사지수(BSI; Business Survey Index)와 소비자로 하는 소비자동향지수(CSI; Consumer Survey Index)가 있다."},{"t":"경제전망보고서","d":"다양한 경제지표와 세계 경제 동향 등을 바탕으로 향후 경제 상황이 어떻게 전개될지를 분석하고 예측한 보고서를 말한다."},{"t":"경제협력개발기구(OECD)","d":"제2차 세계대전 직후 유럽경제 부흥 지원을 위해 설립되었던 유럽경제협력기구(OEEC)의 18개국과 미국, 캐나다 등 총 20개 선진국이 1961년 9월에 설립한 국제기구이다."},{"t":"경제활동인구/비경제활동인구/경제활동참가율","d":"만15세 이상 인구 중 일할 수 있는 능력과 취업의사를 동시에 갖춘 사람을 경제활동인구 라 한다."},{"t":"경제후생지표","d":"복지지표로서 한계성을 갖는 국민총소득(GNI)을 보완하기 위해 미국의 노드하우스(W."},{"t":"경직적 물가지수","d":"소비자물가지수를 구성하는 품목들은 가격이 경직적으로 움직이는 품목과 신축적으로 움 직이는 품목으로 나누어 볼 수 있는데, 그중 경직적으로 움직이는 품목들을 대상으로 만든 물가지수를 경직적 물가지수, 신축적으로 움직이는 품목을 대상으로 한 물가지수를 신축 적 물가지수라고 한다."},{"t":"계절변동조정시계열","d":"경제의 움직임은 주로 일, 주, 월, 분기 또는 연간 등 일정기간을 기준으로 통계를 수집하 여 파악하는데 이를 시계열이라 한다."},{"t":"계좌대체","d":"증권거래시 실물증권을 주고받는 대신 양자 모두 계좌를 가진 중앙예탁기관 내에서 계 좌간 이전하는 방식으로 장부상 처리하는 것을 말한다."},{"t":"고객확인절차(KYC)","d":"고객확인절차(KYC; Know Your Customer)는 테러자금조달 및 자금세탁 등 불법거래 차단을 위해 관계당국이 부여한 의무에 따라 고객의 신원을 식별하고 확인하는(verify) 업 무절차를 뜻한다."},{"t":"고용률","d":"고용률은 통계청에서 매월 실시하고 있는 경제활동인구조사를 통해 집계된 15세 이상 인 구 중에서 취업자가 차지하는 비율을 말한다."},{"t":"고용보조지표","d":"국제노동기구(ILO)에서는 노동 공급과 수요가 일치하지 않아서 일하고 싶은 욕구가 있음 에도 불구하고 일을 하고 있지 못하는 노동력의 크기를 나타내는 고용보조지표를 새로이 확정(2013월 10월)한 바 있다."},{"t":"고용유발효과/취업유발효과","d":"노동유발효과는 소비, 투자, 수출 등 최종수요의 발생이 생산을 유발하고 생산이 다시 노 동수요를 유발하는 파급 메커니즘에 기초하여 최종수요와 노동유발을 연결시킴으로써 분 석한다."},{"t":"고정금리","d":"고정금리란 최초 약정한 금리가 만기까지 그대로 유지되는 금리를 의미하며 변동금리 란 일정 주기별로 시장금리를 반영하여 약정금리가 변동하는 금리를 의미한다."},{"t":"고정금리부채권(SB)","d":"고정금리부채권(Straight Bond)이란 정해진 기일에 고정된 이자를 지급하고 정해진 만기 에 원금을 지급하는 가장 일반적인 형태의 채권으로 전환사채(CB; Convertible Bond)의 주식전환권과 같이 특별한 조건이 없는 채권을 말한다."},{"t":"고정이하여신비율","d":"은행은 보유하고 있는 여신을 자산건전성에 따라 5단계로 분류하여 관리하고 있다."},{"t":"고정자본소모","d":"생산활동에는 공장, 기계설비 등 고정자본(시설)이 필요한데 이들은 생산활동 과정에서 마모되기 마련이다."},{"t":"고정환율제도/자유변동환율제도","d":"환율제도는 고정환율제도(Fixed Exchange Rate System)와 자유변동환율제도(Free Floating Exchange Rate System)를 양극단으로 하여 이를 절충하는 다양한 형태로 분 류될 수 있다."},{"t":"고통지수","d":"소비자물가상승률과 실업률을 더한 값으로 1975년 미국의 경제학자 오쿤(A."},{"t":"골디락스경제","d":"골디락스경제(Goldilocks Economy)는 경기과열에 따른 인플레이션과 경기침체에 따 른 실업을 염려할 필요가 없는 최적 상태에 있는 건실한 경제를 가리킨다."},{"t":"공개시장운영","d":"공개시장운영(Open Market Operation)은 중앙은행이 금융시장에서 금융기관을 상대로 증권을 매매하여 시중유동성이나 시장금리 수준에 영향을 미치는 통화정책수단이다."},{"t":"공공재","d":"공공재는 모든 개인이 공동으로 이용할 수 있는 재화 또는 서비스를 의미한다."},{"t":"공급병목","d":"제품이나 서비스가 생산자로부터 소비자에게 전달되는 특정 단계에서 목이 좁은 병 입구 처럼 원활한 흐름이 이루어지지 않아 전체 공급망이 지연되거나 막히는 현상을 말한다."},{"t":"공급사용표(SUT)","d":"산업연관표는 투입산출표(Input-Output Tables)와 공급사용표(Supply and Use Tables)로 구성되는데, 투입산출표는 상품을 기준으로, 공급사용표는 산업을 기준으로 생산내역을 나타낸 표이다."},{"t":"공급탄력성","d":"공급탄력성은 가격변화에 대한 공급의 민감도를 측정하는 척도이다."},{"t":"공동부유","d":"공동부유(共同富裕, Common Prosperity)는 시진핑 중국 국가주석이 2021년 이후 강조 한 주요 정책 방향 중 하나로서 소수만 부유해지는 것이 아니라 사회 전체가 균형 있게 번 영하고 부를 나누어 모든 국민이 함께 잘사는 사회를 만들자는 것을 의미한다."},{"t":"공매도","d":"공매도(Short Selling)는 주식시장에서 투자자가 주식을 보유하지 않은 상태에서 주가 하 락을 예상하고 금융기관으로부터 주식을 빌려 먼저 매도한 후, 주가가 하락하면 시장에서 주식을 매입하여 되갚은 후 차익을 얻는 투자를 말한다."},{"t":"관리변동환율제도","d":"환율이 장기적으로 외환시장의 수급 상황에 따라 결정되도록 하지만, 단기적으로는 정부와 중앙은행이 적정하다고 판단하는 수준에서 환율을 안정시키기 위해 수시로 외환시장에 개 입하여 환율 수준을 관리하는 환율제도이다."},{"t":"관리통화제도","d":"관리통화제도는 금본위제도와는 달리 중앙은행이 통화량을 직접 조절하여 경제를 안정시 키는 제도이다."},{"t":"광의통화(M2)","d":"광의통화(M2)는 경제 내에 유통되는 화폐규모를 측정하는 통화지표의 하나로서, 지급결 제기능을 중시하여 작성하는 협의통화(M1) 외에도 약간의 이자소득 손실을 감수한다면 언제든지 인출이 가능한 가치저장기능이 있는 금융상품까지 포함된다."},{"t":"교환사채(EB)","d":"교환사채(EB; Exchangeable Bond)란 사채권자의 의사에 따라 교환사채 발행기업이 보 유하고 있는 타사 주식 등 여타의 유가증권과 교환할 수 있는 선택권이 부여된 사채를 말한다."},{"t":"교환성 통화","d":"국제적인 통용력을 가진 특정 국가의 통화를 말한다."},{"t":"구독경제","d":"소비자가 제품이나 서비스를 소유하지 않은 채 일정한 금액을 주기적으로 지불하면서 사 용하는 경제 모델을 말한다."},{"t":"구매력평가 환율","d":"구매력평가(PPP; Purchasing Power Parity) 환율은 해당 통화의 실질 구매력을 기준으 로 평가한 환율이다."},{"t":"구인배수","d":"노동의 수요와 공급 상황을 나타내는 지표로서 일자리수를 취업 희망자수로 나누어 구하 는데 인력수급동향을 파악하는데 주로 이용된다."},{"t":"국가경쟁력","d":"국가경쟁력은 한 나라가 경제성장을 지속하고, 국민들의 삶의 질을 향상시킬 수 있는 능 력을 말한다."},{"t":"국가신용등급","d":"한 나라가 채무를 이행할 능력과 의사가 얼마나 있는지를 평가하여 등급으로 표시한 것으 로 국제금융시장에서 차입금리나 투자여건을 판단하는 기준이 된다."},{"t":"국가채무","d":"국가채무란 정부가 재정적자 보전 등을 목적으로 국내외로부터 자금을 차입함으로써 발 생하는 채무를 말한다."},{"t":"국고금 실시간 전자이체","d":"국고금 실시간 전자이체란 정부가 지급할 국고금이 실시간으로 각 채권자의 예금계좌로 바로 입금되게 하는 것을 말한다."},{"t":"국고대리점","d":"국가의 경제활동도 민간의 경제활동과 마찬가지로 금전 수수를 수반하게 되는데 이와 같 은 경제활동에 수반되는 일체의 현금을 통상 국고금이라 한다."},{"t":"국고수표","d":"국고수표는 지출관이 국고금 지출을 위하여 발행하는 수표로 과거 국고금의 기본지급수 단이었으나 2003년 1월 1일 「국고금관리법」의 시행으로 국고금 실시간 전자이체제도가 실시됨으로써 국고금 지급방식이 국고수표 사용방식에서 수취인의 예금계좌로 바로 입금 되도록 변경된 이후 사용하지 않고 있다."},{"t":"국고전산망","d":"2003년 1월 한국은행이 국고업무를 전자적으로 처리하기 위하여 구축한 전산망을 국고 전산망이라고 말하며 정부(디지털예산·회계시스템(dBrain+)), 한국은행, 금융기관(우정 사업본부 포함) 및 금융결제원의 전산시스템을 서버접속 방식으로 연결한다."},{"t":"국내공급물가지수","d":"국내공급물가지수는 생산자물가지수와 수입물가지수를 결합하여 국내시장에 공급되는 상품 및 서비스의 종합적인 가격 수준을 지수화한 것이다."},{"t":"국내총생산(GDP)","d":"국내총생산(GDP; Gross Domestic Product)은 한 나라의 영역 내에서 가계, 기업, 정부 등 모든 경제주체가 일정 기간 생산활동에 참여하여 창출한 부가가치 또는 최종 생산물 을 시장가격으로 평가한 합계로서 여기에는 국내에 거주하는 비거주자(외국인)에게 지급 되는 소득도 포함된다."},{"t":"국내총투자율","d":"국내총투자율(Gross Domestic Investment Ratio)은 국민경제가 구매한 재화 중에서 자 산의 증가로 나타난 부분이 국민총처분가능소득에서 차지하는 비율을 의미한다."},{"t":"국민계정체계(SNA)","d":"국민계정은 국민경제의 순환과 변동을 체계적으로 기록한 사회회계로서 경제활동을 거 래형태별 및 거래에 참가하는 경제주체별로 파악하여 복식부기 방식으로 기록한 것이다."},{"t":"국민대차대조표","d":"국민대차대조표(National Balance Sheet)는 특정 시점에서 국민경제 또는 비금융법인기 업, 금융법인기업, 일반정부, 가계 및 비영리단체, 국외 등 각 경제주체가 보유하고 있는 유·무형 실물자산 및 금융자산/부채의 가액과, 자산에서 부채를 차감한 순자산을 기록한 스톡통계이다."},{"t":"국민부담률","d":"국민부담률(total tax revenue as percentage of GDP)이란 조세와 사회보장기여금이 명목 국내총생산(GDP)에서 차지하는 비중(조세부담률+사회보장부담률)을 말한다."},{"t":"국민소득","d":"국민소득(NI; National Income)은 한 나라 국민이 제공한 생산요소에서 발생한 소득의 총액, 즉 노동에 대한 대가인 피용자보수와 자본 및 경영에 대한 대가인 영업잉여의 합계 로서 고정자본소모와 순생산 및 수입세는 포함되지 않는다."},{"t":"국민소득 3면 등가의 법칙","d":"국내총생산(GDP)은 생산, 지출, 분배의 세 측면에서 측정할 수 있으며 이론적으로 각 측 면에서 측정된 값은 차이가 없게 된다."},{"t":"국민연금","d":"일정기간 동안 보험료를 납부하면 노후에 연금을 지급받아 기본적인 생활을 보장받을 수 있도록 설계된 공적 연금 제도이다."},{"t":"국민처분가능소득(NDI)/국민총처분가능소득(GNDI)","d":"국민처분가능소득(NDI; National Disposable Income)은 나라 경제 전체가 소비나 저 축으로 자유로이 처분할 수 있는 소득으로서 거주자와 비거주자 간의 소득이전이 반영된 것이다."},{"t":"국민총소득(GNI)","d":"국민총소득(GNI; Gross National Income)은 한 나라의 국민이 일정 기간 동안 벌어들인 임금, 이자, 배당 등의 소득을 모두 합친 것이다."},{"t":"국부펀드","d":"국부펀드(Sovereign Fund)는 주로 투자수익을 목적으로 다양한 종류의 국내외 자산에 투 자·운용하는 국가 보유 투자기금을 말한다."},{"t":"국외순수취경상이전","d":"국외순수취경상이전은 거주자와 비거주자 간에 반대급부 없이 일어나는 이전거래로 국외 수취경상이전에서 국외지급경상이전을 차감하여 구하며 거래주체에 따라 민간이전과 공 공이전으로 구분할 수 있다."},{"t":"국외순수취요소소득","d":"국외순수취요소소득은 한 나라의 국민이 국외에서 노동, 자본 등의 생산요소를 제공한 대 가로 받은 국외수취요소소득에서 국내의 외국인이 생산활동에 참여함으로써 발생한 국외 지급요소소득을 차감한 것으로 국외순수취 기업 및 재산 소득과 피용자보수를 더하여 구 한다."},{"t":"국외저축","d":"개별 경제주체가 모자라는 돈을 다른 사람으로부터 조달하는 것과 마찬가지로 국민경제 에서도 투자가 저축을 초과하게 되면 부족한 돈을 국외로부터 조달하게 되는데 이를 국외 저축(foreign savings)이라고 한다."},{"t":"국외투자율","d":"국외투자율은 국민총처분가능소득(GNDI; Gross National Disposable Income) 중 총 저축에서 국내투자를 차감한 부분이 차지하는 비율을 의미한다."},{"t":"국제결제은행(BIS)","d":"BIS(BIS; Bank for International Settlements)는 1930년 헤이그협정을 모체로 설립된 세계에서 가장 오래된 국제금융기구로서 중앙은행 간 정책협력을 주요기능으로 하고 있 으며 현재 60개 중앙은행이 회원으로 참여하고 있다."},{"t":"국제금융시장","d":"국제금융시장이란 국경을 넘어 자금의 수요와 공급을 연결해 주는 시장 또는 모든 거래 메커니즘을 말하며 두 가지 의미로 사용된다."},{"t":"국제금융중심지","d":"특정 국가나 지역이 국제금융시장으로 기능하기 위해서는 자국 통화의 국제통용성, 상대 적으로 우월한 기초경제력, 고도로 발달된 금융시장과 다양한 장단기 금융수단의 자유로 운 거래, 전 세계시장 정보의 신속 저렴한 공급, 세계적인 상품 및 서비스거래의 중심지 등의 요건을 두루 갖추어야 한다."},{"t":"국제산업연관표","d":"국제산업연관표(International Input-Output Tables)란 국가 간 수출입을 매개로 여러 나라의 산업연관표를 연결하여 하나의 산업연관표로 작성한 것이다."},{"t":"국제수지(BOP)","d":"일정 기간 동안 한 나라의 거주자와 비거주자 간에 발생한 경제적 거래에 수반되는 수입 과 지급의 차이를 의미한다."},{"t":"국제수지표","d":"일정 기간 동안 한 나라의 거주자와 비거주자 간에 발생한 경제적 거래를 국제기준에 따 라 체계적으로 기록한 표이다."},{"t":"국제원유가격","d":"원유는 전세계적으로 수백 종이 거래되고 있다."},{"t":"국제증권감독기구(IOSCO)","d":"국제증권감독기구(IOSCO; International Organization of Securities Commissions) 는 전 세계의 증권 규제기관들이 모인 국제적인 기구로서 130여개 국가가 회원국으로 참 여하고 있다."},{"t":"국제통화기금(IMF)","d":"국제통화 및 금융제도의 안정을 도모하기 위한 국제금융기구로서 미국 워싱턴에 본부를 두고 1945년 12월 설립되었다."},{"t":"국제통화시장(IMM)","d":"국제통화시장(IMM; International Monetary Market)은 1972년 미국 시카고상업거래 소(CME) 내에 설립된 세계 최초의 통화선물 전문거래소이다."},{"t":"국제투자대조표(IIP)","d":"국제투자대조표(IIP; International Investment Position)는 일정 시점 현재 한 나라 거 주자의 비거주자에 대한 금융자산(대외투자) 및 금융부채(외국인투자) 잔액을 기록한 통 계표로서 국제수지의 금융계정(직접투자, 증권투자, 파생금융상품, 기타투자, 준비자산) 과 포괄범위가 동일하다."},{"t":"국제회계기준","d":"국제회계기준(IFRS; International Financial Reporting Standards)은 기업의 회계 처리와 재무제표에 대한 국제적 정합성을 높이기 위해서 국제회계기준위원회(IASB; International Accounting Standards Board)가 제정한 회계처리기준을 말한다."},{"t":"국채","d":"국채란 정부가 다양한 목적의 재정자금을 조달하기 위해 발행하는 채권을 말한다."},{"t":"국채선물","d":"국채선물이란 국가가 발행하는 채권을 기초자산으로 하는 선물거래를 의미한다."},{"t":"규모의 경제","d":"일반적인 경우 기업이 재화 및 서비스 생산량을 늘려감에 따라 추가적으로 소요되는 평균 생산비용도 점차 늘어난다."},{"t":"규제 샌드박스","d":"규제 샌드박스(Regulatory Sandbox)는 핀테크 기업이 현행 규제를 적용받지 않으면서 자신의 혁신적인 금융상품과 비즈니스모델을 시험할 수 있는 공간이나 제도를 뜻한다."},{"t":"그램-리치-블라일리법","d":"1999년 11월 미국 의회가 제정한 법으로서 공식 명칭은 「금융서비스현대화법(The Financial Services Modernization Act of 1999)」이다."},{"t":"그린본드","d":"그린본드는 조달 자금을 기후 및 환경 관련 사업에 사용하는 것을 전제로 발행되는 특수 목적 채권이다."},{"t":"그림자금융/비은행금융중개(NBFI)","d":"집합투자기구(MMF·채권형·혼합형 펀드 등), RP 거래, 유동화기구 등과 같이 은행시스템 밖에서 신용중개기능을 수행하지만 은행 수준의 건전성 규제와 예금자보호가 적용되지 않는 기관 또는 활동을 이르는 용어이다."},{"t":"근원인플레이션율","d":"근원인플레이션율(Core Inflation Rate)은 물가변동을 초래하는 여러 요인들 가운데 일 시적인 공급충격의 영향을 제외한 기조적인 물가상승률을 말한다."},{"t":"글래스-스티걸법","d":"미국 의회가 제정한 법으로 공식 명칭은 「1933년 은행법(Banking Act of 1933)」이다."},{"t":"글로벌 가치사슬(GVC)","d":"글로벌 가치사슬(GVC; Global Value Chain)은 상품의 설계, 부품과 원재료의 조달, 생 산, 유통, 판매에 이르기까지 각 세분화된 과정이 어느 한 국가가 아닌 비용면에서 우위가 있는 국가에서 이루어지면서 각 단계별로 부가가치가 창출되는 세계교역의 패러다임을 말한다."},{"t":"글로벌 공급망 압력 지수","d":"글로벌 공급망 압력지수(GSCPI; Global Supply Chain Pressure Index)는 국제 교역이 이루어지는 과정에서 공급망이 얼마나 원활히 작동하는지 보여주는 지표이다."},{"t":"글로벌금융안전망","d":"금융위기 등으로 인하여 외화유동성이 부족해지는 경우에 대비하기 위하여 각국이 외화 유동성을 인출하거나 지원받는 각종 제도적 장치들을 총칭하여 글로벌금융안전망이라고 한다."},{"t":"글로벌 금융위기","d":"글로벌 금융위기는 전 세계 금융시스템에 심각한 혼란을 일으키는 위기 상황을 의미한다."},{"t":"금리선물","d":"금리선물(Interest Rate Futures)이란 기초자산인 금리를 거래대상으로 하며 현재의 시 점에서 정한 가격으로 미래의 특정 시점에서 사거나 팔 것을 약정하는 계약을 말하다."},{"t":"금리스왑","d":"금리스왑(IRS; Interest Rate Swaps)이란 금리변동위험 헤지 및 차입비용 절감 등을 위하 여 거래당사자간에 원금교환 없이 정기적으로 통상 3개월마다 변동금리(91일물 CD금리) 와 고정금리(IRS금리)를 교환하는 거래를 말한다."},{"t":"금리자유화","d":"금리자유화란 금리규제를 철폐함으로써 금리가 시장의 자금수급에 따라 자유로이 결정될 수 있도록 하는 조치이다."},{"t":"금리평가이론","d":"완전한 금융시장에서, 즉 국경 간 자본이동에 규제가 없고 거래비용이나 세금 등을 고려 하지 않은 경우, 양국 간의 금리 차는 선물환 프리미엄(또는 스왑레이트)과 같다는 이론이 다."},{"t":"금본위제","d":"금본위제란 각국의 통화가치를 순금의 일정한 중량으로 정해 놓고 금화의 자유로운 주조 와 수출입을 허용하며 이를 지폐나 예금통화 등과 교환할 수 있도록 하는 제도이다."},{"t":"금산분리","d":"산업자본과 금융자본이 결합하는 것을 제한하는 원칙을 금산분리라고 한다."},{"t":"금융EDI","d":"EDI(Electronic Data Interchange)는 기업 상호 간에 접속된 컴퓨터를 이용하여 재화 와 용역의 거래정보를 표준화된 양식으로 교환하여 상거래를 처리함으로써 각종 서류작 성 및 거래 정보의 컴퓨터 중복입력 등을 생략하고 업무처리의 정확성 및 효율성을 높이 기 위해 개발된 시스템이다."},{"t":"금융공황","d":"금융공황(Banking Panic)은 일부 금융기관이 실물경제 침체 등으로 인한 대출 부실화로 심각한 경영난에 빠졌을 때 예금인출사태(bank run)가 해당 금융기관만이 아닌 다른 금 융기관에까지 급속하게 확산되어 금융시장 전체가 신용경색 사태에 직면하는 현상을 말 한다."},{"t":"금융불안지수(FSI)","d":"금융불안지수(FSI; Financial Stress Index)는 금융불안 가능성을 속보성 있게 판단하 는 지수이다."},{"t":"금융사이클","d":"경제주체의 위험추구 성향, 신용담보로 제공되는 실물자산의 가치변동 등이 상호작용 하면서 나타나는 금융변수들의 종합적인 순환변동을 의미한다."},{"t":"금융상황지수(FCI)","d":"금융상황지수(FCI; Financial Conditions Index)는 전반적인 금융여건의 완화 또는 긴 축 여부를 판단하기 위한 지수이다."},{"t":"금융시스템 상호연계성","d":"금융불안을 초래할 수 있는 시스템 리스크는 시계열 차원뿐만 아니라 특정 시점에서 종합 적으로 파악할 필요가 있는데, 특정 시점에서 시스템 리스크를 초래할 수 있는 핵심 요인 인 상호연계성은 해당 금융업권(기관)이 영업활동 과정에서 여타 금융업권(기관)과 밀접 하게 연결된 정도를 의미한다."},{"t":"금융시장인프라","d":"금융시장인프라(FMI; Financial Market Infrastructure)는 금융 거래지급, 청산, 결제, 기록 등을 가능하게 하는 시스템과 기관들을 총칭하는 용어이다."},{"t":"금융안정","d":"금융회사들이 정상적인 자금중개기능을 수행하고, 금융시장 참가자들의 신뢰가 유지되는 가운데 금융인프라가 잘 구비되어 있어 금융시스템이 원활히 작동하는 상태를 의미한다."},{"t":"금융안정위원회(FSB)","d":"기존 금융안정포럼(FSF)의 국제금융시장 안정 기능을 보다 강화하기 위하여 동 포럼의 참여 대상, 책무, 권한 등을 확대·개편하여 2009년 4월 금융안정위원회(FSB; Financial Stability Board)가 설립되었다."},{"t":"금융연관비율(골드스미스비율)","d":"금융연관비율(Financial Interrelations Ratio)은 한 나라의 금융자산 잔액을 유형자산 (실물자산 또는 국부 = 유형자산 + 순 대외자산) 잔액으로 나눈 비율로 골드스미스 (R."},{"t":"금융의 증권화","d":"금융의 증권화(Securitization)란 금융기관이 보유하고 있는 대출채권(loan claim) 등 유 동성이 낮은 자산을 매매 가능한 유가증권 형태로 전환하는 자산유동화를 지칭한다."},{"t":"금융의 탈중개화","d":"분산원장 등 신기술의 출현과 핀테크의 발달에 따라 금융업의 분화 현상이 심화됨으로써 금융서비스가 더 이상 기존 금융시스템과 중개기관에 의존하지 않고 다양한 형태로 분절 되는 탈중개화(disintermediation) 및 탈집중화(decentralization)되는 경향이 나타나고 있다."},{"t":"금융의 탈집중화","d":"금융의 탈집중화(Decentralization)는 탈중개화와 유사한 개념으로 분야별 금융시장에 새로 진입한 핀테크 업체들의 파괴적인 경쟁력 때문에 금융 분야별로 서비스가 더 세분 화되는(unbundling) 현상을 말한다."},{"t":"금융이해력","d":"금융이해력은 재무적 자원을 효과적으로 관리하고 생애 전반에 걸쳐 재정적 안정을 확보 하기 위해 필요한 금융 지식, 기술, 태도 등을 포괄하는 능력을 의미한다."},{"t":"금융제도","d":"금융거래에 관한 체계와 규범을 총칭하는 개념으로 금융시장, 금융기관, 금융하부구조 (infra-structure)로 구분된다."},{"t":"금융중개지원대출제도","d":"한국은행의 금융중개지원대출제도는 은행의 중소기업에 대한 대출 확대를 유도하기 위 해 은행별 중소기업 대출 취급실적에 비례하여 한국은행이 낮은 금리로 자금을 공급하는 대출제도를 말한다."},{"t":"금융지주회사","d":"금융지주회사(Financial Holding Company)는 지분 보유를 통해 은행, 증권, 보험, 자 산관리 등의 금융업을 영위하는 자회사들을 소유하여 경영하는 모회사를 말한다."},{"t":"금융채","d":"금융채는 은행, 금융투자회사, 리스회사, 신용카드회사 등 금융기관이 장기적으로 안정적 인 자금을 조달하기 위하여 발행하는 채권을 말한다."},{"t":"금융취약성지수(FVI)","d":"금융안정 상황을 판단하기 위해 금융시스템 내 잠재하고 있는 취약성(vulnerability)을 평 가하고 이를 통해 중장기 금융안정 리스크를 측정하는 금융안정 관련 지수이다."},{"t":"금융통화위원회","d":"금융통화위원회(Monetary Policy Board)는 통화신용정책 수립 및 한국은행 운영에 관 한 최고 의사결정기구로서 7명의 위원으로 구성된다."},{"t":"금융 하부구조","d":"지급결제시스템, 신용평가제도, 주식시장, 선물시장 등과 같이 금융거래가 원활하게 이루 어질 수 있도록 지원하는 각종 제도적 장치 및 기관을 의미한다."},{"t":"금전신탁","d":"금전신탁이란 수탁자가 금전을 신탁재산으로 위탁받아 이를 대출, 채권 등 적절한 투자대 상에 운용하여 얻은 이익을 수익자에게 금전 등의 형태로 되돌려 주는 제도이다."},{"t":"기념화폐","d":"기념화폐는 국가적 행사, 역사적 사건, 중요한 인물 또는 국가유산 등을 기념하기 위해 특 별히 발행되는 화폐로서 유통 목적으로 발행되는 통용 화폐와 달리, 주로 수집 가치와 기 념적 의미를 지니며 액면가보다 높은 가격에 판매되는 경우가 많다."},{"t":"기대인플레이션","d":"기대인플레이션은 향후 물가상승률에 대한 경제주체의 주관적인 전망을 나타내는 개념으 로 물가안정을 추구하는 중앙은행이 관심을 기울이고 안정적으로 관리해야 하는 핵심지 표 중 하나이다."},{"t":"기본자본(Tier 1)","d":"국제결제은행(BIS)의 기준에 따른 은행의 자기자본(=기본자본+보완자본)을 구성하는 요 소로서, 예상외 손실(unexpected loss)이 발생할 경우 은행이 영업을 계속하면서 손실을 흡수할 수 있는 자본(going-concern capital)을 의미하며, 보통주자본(CET1; Common Equity Tier 1)과 기타기본자본(AT1; Additional Tier 1)으로 구성된다."},{"t":"기업간(B2B) 지급시스템","d":"기업간(B2B) 지급시스템은 전자외상매출채권(전자채권)의 발행과 만기시 결제를 처리하 는 시스템으로 2002년 3월 가동되었다."},{"t":"기업·개인간(B2C) 지급결제시스템","d":"기업·개인간(B2C) 지급결제시스템은 인터넷쇼핑몰 등의 전자상거래에서 이루어지는 판 매자 및 구매자간의 소액결제에 이용되는 지급결제시스템을 통칭하는 용어이다."},{"t":"기업경기실사지수(BSI)","d":"한 나라의 전체 경기는 기업과 소비자들이 개별적으로 느끼는 경기를 종합한 것이라고 할 수 있다."},{"t":"기업공개","d":"기업공개(IPO; Initial Public Offering)란 넓은 의미로는 기업의 전반적 경영내용을 공 개하는 것을 의미하며 좁은 의미로는 주식을 다수의 투자자들에게 분산 매각하는 것을 말 한다."},{"t":"기업분할(물적분할, 인적분할)","d":"기업분할이란 회사의 특정사업부를 분할하여 새로운 회사를 설립하는 것을 의미한다."},{"t":"기업심리지수(CBSI)","d":"기업심리지수(CBSI; Composite Business Sentiment Index)는 기업경기실사지수(BSI)의 주요 지수를 이용하여 산출한 지표이다."},{"t":"기업어음(CP)","d":"기업어음(CP; Commercial Paper)은 신용상태가 양호한 기업이 상거래와 관계없이 운 전자금 등 단기자금을 조달하기 위하여 자기신용을 바탕으로 발행하는 융통어음을 의미 한다."},{"t":"기업회생절차","d":"기업이 자력으로 회사를 꾸려가기 어려울 만큼 부채가 많을 때 법원에서 지정한 제3자가 자금을 비롯하여 기업활동 전반을 관리하는 것을 말한다."},{"t":"기저효과","d":"기저효과(Base Effect)는 경제지표 증가율을 해석할 때 기준시점과 비교시점의 상대적인 위치에 따라서 경제 상황에 대한 평가가 실제보다 위축되거나 부풀려지는 등의 왜곡이 일 어나는 것을 말한다."},{"t":"기준금리","d":"한국은행 금융통화위원회에서 결정하는 정책금리를 말한다."},{"t":"기준순환일","d":"기준순환일이란 경기변동 과정에서 국면전환이 이루어진 일자를 의미한다."},{"t":"기준환율","d":"기준환율이란 일반적으로 “다른 외국 통화 환율 결정의 기준이 되는 특정 통화의 환율” 을 의미한다."},{"t":"기초가격","d":"기초가격(Basic Price)은 일정 기간 동안 경제주체가 생산한 생산물을 가격으로 평가함에 있어 생산자가격에서 부가가치세와 같은 생산물세(production tax)를 제외하고 정부에 서 주는 보조금(subsidy)을 더한 가격을 의미하는 것으로 순수하게 생산자(주로 기업)가 갖게 되는 몫을 말한다."},{"t":"기축통화","d":"기축통화란 여러 국가의 암묵적인 동의하에 국제거래에서 중심적인 역할을 하는 통화를 지칭한다."},{"t":"기타기본자본(Additional Tier 1)","d":"기타기본자본(AT1; Additional Tier 1)은 바젤Ⅲ 자본규제에서 기본자본(Tier 1)을 구성 하는 요소로서, 은행의 계속적인 영업을 전제로 손실흡수능력이 있다고 인정되는(혹은 은 행의 손실을 보통주자본 다음의 순서로 보전할 수 있는) 자본을 의미하며 영구적 성격을 지닌 자본증권의 발행으로 인한 자본금·자본잉여금 등이다."},{"t":"기펜재","d":"일반적으로 재화는 수요의 법칙에 따라 가격이 하락하면 수요량이 늘어난다."},{"t":"기회비용","d":"인간의 욕구에 비해 자원이 부족한 현상을 희소성이라고 한다."},{"t":"기후테크","d":"기후테크(Climate Tech)는 기후 변화 문제를 해결하거나 완화하기 위한 기술을 말한다."},{"t":"긴급수입제한조치","d":"긴급수입제한조치(Safeguard) 즉, 세이프가드란 특정 품목의 수입이 급증하여 국내 업체 에 심각한 피해가 발생하거나 그럴 우려가 있을 경우, 수입국이 관세 인상이나 수입량 제 한 등을 통해 수입품에 대한 규제를 할 수 있는 제도이며 무역장벽의 하나라고 볼 수 있 다."},{"t":"긴축정책","d":"경기과열 우려가 있는 경우 재정 또는 통화정책으로 가계, 기업, 정부 등 각 경제주체들의 재화 및 서비스에 대한 수요, 투자 의지를 위축시켜 지출을 줄이는 등 경기의 과열을 방지 하려는 정책을 긴축정책(Contractionary Policy)이라고 한다."},{"t":"꼬리위험","d":"경제성장률이나 주가, 환율 등 시장가격변수 분포의 꼬리부분 이벤트가 발생할 위험을 꼬 리위험(Tail Risk)이라고 한다."},{"t":"낙수효과","d":"정부가 경제정책으로 대기업과 고소득층 또는 부유층의 소득과 부를 먼저 늘려주게 되면 이들의 소비와 투자 증가를 통해 전체 경제활동이 활발해지면서 결국에는 중소기업과 저 소득층도 혜택을 볼 수 있다는 주장이다."},{"t":"낙인효과","d":"범죄학의 낙인이론에 따르면 일탈 또는 범죄 행동은 관련 주체의 독자적 행동에 의해서도 발생하지만, 해당 행동에 대한 사회적 평가 또는 해당 행동을 한 주체의 사회적 소외의 결 과로도 발생할 수 있다."},{"t":"난외거래","d":"은행의 권리·의무가 확정되지 않아 재무상태표상(on-balance sheet) 자산·부채로 기록 되지 않는 거래를 의미한다."},{"t":"납부자자동이체","d":"납부자자동이체(Standing Order)는 은행지로 업무의 한 형태로 고객이 거래은행이 아닌 다른 은행에 대출원리금, 정기적금 등을 정기적으로 납부할 때 거래은행의 본인계좌에서 다른 은행으로 자동 이체시켜 주는 업무로서 1994년 4월부터 실시되었다."},{"t":"내국신용장","d":"국내 외국환은행이 수출업자의 의뢰에 따라 수출업자 앞 국제 신용장(Master L/C)을 담 보로 하는 등의 방식으로 국내 제조업자 또는 공급업자 앞으로 발행하는 신용장을 말한 다."},{"t":"내부등급법","d":"바젤 자본규제에서 정하고 있는 최소 요건(신용평가 시스템의 신뢰도 확보를 위해 갖추 어야 할 최소한의 양적·질적 요건)을 충족하여 감독당국의 승인을 받은 은행이 자산군별 로 리스크 측정 요소(부도율, 부도시 손실률, 부도시 익스포저 등)를 자체 측정모형을 통 해 추정하고 이를 바젤위원회(BCBS)가 정한 내부등급법 산식에 대입하여 신용리스크 에 대한 위험가중자산을 산출하는 방법을 말한다."},{"t":"내부자금","d":"기업은 투자에 필요한 자금을 기업 내부 또는 기업 외부에서 조달하는데, 기업이 투자 재 원을 내부유보, 감가상각충당금 등에서 조달한 것을 내부자금이라고 한다."},{"t":"노동생산성/노동생산성지수","d":"노동자 1인이 일정 기간 동안 산출해 내는 생산량으로 정의된다."},{"t":"노동시장 긴장도","d":"노동 수요(기업의 일자리 수)와 노동 공급(일할 사람의 수)의 균형 정도를 나타내는 지표로 서, 일자리에 비해 일할 사람이 얼마나 부족한지 또는 많은지를 보여준다."},{"t":"녹색GDP","d":"일반적으로 녹색GDP(Green GDP)는 한 나라의 국내총생산(GDP)에서 생산활동 중 발 생하는 자연자원의 감소나 환경피해 등의 손실액을 공제한 것으로 이해된다."},{"t":"녹색기후기금(GCF)","d":"개발도상국의 온실가스 감축과 기후변화 대응을 지원하기 위하여 만들어진 UN 산하의 국제금융기구이다."},{"t":"뉴스심리지수(NSI)","d":"뉴스심리지수(NSI; News Sentiment Index)는 경제분야 뉴스기사에 나타난 경제심리를 지수화한 것이다."},{"t":"단기금융시장","d":"단기금융시장(Money Market)은 금융기관, 기업 등 경제주체들이 단기적인 자금수급 불 균형을 조절하기 위하여 통상 만기 1년 이내의 단기 금융상품을 거래하는 시장이다."},{"t":"단리/복리","d":"단리(Simple Interest)는 원금에 대해서만 약정된 이율과 기간을 곱하여 이자를 산출하 는 방식이다."},{"t":"단위노동비용","d":"단위노동비용이란 산출물 한 단위를 생산하는데 소요되는 노동비용을 말한다."},{"t":"단일금리방식/복수금리방식","d":"경쟁입찰에 따른 발행금리 결정방식에는 복수금리(Conventional)방식과 단일금리 (Dutch)방식이 있다."},{"t":"담보인정비율(LTV)","d":"주택담보대출 취급 시 담보가치(주택가격) 대비 대출 취급 가능금액의 비율 (Loan-To- Value ratio)을 의미한다."},{"t":"당일결제/익일결제/익익일결제","d":"현물환거래의 결제는 거래당사자 상호 간에 신용위험을 회피하기 위하여 거래계약일과 같은 날짜에 결제가 이루어지는 것을 원칙으로 하고 있다."},{"t":"대기성 여수신제도","d":"대기성 여수신제도(Standing Facilities)는 금리 중심 통화정책 운영방식 하에서 단기시 장금리의 과도한 변동을 억제하기 위한 정책수단이다."},{"t":"대량지급","d":"대량지급(Direct Credit)은 은행지로 업무의 한 유형으로서 급여, 연금, 배당금 등과 같이 일시 또는 정기적으로 발생하는 다수의 고객을 대상으로 동시에 이루어지는 거래를 위하 여 공공기관이나 대기업 등 이용기관의 예금계좌에서 다수의 수취인 예금계좌로 지정된 날짜에 자금을 이체하는 업무이다."},{"t":"대손충당금적립비율","d":"은행을 포함하여 기업이 보유하는 채권 중에서 거래상대방의 부도 등으로 회수가 어려워 손실이 발생할 수 있는데, 이러한 손실을 충당하기 위해 미리 비용으로 처리해서 사내에 유보해둔 자금을 대손충당금이라고 한다."},{"t":"대안정기","d":"2002년 4월 전미경제연구소(NBER; National Bureau of Economic Research) 연례 세미나에서 미국 하버드대 스톡(J."},{"t":"대외의존도/수출입의존도/무역의존도","d":"국민경제가 가계, 기업, 정부 이외에 국외부문과의 상호작용에 의해서도 영향을 받게 되 는 경제체제를 개방경제체제라고 한다."},{"t":"대외지급준비자산","d":"대외지급준비자산이란 한 나라의 통화 당국이 경제에 큰 영향을 미치지 않고 언제든지 대 외 지급에 충당할 수 있도록 보유하고 있는 준비자산(금, SDR, IMF position 및 보유 외 화)을 말한다."},{"t":"대체비용리스크","d":"미래 특정일자에 종료될 거래의 상대방이 거래를 취소하거나 파산할 경우, 결제일 전에 결제가 이행되지 못할 가능성을 감안하여 다른 거래로 대체하는 과정에서 발생할 비용 리스크를 의미한다."},{"t":"대체재","d":"비슷한 만족을 얻을 수 있어 서로 경쟁 관계에 있는 재화 또는 서비스를 말한다."},{"t":"대출금 출자전환","d":"금융기관이 차주기업에 대한 대출채권을 동 기업의 주식과 교환하는 것으로서 금융기관 의 차주기업에 대한 관계가 채권자에서 주주로 변하게 된다."},{"t":"대출채권 분할매각","d":"대출채권 유동화 방법의 하나로서, 대출을 취급한 금융기관이 대출채권의 전부 또는 일부를 타인(참가자 또는 투자자)에게 매각하는 것을 말한다."},{"t":"더블딥","d":"경기가 두 번(double) 떨어진다(dip)는 뜻으로, 경기침체가 발생한 후 잠시 경기가 회복 되다가 다시 경기침체로 접어드는 연속적인 침체 현상을 의미한다."},{"t":"도덕적 해이","d":"도덕적 해이는 거래당사자의 한쪽이 상대보다 양질의 정보를 더 많이 가지고 있는 상태 (정보의 비대칭성)에서 계약이 이루어진 후에 나타날 수 있는 문제이다."},{"t":"도드-프랭크법","d":"동 법은 미국에서 2008년의 글로벌 금융위기가 발생한 이후 이러한 위기의 재발을 방 지하기 위해 오바마 정부가 제안한 내용을 반영하여 2010년 7월에 제정되었으며 1930 년대 대공황기의 금융개혁 이후 가장 광범위한 개혁방안을 담고 있다."},{"t":"독점/과점","d":"독점(Monopoly)은 완전경쟁의 정반대인 시장 형태로 어느 기업이 시장의 유일한 공급 자로 그 기업이 공급하는 상품에 밀접한 대체재가 존재하지 않는 경우를 말한다."},{"t":"동남아시아국가연합(ASEAN)","d":"동남아시아의 지역협력기구로서 아세안(ASEAN; Association of South-East Asian Nations)이라고도 부른다."},{"t":"동남아시아국가연합+한·중·일(ASEAN+3)","d":"한국, 중국, 일본 및 ASEAN 10개국이 합의하여 1999년 출범한 국제회의체이다."},{"t":"동남아시아중앙은행기구(SEACEN)","d":"회원 간 정보 및 의견 교환, 공동 관심 분야에 대한 조사연구 및 연수 활동을 주요 기능 으로 하는 동남아 중앙은행들의 협력체로서 1966년 2월 동남아 7개국 주도로 출범하였 다."},{"t":"동아시아 외환위기","d":"1997년 태국을 시작으로 인도네시아, 말레이시아, 필리핀, 한국 등 동아시아 국가들에서 발생한 외환위기를 말한다."},{"t":"동아시아·태평양중앙은행기구(EMEAP)","d":"EMEAP(Executives’ Meeting of East Asia and Pacific Central Banks)는 동아시아, 태평양 지역 내 중앙은행 간의 협력을 증진하고 회원국의 금융·경제에 관한 정보교환을 위해 1991년 설립된 중앙은행 간 협력체이다."},{"t":"동일인 신용공여한도제(동일인 여신한도제)","d":"특정인에 대한 금융기관의 여신 편중을 억제하기 위한 규제로 우리나라의 경우 은행법 등 에 관련 내용이 규정되어 있다."},{"t":"동태적 대손충당금 제도","d":"발생주의 대손충당금 회계기준(Incurred-Loss Model)은 대출 원리금 연체 등 신용손실 이 객관적으로 입증되는 경우에만 은행 대출에 대한 대손충당금을 적립하도록 하였다."},{"t":"동행종합지수","d":"개별 경제지표로는 파악하기 어려운 국민경제의 총체적인 경기수준을 파악하기 위하여 경기종합지수를 작성한다."},{"t":"듀레이션","d":"듀레이션(Duration)이란 채권에서 발생하는 현금흐름의 가중평균만기로 투자자금의 평 균회수기간을 의미한다."},{"t":"등록발행","d":"등록발행이란 채권을 실물발행(physical issue)하지 않고 한국예탁결제원 등 등록기관이 관리하는 채권등록부에 채권자의 성명, 주소, 채권금액 등 권리내역을 등록(book-entry) 함으로써 증서의 점유 없이도 채권자의 법적 권리를 보장하는 것을 말한다."},{"t":"디레버리징","d":"디레버리징(Deleveraging)은 부채를 축소하는 것을 말한다."},{"t":"디스인플레이션","d":"물가수준이 지속적으로 높아지고 있으나 물가상승률은 둔화되는 현상을 말한다."},{"t":"디커플링/커플링","d":"디커플링(Decoupling)이란 탈동조화라고 번역할 수 있는데, 어떤 나라나 지역의 경제가 인접한 다른 국가나 전반적인 세계 경제의 흐름과는 다른 모습을 보이는 현상을 말한다."},{"t":"디플레이션","d":"물가가 지속적으로 하락하는 현상을 말한다."},{"t":"래퍼곡선","d":"미국의 경제학자 래퍼(A."},{"t":"레그테크","d":"레그테크(RT; RegTech, Regulatory Technology)는 금융업 등 산업 전반에 걸쳐 혁신 정보기술(IT)과 규제를 결합하여 규제관련 요구사항 및 절차를 효율적으로 처리하는 기술 또는 회사를 뜻한다."},{"t":"레버리지비율/단순기본자본비율","d":"레버리지비율(Leverage Ratio)은 ‘[기본자본(Tier 1) / 총익스포저(난외자산 포함)] × 100’으로 정의된다."},{"t":"레버리지 효과","d":"안정성을 추구하는 저축과 달리 투자에서는 종종 레버리지 효과(Leverage Effect)가 발 생한다."},{"t":"로렌츠곡선","d":"1905년 미국의 통계학자인 로렌츠(M."},{"t":"로보어드바이저","d":"로보어드바이저(Robo-Advisor)는 로봇(robot)과 자문가(advisor)의 합성어이다."},{"t":"리디노미네이션","d":"리디노미네이션(Redenomination) 또는 ‘화폐단위 변경’이란 구매력이 다른 새로운 화 폐단위를 만들어 현재의 화폐단위로 표시된 가격, 증권의 액면가, 예금·채권·채무 등 일 체의 금액을 법정비율(교환비율)에 따라 일률적으로 조정하여 새로운 화폐단위로 표기 및 호칭하는 것을 의미한다."},{"t":"리쇼어링/니어쇼어링/프렌드쇼어링","d":"리쇼어링(Reshoring)은 해외에 공장이나 생산기지를 둔 기업이 다시 본국으로 돌아오 는 현상으로 인건비 등 생산비용 절감을 위하여 해외로 생산시설을 옮기는 오프쇼어링 (offshoring)과 반대되는 말이다."},{"t":"리스크 온(Risk On)/오프(Off)","d":"리스크 온(Risk On)과 리스크 오프(Risk Off)는 투자 심리를 나타내는 용어로서 시장의 위험 선호도와 위험 회피 심리를 반영한다."},{"t":"마러라고 합의","d":"마러라고 합의는 트럼프 미국 대통령의 플로리다 별장 ‘마러라고(Mar-a-Lago)’의 이름 을 딴 경제 정책 구상으로 1985년의 플라자 합의를 현대적으로 재해석한 전략이다."},{"t":"마샬의 k","d":"마샬의 k(Marshallian k)는 경제 전체의 명목소득 대비 통화량 보유 비율을 의미한다."},{"t":"마스트리히트조약","d":"마스트리히트조약(Maastricht Treaty)은 유럽공동체(EC)의 12개 회원국(벨기에, 덴마크, 독일, 그리스, 스페인, 프랑스, 아일랜드, 룩셈부르크, 이탈리아, 네덜란드, 포르투갈, 영 국)이 1992년 2월 7일 네덜란드 마스트리히트에서 서명하고, 1993년 11월 1일부터 발효 된 조약으로 정식 명칭은 유럽연합조약(Treaty on European Union)이다."},{"t":"마진콜","d":"마진콜(Margin Call)은 금융 투자에서 투자자의 계좌 가치가 일정 수준 이하로 떨어졌을 때 증권사나 브로커가 추가 증거금(margin)을 요구하는 것을 말하는데, 이는 투자자가 레 버리지(leverage)를 사용하여 거래할 때 발생할 수 있는 위험 중 하나다."},{"t":"마찰적 실업","d":"마찰적 실업 또는 탐색적 실업이란 새로운 일자리를 탐색하거나 이직을 하는 과정에서 일 시적으로 발생하는 실업을 의미한다."},{"t":"만기수익률","d":"만기수익률(YTM; Yield to Maturity)은 채권을 만기까지 보유했을 때 얻을 수 있는 예상 연간 수익률을 말한다."},{"t":"매매보호 서비스(Escrow)","d":"판매자와 구매자 사이의 신용관계가 불확실한 전자상거래 시 신뢰할 수 있는 중립적인 제 3자가 중개역할을 하여 상거래가 원활히 이루어질 수 있도록 하는 서비스를 말한다."},{"t":"매몰비용","d":"이미 지급되어 회수할 수 없는 비용을 말한다."},{"t":"매입외환/환가료","d":"매입외환은 외국환은행이 고객으로부터 매입한 수출환어음, 내국신용장어음, 외화수표, 약속어음 등의 외국환으로 표시된 자산을 말한다."},{"t":"매출액영업이익률","d":"기업의 주된 영업활동의 효율성을 측정하는 지표로 제조 및 판매활동에 의해 창출된 영업 손익을 매출액으로 나누어 산출한다."},{"t":"머니마켓펀드(MMF)","d":"머니마켓펀드(MMF; Money Market Fund)는 고객의 일시적인 여유자금을 금리위험과 신용위험이 적은 국공채, 어음 등에 운용하고 동 운용에서 발생하는 수익을 배당하는 펀 드의 일종으로서 대표적인 단기금융상품이다."},{"t":"명목GDP목표제","d":"명목GDP목표제란 명목GDP가 사전에 정한 목표수준을 따라가는 것을 목표로 하는 통 화정책 운영체제이다."},{"t":"명목국내총생산/실질국내총생산","d":"명목국내총생산(Nominal GDP)은 한 나라 안에서 생산된 최종생산물의 가치를 그 생산 물이 생산된 기간의 가격을 적용하여 계산한 것이다."},{"t":"명목금리/실질금리","d":"금리는 돈의 가치 즉, 물가변동을 고려하느냐의 여부를 기준으로 명목금리와 실질금리로 구분할 수 있다."},{"t":"명목소득/실질소득","d":"명목소득(Nominal Income)은 대상 경제주체의 소득이 발생할 당시의 가격으로 측정된 소득을 말하며, 실질소득(Real Income)은 통화가치의 변동을 감안하여 명목소득을 기 준시점에 맞춰 조정한 것을 말한다."},{"t":"모기지대출","d":"모기지대출(Mortgage Loan)은 주택이나 부동산을 담보로 하여 은행 등 금융기관에서 장 기간 자금을 빌리는 대출을 말한다."},{"t":"모바일뱅킹","d":"모바일뱅킹 서비스는 고객이 휴대전화 등 모바일기기를 이용하여 무선인터넷을 통하여 금융기관에 접속하여 이용할 수 있는 금융서비스이다."},{"t":"모집","d":"자본시장에서 불특정 다수로부터 동일한 조건으로 유가증권 취득의 청약을 권유하는 것 을 말한다."},{"t":"무디스","d":"무디스는 1909년 미국의 출판업자인 John Moody가 창업한 신용평가기관이다."},{"t":"무역지수","d":"일반적으로 거래금액의 변동은 가격이 변하거나 물량이 변하거나 또는 가격과 물량이 동 시에 변하기 때문에 나타난다."},{"t":"무위험지표금리(KOFR)","d":"무위험지표금리(KOFR)는 Korea Overnight Financing Repo Rate의 약자로서, 국채· 통안증권을 담보로 하는 익일물 RP금리를 사용하여 산출한 우리나라의 무위험지표금리 (RFR; Risk-Free Reference Rate)이다."},{"t":"물가안정목표제","d":"물가안정목표제(Inflation Targeting)란 중앙은행이 명시적인 중간목표(intermediate target) 없이 일정기간 동안 또는 중장기적으로 달성해야 할 물가상승률 목표치를 미리 제 시하고 이에 맞추어 통화정책을 운영하는 방식이다."},{"t":"물가지수","d":"시장에서 거래되는 여러 가지 상품과 서비스의 가격을 경제생활에서 차지하는 중요도를 고려하여 평균한 종합적인 가격 수준을 물가라고 한다."},{"t":"뮤추얼펀드","d":"투자자들이 자금을 모아 투자 회사를 설립해 주식이나 채권, 파생상품 등에 투자한 후 그 운용수익을 투자자, 즉 주주들에게 배당금의 형태로 나누어주는 투자신탁의 하나이 다."},{"t":"미국·멕시코·캐나다협정(USMCA)","d":"미국·멕시코·캐나다협정(USMCA)은 1994년 체결된 북미자유협정(NAFTA)을 대체하는 협정으로서 2020년 7월 1일 공식 발효되었다."},{"t":"미달러화지수","d":"미달러화지수(US dollar Index)는 미국 달러화의 가치를 주요 6개국 통화(유로, 엔, 파 운드, 캐나다 달러, 스웨덴 크로나, 스위스 프랑) 대비 미달러화 환율을 가중평균하여 측 정하는 지수다."},{"t":"미달러화페그제도","d":"페그제도란 자국통화를 단일 외국통화나 복수의 통화바스켓에 연동시켜 고정환율을 유 지하는 제도이다."},{"t":"미발행화폐","d":"미발행화폐란 한국은행이 보유하고 있는 은행권과 주화 중 사용하기에 적합하지 아니하 여 폐기(잘게 썰거나, 분쇄 또는 녹이는 등의 방법으로 소각)하기로 결정한 화폐를 제외한 모든 은행권과 주화를 말한다."},{"t":"미분양주택","d":"주택사업자가 분양 공고를 내고 입주자를 모집하였으나 정해진 일정 내에 청약이 이루어 지지 않은 주택이다."},{"t":"바이오인증","d":"바이오인증(Biometric Authentication, Biometrics)은 개인을 식별하거나 인증하기 위 해 각 개인마다 구별해서 측정할 수 있는 고유 생체정보를 자동화된 장치에 보관하고 금 융거래시 이를 이용해 본인임을 인증하는 기술이다."},{"t":"바젤은행감독위원회/바젤위원회(BCBS)","d":"1974년 독일 헤르슈타트 은행(Bankhaus Herstatt)의 도산이 국제외환시장 및 은행시 스템에 심각한 영향을 미치면서 글로벌 은행감독기준 마련을 위한 공조의 필요성이 대두 되었다."},{"t":"반대매매","d":"반대매매(Reverse Trading)란 만기까지 대출금을 갚지 못하거나 담보가치가 일정 비율 이하로 떨어지면 증권사가 주식을 강제로 처분하는 것을 의미한다."},{"t":"발행시장","d":"발행시장(Primary Market)이란 주식이나 채권 등의 유가증권을 신규로 발행하는 시장을 말한다."},{"t":"발행어음","d":"발행어음은 금융회사가 투자자로부터 자금을 조달하기 위해 고객을 수취인, 금융회사를 지급인으로 하여 어음을 의미하며 만기는 1년 이내이다."},{"t":"발행중지화폐/유통정지화폐","d":"발행중지화폐는 발권기관인 한국은행이 화폐의 원활한 유통 등을 위해 발행을 중지하기 로 한 화폐이다."},{"t":"방카슈랑스","d":"방카슈랑스(Bancassurance)라는 말은 유럽에서 만들어지고 발전된 개념으로 은행을 의 미하는 프랑스어 Banque와 보험을 의미하는 Assurance의 합성어이다."},{"t":"배당할인모형","d":"배당할인모형(Dividend Discount Model)은 주식투자에 따라 발생하는 미래의 현금 흐름을 적절한 할인율을 적용하여 현재가치로 전환함으로써 주식의 현재가치를 평가하 는 모형이다."},{"t":"밴드웨건효과","d":"소비자가 대중적으로 유행하는 정보를 쫓아 상품을 구매하는 현상을 말한다."},{"t":"뱅크런","d":"은행의 대규모 예금인출사태를 가리키는 말이다."},{"t":"범위의 경제","d":"개별 기업이 한 종류의 제품만을 생산하는 경우보다 여러 제품을 같이 생산하면서 평균 생산비용이 적게 들 때 범위의 경제(Economies of Scope)가 존재한다고 말한다."},{"t":"법정화폐","d":"법정화폐(Legal Tender)란 법률에 의해 인정되는 공적 지불수단의 성격을 지닌 화폐를 의미한다."},{"t":"베버리지곡선","d":"베버리지곡선(Beveridge Curve)은 노동 공급(실업률) 및 수요(빈일자리율) 간 관계를 나 타내는 곡선으로 이를 통하여 노동수급 상황과 노동시장의 효율성 정도를 파악할 수 있 다."},{"t":"베블런효과","d":"가격이 상승하면 수요량이 감소하는 수요 법칙에 반하는 재화를 베블런재라 부른다."},{"t":"변동금리","d":"변동금리란 시장금리를 반영하여 일정 주기별로 약정금리가 변하는 금리를 의미하며, 고 정금리란 최초 약정한 금리가 만기 때까지 그대로 유지되는 금리를 의미한다."},{"t":"변동금리부채권(FRN)","d":"채권은 지급이자 변동 여부에 따라 고정금리부채권과 변동금리부채권(FRN; Floating Rate Note)으로 구분된다."},{"t":"보복소비","d":"보복소비(Revenge Spending 혹은 Pent-up Demand)란 상당 기간 소비 기회가 막혀 강제적으로 소비가 제한되거나 혹은 소비가 억제됨에 따른 피로 누적과 이에 대한 보상 욕구, 미래 소비기회 상실 우려 등에 대한 반작용으로 소비가 급격하게 늘어나는 것을 의 미한다."},{"t":"보완자본(Tier 2)","d":"국제결제은행(BIS)의 기준에 따른 은행의 자기자본(=기본자본+보완자본)을 구성하는 요 소로서, 기본자본에 비해 손실흡수능력이 떨어지지만 예상외 손실로 은행이 파산할 경우 예금자를 포함한 일반채권자에 앞서 손실을 흡수(혹은 은행의 청산 시 은행의 손실을 보 전)할 수 있는 자기자본(gone-concern capital)을 의미한다."},{"t":"보완재","d":"두 가지 이상의 재화가 함께 사용됨으로써 효용을 얻을 수 있는 재화로, 한 재화의 가격이 하 락함에 따라 다른 한 재화의 수요가 증가하는 관계에 있는 재화를 말한다."},{"t":"보통주자본(Common Equity Tier 1)","d":"보통주자본(CET1; Common Equity Tier 1)은 바젤Ⅲ 자본규제에서 기본자본(Tier 1)을 구성하는 핵심 요소로서, 손실흡수능력이 가장 높은(혹은 은행의 손실을 가장 먼저 보전 할 수 있는) 자본을 의미하며 보통주 발행으로 인한 자본금·자본잉여금, 이익잉여금, 기타 포괄손익누계액 등으로 구성된다."},{"t":"보편관세","d":"관세란 외국에서 물건을 사오거나 외국으로 물건을 팔 때 부과하는 세금으로 수입관세, 수출관세, 통과관세가 있으며 수출관세와 통과관세는 거의 부과되지 않고 수입관세가 일 반적이다."},{"t":"보호무역주의","d":"보호무역주의는 국가간 무역을 제한하는 경제정책이다."},{"t":"복수통화바스켓제도","d":"복수통화바스켓제도란 자국과 교역 비중이 큰 복수국가의 통화를 선택하여 통화군(바스 켓)을 구성하고 바스켓(basket)을 구성하는 통화들의 가치가 변동할 경우 각 통화별 교 역가중치에 따라 자국통화의 환율에 반영하는 환율제도를 말한다."},{"t":"본드포워드거래","d":"본드포워드거래(Bond Forward Transaction)는 두 당사자가 미래의 일정 시점에 정해 진 가격으로 채권(본드)을 매수하거나 매도하기로 약속하는 금융 계약을 말한다."},{"t":"본원소득","d":"제도단위(비금융법인, 금융법인, 일반정부, 가계 및 비영리단체)가 생산과정에 참여하거 나 생산활동에 제공된 자산을 소유함에 따라 발생하는 소득으로 국민순소득(NNI; Net National Income)이라고도 한다."},{"t":"본원소득수지","d":"본원소득수지는 급료 및 임금 수지와 투자소득수지로 구분된다."},{"t":"본원통화","d":"통화는 일차적으로 중앙은행의 창구를 통하여 공급되는데, 이를 통화량의 원천이 되는 통 화라 하여 본원통화(RB; Reserve Base)라고 한다."},{"t":"볼커룰","d":"2008년 글로벌 금융위기를 계기로 2010년 7월 미국 의회가 제정한 「금융개혁법(Dodd- Frank Wall Street Reform and Consumer Protection Act)」의 핵심 조항(제619조)으 로 상업은행의 과도한 위험추구를 막는 규제이다."},{"t":"부가가치","d":"부가가치(Value Added)는 일정 기간 동안에 경제활동주체가 생산활동에 참여하여 새로 이 창출한 가치를 말하는데, 총산출에서 중간투입(소비)을 차감하여 구할 수 있다."},{"t":"부가가치기준 무역(TiVA)","d":"부가가치기준 무역(TiVA; Trade in Value Added)은 국가간 거래를 재화와 서비스의 각 생산 단계에서 창출된 부가가치를 기준으로 파악하는 경제통계이다."},{"t":"부가가치유발계수/부가가치계수","d":"소비, 투자, 수출 등 최종수요의 발생이 국내생산을 유발하고 생산 활동에 의해서 부가가 치가 창출되므로 최종수요는 부가가치 창출의 원천이 된다."},{"t":"부동화/무권화","d":"증권의 부동화(Immobilization)란 실물증권을 중앙예탁기관에 집중 보관하여 매매거 래 또는 담보거래 등에 따른 증권의 권리이전을 계좌대체 방식으로 처리함으로써 증권 의 실물인도의 필요성을 제거하는 것을 말한다."},{"t":"부실채권(NPL)","d":"금융기관의 대출이나 지급보증 중 차주의 재정상황 악화로 인해 회수가 어려운 자산을 의미한다."},{"t":"부채담보부증권(CDO)","d":"CDO(Collateralized Debt Obligation)란 회사채나 대출채권 등으로 구성된 pool을 기초자산으로 하여 AAA등급에서 equity(non-rated)까지의 다양한 신용등급으로 발행된 여러 종의 선·후순위 채권을 말하며, 기초자산의 종류에 따라 회사채를 기초자산으로 하 는 회사채 담보부증권(CBO; Collateralized Bond Obligation), 대출채권을 기초자산으 로 하는 대출채권 담보부증권(CLO; Collateralized"},{"t":"부채비율","d":"부채를 자기자본으로 나눈 비율로 대표적인 안정성 지표이다."},{"t":"분리결제","d":"분리결제(Free of Payment)는 증권매매거래 결제시 증권인도와 대금지급이 동시에 이루 어지지 않고 개별적으로 이루어지는 방식이다."},{"t":"분산원장기술","d":"분산원장기술(DLT; Distributed Ledger Technology)은 거래정보가 기록된 원장을 특 정 기관의 중앙 서버가 아닌 공유(P2P; Peer-to-Peer) 네트워크에 분산하여 다수의 참가 자가 공동으로 기록·관리하는 기술이다."},{"t":"분수효과","d":"분수효과(Trickle-up Effect, Fountain Effect)란 정부가 경제정책으로 저소득층과 중산 층의 소득을 먼저 늘려주면 이들의 소비 확대가 생산과 투자로 이어지면서 전체 경제활동 이 되살아나고 이로 인해 고소득층의 소득도 늘어날 수 있다는 주장이다."},{"t":"분절화","d":"‘세계화(globalization)’에 대응되는 개념으로 경제활동이나 시장이 작은 부분으로 나뉘 어 서로 독립되거나 상호작용이 적어진 현상을 ‘분절화(Fragmentation)’라고 한다."},{"t":"불완전경쟁시장","d":"시장에 의한 가격결정에 어떠한 영향도 미칠 수 없는 상태를 완전경쟁이라 한다."},{"t":"불태화정책","d":"수출입 거래나 국경 간 자본유출입 거래는 국내은행을 통해 국내통화로 전환되며 이에 따 라 국내통화량이 변동하게 된다."},{"t":"브레튼우즈체제","d":"브레튼우즈체제는 1944년 7월 미국의 뉴햄프셔주 브레튼우즈에서 44개 연합국 대표들 이 새로운 국제통화제도 구축을 위해 체결한 협정에 따라 발족한 국제통화체제를 말한다."},{"t":"브렉시트(Brexit)","d":"브렉시트(Brexit)는 영국(Britain)과 탈퇴(Exit)의 합성어로 영국의 유럽연합(EU) 탈퇴를 뜻한다."},{"t":"브릭스(BRICS)","d":"브릭스(BRICS)는 브라질(Brazil), 러시아(Russia), 인도(India), 중국(China), 남아프리 카공화국(South Africa) 등 5개국의 영문 앞 글자를 따서 만든 용어다."},{"t":"브릿지론","d":"개인이나 기업이 주택구입, 대규모 개발 프로젝트 수행 등을 위해 장기 자금조달이 필요 할 경우, 해당 자금 마련 이전에 일시적으로 소요되는 비용을 충당하기 위해 단기 자금조 달 수단으로 이용하는 것이 브릿지론이다."},{"t":"블록체인","d":"블록체인(Block Chain)은 ① 일정 시간 동안 발생한 모든 거래정보를 블록(block) 단위로 기록하여 ② 모든 구성원들에게 전송하고 ③ 블록의 유효성이 확보될 경우 새 블록을 ④ 기존의 블록에 추가 연결(chain)하여 보관하는 방식의 알고리즘이다."},{"t":"비관측경제(NOE)","d":"비관측경제(NOE; Non-observed Economy)란 국내총생산(GDP)의 추계에 이용되는 기 초자료와 행정자료에 누락된 경제활동을 의미한다."},{"t":"비교우위","d":"특정 국가나 경제주체가 다른 국가나 경제주체에 비해 상대적으로 더 적은 기회비용으로 어떤 재화나 서비스를 생산할 수 있는 능력을 말한다."},{"t":"비용인상 인플레이션","d":"재화나 서비스의 생산과 관련하여 투입요소 비용의 상승에 의해 물가가 지속적으로 오 르게 되는 것을 비용인상 인플레이션(Cost-Push Inflation)이라고 한다."},{"t":"비트코인","d":"비트코인(Bitcoin)은 가상통화(암호통화)이자 디지털 지급시스템 전자 토큰 형태의 가상 자산이다."},{"t":"빅데이터","d":"빅데이터(Big Data)란 복잡하고 다양한 대규모 데이터세트 자체는 물론 이 데이터세트로 부터 정보를 추출하고 결과를 분석하여 더 큰 가치를 창출하는 기술을 뜻한다."},{"t":"빅맥지수","d":"빅맥지수(Big Mac Index)는 각국 통화의 구매력 정도 또는 환율 수준을 측정하기 위해 일물일가의 법칙을 햄버거 가격에 적용한 것으로 영국에서 발행되는 주간 경제전문지 이 코노미스트지(The Economist)에서 1986년 이래 매년 전 세계적으로 판매되고 있는 맥 도날드의 빅맥 가격을 비교·분석해서 발표하고 있다."},{"t":"빅테크","d":"빅테크(Big Tech)는 세계적으로 규모가 크고 영향력이 큰 기술 기업들을 통칭하는 용어 이다."},{"t":"빈일자리율","d":"현재 비어있거나 1개월 안에 새로 채용될 수 있는 일자리 수를 전체 근로자 수와 빈 일자리 수의 합으로 나눈 백분율을 의미한다."},{"t":"사이드카","d":"사이드카는 주식시장에서 선물 가격 급등락으로 인한 현물 시장의 과도한 변동을 막기 위 해 프로그램 매매 호가의 효력을 일시적으로 정지시키는 시장 안정화 장치이다."},{"t":"사이버리스크","d":"정보통신기술의 발달로 기업경영활동에서 디지털화가 가속화되고 상호 연결이 확대되어 감에 따라 전자상거래나 정보통신기술을 이용하여 이루어지는 활동 중 사이버 상에서 발 생하는 예기치 못한 사고로 인해 기업이 부담하게 될 유·무형의 비용이 증가하는 위험을 말한다."},{"t":"사전담보제","d":"사전담보제(Collateral Requirements)는 지급결제시스템의 참가자로 하여금 여타 시스 템 참가자들 모두에 대한 순채무를 결제하기에 충분한 담보를 사전에 제공토록 하여 결제 불이행이 실제로 발생하였을 때 결제불이행 기관의 담보를 처분하여 결제의 종료를 보장 하는 제도다."},{"t":"사전적 정책방향 제시(Forward Guidance)","d":"사전적 정책방향 제시는 향후 통화정책 방향에 대해 중앙은행이 명시적으로 시그널을 전 달하는 것으로 새로운 정책은 아니다."},{"t":"4차 산업혁명","d":"2010년대 물리적, 디지털 및 생물학적 세계를 융합하여 사회·경제·산업 등 전반적으 로 충격을 주는 새로운 기술 영역이 등장한다."},{"t":"사회보장제도","d":"사회보장제도는 개인이 어떠한 불행을 당하더라도 국가가 최소한의 인간다운 생활을 보 장할 수 있도록 하는 제도이다."},{"t":"사회보험","d":"사회보험(Social Insurance)이란 보험방식을 통해 발생 가능한 각종 사회적 위험에 대처 함으로써 국민의 생활, 건강, 소득 등을 보장하는 제도를 가리킨다."},{"t":"산업연관표(I/O Tables)","d":"일정 기간(보통 1년) 동안 국민경제 내에서 발생하는 재화와 서비스의 생산 및 처분과 관 련된 모든 거래 내역을 일정한 원칙과 형식에 따라 기록한 종합적인 통계표이다."},{"t":"삼불원칙","d":"삼불원칙(Impossible Trinity, Trilemma)는 ① 고정환율 유지 ② 자본의 자유로운 이동 ③ 통화정책의 독립성 등 세 가지 정책목표를 동시에 만족시키는 것은 불가능함을 의미한 다."},{"t":"상계관세","d":"상계관세(Countervailing Duties)는 수출국이 수출기업에 보조금이나 장려금을 지급하여 지나치게 낮은 가격을 책정할 경우 수입국이 이로 인한 경쟁력 저하를 상쇄하기 위해 부과 하는 관세를 말한다."},{"t":"상대적 빈곤율","d":"상대적 빈곤율은 처분가능소득이 중위소득(소득이 많은 순서대로 세웠을 때 정확히 중간 인 사람의 소득)의 50%를 밑도는 계층이 전체 인구에서 차지하는 비율을 말한다."},{"t":"상시감시제도/상시감시전담데스크","d":"상시감시는 감독당국이 평상시 은행의 영업실적 및 재무상태에 관한 보고서를 징구, 분 석하는 등 전반적인 은행의 경영상황을 파악하기 위한 감독수단의 하나이다."},{"t":"상장지수펀드(ETF)","d":"주식, 채권, 통화, 원자재 등의 가격지수를 추종하는 것이 목표인 인덱스펀드의 지분을 거래소에 상장하여 일반주식처럼 거래하도록 한 금융상품이다."},{"t":"상품공동기금(CFC)","d":"1989년 7월 설립된 상품공동기금(CFC; Common Fund for Commodities)은 1차산 품의 수급 안정을 위한 국제협력 증진과 국제상품협정 체결 촉진 및 기능 활성화를 목적 으로 하고 있다."},{"t":"상품수지","d":"거주자와 비거주자 간의 상품 수출입 거래를 계상한 것으로, 경상수지의 한 부분이다."},{"t":"상호관세","d":"상호관세(Reciprocal Tariff)는 특정 상대국이 자국 제품에 대해 과도하거나 불공정한 관 세를 부과할 경우 이에 대해 동일하거나 유사한 방식으로 관세를 부과하는 경우를 말한 다."},{"t":"생산세","d":"현재 국민계정 작성기준인 국민계정체계(SNA)에서는 조세를 크게 종전 간접세에 해당하 는 생산세(Taxes on Production)와 소득·부 등에 대한 경상세, 자본세로 분류하고 있다."},{"t":"생산유발효과","d":"한 나라에서 각 산업의 생산활동은 소비, 투자, 수출 등 최종수요의 크기에 따라 결정되는 데, 최종수요의 변화가 생산에 미치는 영향을 생산유발효과라 한다."},{"t":"생산자물가지수(PPI)","d":"국내생산자가 국내시장에 공급하는 상품과 서비스의 평균적인 가격변동을 측정하기 위하 여 작성되는 물가지수로서 그 대상품목의 포괄범위가 넓어 전반적인 상품과 서비스의 수 급 동향이 반영된 일반적인 물가수준의 변동을 측정할 수 있기 때문에 일반목적지수로서 의 성격을 갖는다."},{"t":"생산자제품재고지수","d":"현실 경제에서는 경기의 좋고 나쁨에 따라 재고의 증가 또는 감소 현상이 필연적으로 나 타나게 마련이다."},{"t":"생산자제품출하지수/생산자출하지수","d":"생산자제품출하지수는 생산자의 판매활동과 광업, 제조업, 전기·가스업 및 수도사업 제 품의 출하 동향을 나타내는 지표이다."},{"t":"생산확산지수","d":"광공업생산지수나 서비스업생산지수 등 총량지표로는 파악하기 어려운 전반적인 생산 확산의 정도를 측정하는 경제지표이다."},{"t":"생성형 인공지능(AI)","d":"인공지능, 소위 AI(Artificial Intelligence)는 인간의 학습, 추론, 문제해결, 지각, 의사결 정 등 능력을 인공적으로 구현하는 컴퓨터과학의 한 분야로 인간의 지능을 컴퓨터를 비 롯한 여러 장치에 적용한다."},{"t":"생활물가지수","d":"생활물가지수(CPI for living necessaries)는 체감물가를 파악하기 위해 일상생활에서 구 입 빈도가 높고 지출비중이 높아 가격변동을 민감하게 느끼는 생활필수품을 대상으로 작 성한 지수이다."},{"t":"서비스수지","d":"국제수지표에서 서비스수지란 외국과의 서비스거래 결과 벌어들인 돈과 지급한 돈의 차 이를 말한다."},{"t":"서킷브레이커","d":"과열된 전기회로를 차단하는 안전장치에서 유래된 용어로 주식시장에서 주가의 급등락 시 주식거래를 일시 정지시켜 시장에 미치는 충격을 완화하기 위한 ‘매매거래중단 제도’ 를 의미한다."},{"t":"서학개미","d":"서학개미란 해외, 주로 미국 주식에 직접 투자하는 한국 개인투자자를 일컫는 신조어이 다."},{"t":"선물거래","d":"선물거래(Futures Transactions)란 공인된 거래소에서 품질, 규격 등이 표준화된 상품의 매매계약을 체결하고 일정기간이 경과한 후에 상품의 인수도와 결제가 이루어지는 거래 로서 매매계약의 성립과 동시에 상품의 인수도와 결제가 이루어지는 현물거래와 구분된 다."},{"t":"선물환거래","d":"선물환거래란 계약일로부터 통상 2영업일 경과 후 특정일에 외환의 인수도와 결제가 이 루어지는 거래를 말한다."},{"t":"선물환포지션비율 규제","d":"선물환포지션비율 규제는 국내은행과 외국은행 지점의 선물환포지션(선물 외화자산에서 선물 외화부채를 뺀 값)을 자기자본의 일정 비율 이내로 제한하는 규제로 2010년 10월 부터 시행된 제도이다."},{"t":"선불카드/선불전자지급수단","d":"선불형카드는 이용고객이 전자적 또는 자기적 방법으로 일정금액을 저장한 카드를 카드 발행자로부터 구입하여 상품구매 또는 서비스 이용시마다 대금이 자동으로 차감 지급되 도록 한 카드로서 사용범위에 따라 범용 선불형카드와 단일목적 선불형카드로 구분된 다."},{"t":"선행종합지수","d":"개별 경제지표로는 파악하기 어려운 국민경제의 총체적인 경기수준을 파악하기 위하여 경기종합지수를 작성한다."},{"t":"성장기여도","d":"성장기여도는 특정 경제부문(예: 산업 X1)이 전체 경제성장(예: ΣXn, 산업 X1, … 산업 Xn,)에 어느 정도 기여했는가를 보여주는 지표로 구체적으로는 아래 산식에 의해서 산 출된다."},{"t":"세계경제포럼(다보스포럼)","d":"세계경제포럼(WEF, 다보스포럼)은 저명한 기업인, 경제학자, 언론인, 정치인들이 모여 세계 경제를 개선하기 위한 과제를 토론하고 연구하는 회의체이다."},{"t":"세계국채지수(WGBI)","d":"세계국채지수(WGBI)는 영국의 FTSE 러셀이 발표하고 있는 주요국 국채로 구성된 국채 지수로서 미국 등 주요 선진국 국채를 포함하고 있는 대표적인 채권부문 글로벌 지수이 다."},{"t":"세계무역기구(WTO)","d":"세계무역기구(WTO)는 국제무역 확대, 회원국 간의 통상분쟁 해결, 세계교역 및 새로운 통상 논점에 관한 연구를 위하여 설립된 국제기구로서 본부는 스위스 제네바에 있다."},{"t":"세계은행(World Bank)","d":"세계은행그룹(World Bank Group)을 구성하는 5개 기구 중에서 국제부흥개발은행 (IBRD)과 국제개발협회(IDA)를 합쳐서 부르는 명칭이다."},{"t":"소득5분위배율","d":"소득분배의 불평등도를 나타내는 지표의 하나로 전체 가구를 소득 수준의 순서에 따라 20%씩 5등분으로 나눈 다음, 소득 상위 20%(5분위) 계층의 평균소득을 소득 하위 20%(1 분위) 계층의 평균소득으로 나눈 값이다."},{"t":"소득교역조건지수","d":"소득교역조건지수는 순상품교역조건지수에 수출물량지수를 곱하여 {(수출물가지수/수입 물가지수)×수출물량지수} 산출하는 것으로서 수출 총액으로 수입할 수 있는 상품의 양이 기준시점 대비 얼마나 증가하였는지를 의미하며 순상품교역조건지수가 가격변동만을 고 려하는 단점을 보완해 준다."},{"t":"소득대체율","d":"소득대체율은 은퇴 후 받는 연금수령액이 은퇴 전 소득에 대해 어느 정도 수준인지를 나 타내는 용어이다."},{"t":"소매판매","d":"소매판매란 여러 유통단계 가운데 최종 소비자인 개인이나 가계를 대상으로 이루어지는 재화의 판매를 말한다."},{"t":"소비의 비가역성","d":"소비행태를 설명하는 상대소득가설은 소비가 현재소득 이외에도 과거의 최고 소득수준 또는 타인의 소비수준과 같은 상대적인 요인에 의해서도 영향을 받을 수 있다는 가능성을 고려한다."},{"t":"소비자동향지수(CSI)","d":"소비자의 경기나 생활형편 등에 대한 주관적인 판단과 전망, 미래의 소비지출계획 등을 설 문조사를 통해 지수화한 것으로, 기업들의 경제를 보는 시각이 반영된 기업경기실사지수 (BSI; Business Survey Index)와 함께 대표적인 경제심리지수 중 하나이다."},{"t":"소비자물가지수(CPI)","d":"일반 가구가 소비생활을 유지하기 위하여 구입하는 각종 상품과 서비스의 가격변동을 종 합적으로 파악하기 위하여 작성되는 물가지표이다."},{"t":"소비자심리지수","d":"소비자를 대상으로 경기에 대한 판단이나 전망 등을 조사하여 지수화한 경제심리지표를 말한다."},{"t":"소액지급시스템","d":"소액지급시스템(Retail Payment System)은 주로 기업이나 개인의 소액거래를 처리하 는 지급시스템으로서 주로 계좌이체지시나 지급카드, 수표, 지로 등을 이용하여 처리된 다."},{"t":"소프트랜딩/하드랜딩","d":"소프트랜딩(연착륙)은 높은 성장세를 보이는 호황기 경제가 큰 충격 없이 점진적으로 둔 화되어 안정되는 것을 말한다."},{"t":"소형모듈원자로(SMR)","d":"소형모듈원자로(Small Modular Reactor)는 기존 대형 원전(1,000~1,500MW 출력)보 다 출력 규모를 줄이고, 공장에서 모듈 단위로 제작한 뒤 현장에서 조립·설치하는 방식 의 원자력 발전소를 말한다."},{"t":"속물효과(스놉효과)","d":"개성을 추구하는 사람들은 단지 다른 사람들이 많이 구입한다는 이유만으로 특정 물품을 구입하지 않거나 심지어 자신의 옷과 똑같은 옷을 입은 사람을 보면 그 옷을 더 이상 입 지 않는다."},{"t":"수요견인 인플레이션","d":"수요견인 인플레이션(Demand-Pull Inflation)이란 경기과열 등으로 인해 개인들의 재화나 서비스에 대한 수요가 크게 늘면서 상대적으로 부족해진 재화 및 서비스의 물가가 지속적 으로 상승하게 되는 것을 말한다."},{"t":"수요탄력성","d":"상품의 가격 변화비율에 대한 수요량의 변화비율을 수요의 가격탄력성(price elasticity of demand)이라 한다."},{"t":"수익률곡선","d":"이자율 기간구조(term structure)를 그래프로 나타낸 것을 수익률곡선(Yield Curve)이 라고 한다."},{"t":"수입유발계수","d":"최종수요가 한 단위 증가할 때 각 산업부문에서 직·간접으로 유발되는 수입액 단위를 말 하는 것으로 형태에 따라 산업별 수입유발계수와 최종수요항목별 수입유발계수로 나뉜 다."},{"t":"수출경합도지수","d":"특정 국가(Z)에 상품을 수출하는 두 국가(X와 Y)의 수출구조가 비슷할수록 경쟁도가 커진 다는 가정하에서 이들 국가가 Z국 시장에서 직면하는 경쟁의 정도를 측정하는 지표이다."},{"t":"수출보험","d":"상품수출 시 수출업자가 수입업자의 신용위험, 수입국의 정치상황 등으로 수출대금을 회 수하지 못할 위험으로부터 수출업자를 보호하기 위한 보험이다."},{"t":"수출입물가지수","d":"수출입물가지수는 수출 및 수입상품의 가격변동을 측정하는 지표로서 동 지수는 대외의 존도가 높은 우리나라의 경우 수출입상품의 가격변동이 국내물가, 생산활동 및 대외 경쟁 등에 미치는 효과를 사전에 측정하기 위해 작성되며 주로 수출입관련업체들의 수출채산 성 변동이나 수입원가 부담 등을 파악하는 한편 수출입물가지수의 상호 비교를 통하여 가 격측면에서의 교역조건 등을 측정하는 데 이용된다."},{"t":"수출입물량지수","d":"무역지수 중 수출입물량의 변동을 나타내 주는 것으로 수출입금액지수를 수출입물가지수 로 나누어 사후적으로 산출되는데 이러한 방식으로 산출되는 것은 수출입금액이 가격요 인과 물량요인의 합과 일치한다는 점에서 타당성을 가진다고 할 수 있다."},{"t":"수쿠크","d":"수쿠크(Sukuk)란 샤리아(Sharia) 율법을 지키기 위해 투자자들에게 이자수익 대신 배당 금 혹은 리스료 형태로 수익을 배분하는 채권을 말한다."},{"t":"수확체감의 법칙","d":"어떤 생산물을 만드는 데 필요한 자본·노동·토지 등의 생산요소 가운데 자본과 토지는 일 정하게 유지하고 노동의 투입량을 증가시킬 경우, 생산물 전체는 증가하지만 추가로 투입 되는 노동량 1단위당 생산물의 증가는 차차 감소한다는 법칙이다."},{"t":"순상품교역조건지수","d":"순상품교역조건지수란 수출 1단위로 수입할 수 있는 상품의 양이 기준시점 대비 얼마나 증가하였는지를 나타내며, 무역지수통계에서 작성된 수출가격물가지수를 수입물가지수 로 나누어 산출한다."},{"t":"순안정자금조달비율","d":"2008년 글로벌 금융위기 시 신용경색으로 금융시장 기능이 마비되면서 자금조달이나 만 기연장이 어려워짐에 따라 많은 은행들이 만기불일치 등에 따른 유동성 위기를 경험하였 고 이는 금융시스템 전체의 유동성 경색을 유발하였다."},{"t":"순이자마진(NIM)","d":"은행의 모든 금리부자산의 운용결과로 발생한 은행의 운용자금 한 단위당 이자순수익(운 용수익률)을 나타내는 개념이다."},{"t":"순이체한도제","d":"순이체한도(Net Debit Cap)는 금융결제원의 차액결제시스템에 참가하고 있는 각 참가기 관으로 하여금 여타 참가기관과의 CD, 타행환 거래 등에서 발생하는 순이체액(지급지시 송신액 - 지급지시수신액)에 대하여 그 상한을 설정토록 함으로써 결제불이행 사태의 발 생 가능성 및 불이행 규모를 최소화하도록 한 제도이다."},{"t":"숨은 그림(은화)","d":"은행권의 위조방지를 위한 장치의 하나로 은행권 용지를 빛에 비췄을 때 여백에 숨겨진 문양이 나타나도록 하는 장치를 말한다."},{"t":"스마트계약","d":"스마트계약(Smart Contract)은 블록체인을 이용하여 일정 조건이 만족되면 자동으로 거래가 실행되도록 작성된 컴퓨터 프로토콜 또는 코드를 뜻한다."},{"t":"스무딩오퍼레이션","d":"우리나라는 자유변동환율제도를 채택하고 있어서 환율이 원칙적으로 외환시장에서 자율 적으로 결정되도록 하고 있으나, 일시적인 수급불균형이나 시장 불안심리 등으로 환율이 급변동하는 경우에 한해 외환당국이 외환시장에 개입하여 환율변동 속도를 조절하게 되 는데 이를 스무딩오퍼레이션(Smoothing Operation)이라 한다."},{"t":"스왑","d":"스왑(SWAP)은 거래 쌍방이 미리 정한 계약조건에 따라 현재 시점에서 원금, 이자 등을 서 로 교환하기로 하고 일정 기간 주기적으로 원금이나 이자 등 현금흐름(cash flow)을 서로 교환하는 파생상품 계약을 말한다."},{"t":"스왑레이트","d":"스왑레이트(Swap Rate)는 현물환율 대비 선물환율과 현물환율의 차이(=(선물환율-현 물환율)/현물환율)를 연율(%)로 표시한 것으로 이론적으로는 양 통화 간 금리차와 일치 (covered interest rate parity)하게 된다."},{"t":"스왑베이시스","d":"스왑베이시스(Swap Basis)는 일반적으로 통화스왑(CRS) 금리와 금리스왑(IRS) 금리의 차이를 의미한다."},{"t":"스태그플레이션","d":"제2차 세계대전 이전까지 경기침체기에는 물가가 하락하고 경기호황기에는 물가가 상 승하는 것이 일반적 현상이었다."},{"t":"스탠더드&푸어스(S&P)","d":"스탠더드&푸어스는 무디스, 피치와 함께 세계 3대 국제신용평가기관으로 불리는 미국의 신용평가회사로서 1860년 Henry Varnum Poor가 설립한 Poor’s라는 투자정보서비스 회사와 1916년 설립된 Standard의 두 회사가 1942년 합병하여 Standard&Poor’s로 출 범하였다."},{"t":"스테이블코인","d":"스테이블코인은 가격변동성이 최소화되도록 설계된 가상자산을 의미한다."},{"t":"스톡옵션","d":"스톡옵션(Stock Option)이란 회사가 임직원에게 일정기간이 지난뒤 자사 주식을 미리 정 한 가격으로 살 수 있는 권리를 부여하는 제도로 주식매수선택권으로도 불린다."},{"t":"스트레스 DSR","d":"스트레스 DSR이란 변동금리 대출 등을 이용하는 차주가 대출 이용기간 중 금리 상승으로 인해 원리금 상환 부담이 증가할 가능성을 감안하여 DSR 산정시 일정 수준의 가산금리 (스트레스 금리)를 부과하여 대출한도를 산출하는 제도(실제 대출금리에는 미부과)를 말 한다."},{"t":"스트레스 테스트(위기상황분석)","d":"예외적이지만 발생가능한(extreme but plausible) 위기 상황을 상정하여 개별 금융기관, 금융부문 및 금융시스템 전체의 취약성과 복원력을 평가하는 기법을 의미한다."},{"t":"시뇨리지","d":"시뇨리지(Seigniorage)란 화폐에 대한 독점적 발권력을 갖는 중앙은행이나 국가가 화폐 발행을 통해 획득하는 이득을 의미한다."},{"t":"시스템 리스크","d":"금융시스템의 일부 또는 전부가 부실화되면서 금융중개 기능이 정상적으로 수행되지 못 할 위험을 의미한다."},{"t":"시스템적으로 중요한 금융기관","d":"규모가 크고 금융시스템 내 상호연계성이 높아 부실화 또는 도산 시 금융시스템에 광범 위하고 중대한 영향을 미칠 수 있는 은행, 보험사 및 여타 금융기관을 의미한다."},{"t":"시장리스크","d":"금융시장의 금리, 주가, 환율 등의 변동에 따라 은행이 단기매매를 위해 트레이딩계정 (trading book)에 보유한 금융상품의 가격이 하락하여 손실이 발생할 가능성을 의미한 다."},{"t":"시장평균환율(MAR)","d":"시장평균환율이란 외국환중개회사를 통해 거래가 이루어진 현물환매매 중 결제일 2영업 일 전 현물환시장에서 형성되는 환율과 그 거래량을 가중평균하여 산출한 환율을 의미한 다."},{"t":"시장평균환율제도","d":"시장평균환율제도는 우리나라가 1990년 3월 국내 외환시장의 활성화와 자본 및 금융 의 국제화를 촉진시키기 위한 환율제도의 단계적 개편방안의 일환으로 도입한 제도로서, 1997년 외환위기 이전까지 시행되었다."},{"t":"시카고상업거래소(CME)","d":"시카고상업거래소(CME; Chicago Mercantile Exchange)는 세계 최대의 파생상품 거 래소 중 하나이자, 농산물과 금융상품 선물을 주로 다루는 대표적인 시장이다."},{"t":"시카고 연준 금융상황지수","d":"시카고 연준의 금융상황지수(National Financial Conditions Index)는 미국의 금융시 장 상황을 지수화하여 현재 금융시장이 긴축적인지 또는 완화적인지를 나타낸다."},{"t":"신용경색","d":"금융기관 등에서 돈의 공급이 원활히 이루어지지 않아 어려움을 겪는 현상을 의미한다."},{"t":"신용레버리지","d":"신용레버리지란 레버리지효과를 거두기 위해 경제주체가 활용하고 있는 신용의 정도를 의미한다."},{"t":"신용스프레드","d":"신용스프레드란 특정 채권의 신용위험이 어느 정도인지를 보여주는 지표로서 동일만기 무위험 채권인 국고채 금리와 해당 채권 금리의 차이로 나타난다."},{"t":"신용연계증권(CLN)","d":"신용연계증권(Credit Linked Notes)은 지급보증계약과 유사한 신용파산스왑(CDS)을 증권화한 형태이다."},{"t":"신용위험(신용리스크)","d":"바젤 자본규제에서는 신용위험을 채권·채무관계에서 채무자의 채무불이행, 이행거부 또 는 신용도 하락 등으로 인해 발생하는 손실 가능성을 포괄하는 개념으로 정의한다."},{"t":"신용창조","d":"신용창조(Credit Creation)는 일반적으로 은행이 예금과 대출업무를 반복적으로 취급 하는 과정에서 예금통화를 만들어내는 현상을 말한다."},{"t":"신용파생상품","d":"신용파생상품(Credit Derivative)이란 채권, 대출금 등과 같이 차입자 또는 발행자의 신 용에 따라 가치가 변동하는 기초자산(underlying asset)의 신용위험(credit risk)을 분리 하여 이를 다른 거래상대방에게 이전하고 그 대가로 프리미엄(수수료)을 지급하는 금융 상품을 말한다."},{"t":"신용평가제도","d":"넓은 의미에서 신용평가란 자금을 빌리는 가계, 기업 등 차입자의 부채 상환능력이나 신 용도를 일정한 등급으로 평가하는 것을 말한다."},{"t":"신용환산율","d":"BIS 자기자본비율 계산시 난내자산의 경우 익스포저에 거래상대방의 신용위험도에 따른 위험가중치를 곱하여 위험가중자산(risk-weighted assets)을 산출하게 된다."},{"t":"신·재생에너지","d":"매장량이 한정되어 있는 기존의 화석연료(석유, 석탄, 천연가스 등)와 우라늄을 대체 할 수 있는 에너지를 지칭하는 것으로, 새로운 기술을 활용한 에너지 또는 재생가능한 (renewable) 에너지를 포함한다."},{"t":"신종자본증권","d":"신종자본증권이란 채권과 주식의 특성을 모두 보유한 금융상품을 의미한다."},{"t":"신주인수권부사채(BW)","d":"신주인수권부사채(Bond with Warrant)는 채권을 발행한 회사가 주식을 발행할 경우 투 자자가 미리 약정된 가격에 일정한 수량의 신주(新株)를 인수할 수 있는 권리인 워런트 (Warrant)가 결합된 회사채를 말한다."},{"t":"신흥시장국채권지수(EMBI+)","d":"EMBI+(Emerging Market Bond Index+)는 신흥국(이머징 마켓) 정부가 국제금융시장 에서 발행한 달러화 표시 국채의 수익률을 기반으로 하는 대표적인 벤치마크 지수로 글로 벌 투자은행인 JP Morgan이 산출한다."},{"t":"실망실업자","d":"구직단념자라고도 하며, 비경제활동인구 중 잠재구직자의 일부분이며 취업 희망과 취업 가능성 기준 외에도 노동시장적 사유로 지난 4주간 구직활동을 하지 않는 자 중 지난 1년 내 구직 경험이 있는 사람을 의미한다."},{"t":"실물화폐/명목화폐","d":"고유의 사용가치 및 교환가치를 가지고 화폐의 기능을 수행하는 물건을 실물화폐라고 한 다."},{"t":"실시간총액결제","d":"실시간총액결제는 금융기관간 지급액과 수취액을 상계시키지 않고 지급지시 건별로 그 지급지시의 금액(총액)을 실시간으로 이체하여 결제하는 방식이다."},{"t":"실업률","d":"고용상황을 파악하고자 할 경우에는 전체 인구보다는 경제적으로 생산활동이 가능한 인 구가 더욱 중요한 의미를 가진다."},{"t":"실업률갭","d":"실업률과 자연실업률간의 차이를 말한다."},{"t":"실질구매력","d":"구매력이란 어떤 양의 화폐로 구입할 수 있는 재화와 서비스의 양을 말한다."},{"t":"실질임금","d":"근로자가 노동의 대가로 받는 임금을 현재의 화폐단위로 표시한 것을 명목임금이라고 하 는데 이러한 명목임금으로 재화와 서비스를 실제 구입할 수 있는 수량 즉, 구매력을 측정 하기 위해 명목임금을 소비자물가지수로 나눈 것을 실질임금이라고 한다."},{"t":"실효환율","d":"환율은 양 통화 간의 교환비율이기 때문에 주요 교역상대국 통화 전체에 대한 자국 통화 가치의 변동을 파악하는 데에는 부족한 측면이 있다."},{"t":"쌍순환 전략","d":"국민경제의 최종수요는 크게 소비·투자 중심의 내수(국내경제 순환)와 수출 중심의 외수 로 구분할 수 있다."},{"t":"아세안+3 거시경제조사기구(AMRO)","d":"AMRO(ASEAN+3 Macroeconomic Research Office)는 아세안(ASEAN) 10개국 과 한국, 중국, 일본 등 13개국이 치앙마이 이니셔티브 다자화 협정(CMIM; Chiang Mai Initiative Multilateralization)의 효과적인 운영을 지원하기 위하여 2011년에 설립한 기구로서 싱가포르에 본부를 두고 있다."},{"t":"아시아개발은행(ADB)","d":"아시아개발은행(ADB)은 아시아·태평양 지역의 경제성장 및 경제협력 촉진과 역내 개도 국의 경제개발 지원을 목적으로 1966년 8월 설립된 국제금융기구로서 필리핀 마닐라에 본부를 두고 있다."},{"t":"아시아인프라은행(AIIB)","d":"아시아 국가들의 사회간접자본 구축을 지원하기 위해 설립된 국제금융기구이다."},{"t":"아시아태평양경제협력체(APEC)","d":"아시아 및 태평양 연안 국가 간의 경제협력을 목표로 설립된 국제기구로서 1989년 11월 호주 캔버라에서 개최된 제1차 각료회의를 통하여 공식 출범하였다."},{"t":"애그플레이션","d":"농업이라는 뜻의 Agriculture와 인플레이션(inflation)의 합성어로 농산물 가격의 급격한 상승이 일반 물가의 상승을 일으키는 현상을 말한다."},{"t":"양도성예금증서(CD)","d":"양도성예금증서(CD; negotiable Certificate of Deposit)는 은행의 정기예금증서에 양 도성을 부여한 것이다."},{"t":"양적완화정책","d":"양적완화정책(QE; Quantitative Easing)이란 금리중시 통화정책을 시행하는 중앙은행이 정책금리가 제로 수준에 근접하게 인하(추가적인 정책금리 인하 여지가 없음)하였음에도 불구하고 경제 회복이 당초의 기대에 미치지 못함에 따라 장기금리 하락을 유도하기 위해 국채 등을 무제한으로 매입하여 유동성을 충분히 공급함으로써 중앙은행의 대차대조표를 확대하는 정책을 말한다."},{"t":"어음관리계좌(CMA)","d":"어음관리계좌(CMA; Cash Management Account)는 고객이 맡긴 자금을 어음이나 우 량채권 등에 운용하여 그 수익을 고객에게 돌려주는 대표적인 단기금융상품이다."},{"t":"어음교환","d":"어음교환이란 다수의 은행이 일정한 시간에 특정 장소에 모여 자행이 수납한 어음(수표 및 제 증서 포함) 중 다른 은행을 지급지로 하는 어음과 다른 은행이 수납한 어음 중 자행 을 지급지로 하는 어음을 서로 교환하고, 이에 따른 대금을 청산하는 것을 말하며 어음교 환이 이루어지는 장소를 어음교환소라 한다."},{"t":"업무지속계획","d":"각종 재해나 비상사태의 발생 시에도 조직의 업무나 대고객서비스가 중단 없이 지속될 수 있도록 하거나 업무 중단에 대한 신속한 대응 및 복구를 목표로 하는 일련의 대책을 의미 한다."},{"t":"에너지 믹스","d":"에너지 믹스(Energy Mix)는 인구 증가와 전력사용량의 급증에 대응하여 에너지를 다양한 방법으로 생산하는 것을 의미한다."},{"t":"엥겔의 법칙","d":"엥겔의 법칙은 독일의 통계학자 엥겔이 벨기에 노동자의 가계조사를 통해 발견하였다."},{"t":"여신전문금융회사","d":"은행과 같은 예금 수신기능 없이 여신업무만을 수행하는 금융회사를 의미한다."},{"t":"역모기지론","d":"역모기지론(Reverse Mortgage Loan)은 주택을 소유하고 있으나 자체수입이 부족한 고 령자가 보유주택을 담보로 소유자 및 배우자의 사망 시까지 노후생활에 필요한 자금을 연 금 형태로 받아 안정된 주거생활을 확보하는 제도이다."},{"t":"역선택","d":"역선택(Adverse Selection)이란 정보의 비대칭이 있을 때, 즉 거래의 당사자 중 정보가 한쪽에만 있는 상황에서, 정보가 없는 쪽은 바람직하지 못한 상대방과 거래할 가능성이 큰 것을 의미한다."},{"t":"역외금융","d":"역외금융(Offshore Banking)이란 금융기관이 비거주자인 자금공여자로부터 외화자금을 조달하여 비거주자를 상대로 외화자금을 운용하는 일련의 금융을 말한다."},{"t":"역외펀드","d":"펀드는 근거 법률에 따라 역외펀드(Off-Shore Fund)와 역내펀드(On-Shore Fund)로 구 분되는데 역외펀드는 외국의 법률에 의하여 외국에서 설정, 설립된 것으로 외국펀드라고 도 한다."},{"t":"역전세","d":"역전세란 현재의 전세가격이 계약 시 전세보증금보다 낮게 거래되는 것을 말한다."},{"t":"연구개발(R&D)","d":"연구개발은 지식량(knowledge stock)을 증가시키기 위하여 체계적으로 수행되는 창조적 활동과 기존 지식을 사용하여 새로운 운영 방법을 고안하는 활동을 아우르는 개념이다."},{"t":"연방준비제도(FRS)/연방준비은행(FRB)","d":"연방준비제도(FRS; Federal Reserve System)는 1907년 금융공황 후 그 대책으로서 1913년에 제정된 연방준비법(Federal Reserve Act)에 의해서 창설된 미국 특유의 중앙 은행제도이다."},{"t":"연쇄가중법","d":"현재 우리나라를 비롯한 주요 선진국의 실질GDP 추계에 이용하는 물량지수 작성방법이 다."},{"t":"연지급수입","d":"수입대금의 전액 또는 일부를 물품 또는 선적서류 영수일로부터 일정 기간이 지난 후에 지급하는 조건의 수입을 말한다."},{"t":"연차보고서","d":"연차보고서는 한국은행이 발간하는 법정 보고서이며 1년간의 경제 동향, 통화신용정책 운용 내용, 금융시장 안정 조치, 국제 협력 활동, 조사·연구 결과 등을 종합적으로 정리한 자료이다."},{"t":"영끌","d":"영끌 “영혼까지 끌어 모은다”의 줄임말로 주로 부동산이나 주식 등 자산을 매입하기 위해 개인이 보유한 자금과 대출 등을 통해 조달가능한 모든 자금을 총동원하여 투자하는 행위 를 말한다."},{"t":"영업잉여","d":"한 나라 국민이 생산활동에 참여한 결과 발생한 소득은 노동, 자본, 경영 등의 생산요소를 제공한 경제주체에게 나누어진다."},{"t":"예금보험제도","d":"예금보험은 금융기관의 예금지급정지, 파산 등으로 해당 금융기관이 기존 예금자의 예금 인출요구에 응할 수 없는 경우 예금보험기관이 당해 금융기관을 대신하여 예금을 지급함 으로써 예금자를 보호하고, 대규모 예금인출사태(뱅크런)를 방지하여 금융안정을 유지하 도록 하는 공적보험이다."},{"t":"예금취급기관","d":"예금취급기관이란 고객으로부터 예금을 수취하고 이를 기반으로 대출 등 금융중개 기능 을 수행하며, 통화창출 기능을 갖는 금융기관을 말한다."},{"t":"예금토큰","d":"예금토큰(Tokenized Deposit)은 은행이 예금을 기반으로 분산원장기술 등을 이용하여 발행하는 디지털화폐를 의미한다."},{"t":"예대금리차(예대마진)","d":"예대금리차(예대마진)는 자금중개기관인 은행이 자금차입자로부터 수취하는 대출금리와 예금자에게 지급하는 예금금리간의 격차로서 은행수익의 본질적 원천이 된다."},{"t":"예대율","d":"예대율이란 예금을 대출의 재원으로 보고 원화예수금 가운데 원화대출금이 차지하는 비 율을 말한다."},{"t":"예상손실","d":"예상손실은 현재 시점부터 일정 기간 동안 발생할 것으로 예상되는 손실의 평균금액을 의 미하며 일반적으로 자산별로 발생 가능한 손실액에 발생 확률을 곱하여 산출한다."},{"t":"예약자금이체제도","d":"실시간 총액결제시스템에서는 금융기관의 자금이체 지급지시가 접수되는 즉시 처리되는 것을 원칙으로 하나, 미래의 특정시점에서 자금결제가 이루어지도록 시스템이 금융기관 으로부터 미리 자금이체신청을 받아 두었다가 결제시점이 도래하면 자동으로 결제하도 록 하는 제도를 예약자금이체제도라 한다."},{"t":"오픈뱅킹","d":"오픈뱅킹(Open Banking)이란 금융기관이 보유한 고객의 금융 데이터를 고객의 동의를 받아 API(Application Programming Interface)를 통해 제3자 금융 서비스 제공자에게 개방하고 이를 기반으로 고객이 다양한 금융 서비스를 더욱 편리하게 이용할 수 있도록 허용하는 제도이다."},{"t":"옵션","d":"옵션(Option)이란 거래당사자들이 미리 정한 가격(행사가격, strike price)으로 장래의 특정시점 또는 그 이전에 일정자산을 팔거나 살 수 있는 권리를 매매하는 계약을 말한다."},{"t":"와타나베 부인","d":"일본에서 낮은 금리로 엔화를 빌려 외화로 환전한 뒤 해외의 고금리 자산에 투자(일종의 yen carry trade)하는 일본의 중·상류층 주부 투자자들을 ‘와타나베(Watanabe)부인’이 라고 하는데 일본의 개인 외환투자자들을 통칭하는 용어로 확장하여 사용하기도 한다."},{"t":"완충자본","d":"완충자본(Buffer Capital)은 금융위기 시 은행이 손실을 흡수하거나 신용공급 기능을 지 속(경기순응성 증폭을 억제)하면서도 최소 규제자본비율 수준 이상으로 자본비율을 유지 하기에 충분한 자본량을 의미하며, 바젤Ⅲ 규제개혁 시 도입한 것으로 최소 자기자본에 더하여 보통주자본으로 추가 적립하도록 요구하는 제도이다."},{"t":"외국환거래법","d":"우리나라는 경제개발 초기에 외화자금이 크게 부족하였고 이에 대응해 국가 차원에서 외 화자금을 효율적으로 조달·운용하기 위해 기업 등의 외환거래를 매우 엄격하게 규제하는 「외국환관리법」을 시행하였다."},{"t":"외국환업무취급기관/외국환은행","d":"외국환업무를 업으로 영위하기 위하여 재무건전성, 외환업무시설 및 전문인력을 갖추어 기획재정부장관에게 등록한 금융기관을 “외국환업무취급기관”이라고 한다."},{"t":"외국환중개회사","d":"외국환중개회사는 외국통화의 매매·교환·대여의 중개, 외국통화를 기초자산으로 하는 파 생상품거래의 중개 또는 이와 관련된 업무를 영위하는 자를 말한다."},{"t":"외국환평형기금","d":"자국 통화가치의 안정을 도모하고 투기적인 외화 유출입에 따른 외환시장의 혼란을 방지 할 목적으로 정부가 외환시장에 개입하는 데 사용하기 위하여 조성한 기금을 말한다."},{"t":"외국환포지션","d":"외국환포지션은 일정 시점에 외국환은행 및 기업 등이 보유하고 있는 외화표시자산과 부채의 차액으로서 거래 주체가 환리스크에 노출된 정도를 나타낸다."},{"t":"외국환포지션한도","d":"외국환은행의 외화자산과 외화부채가 일치하지 않을 경우 환율변동 위험에 노출되어 이 에 따른 손익이 발생한다."},{"t":"외부자금","d":"기업은 투자나 운영자금을 기업내부 또는 기업외부에서 조달하는데 금융기관 차입금, 사 채발행 등 기업외부에서 조달된 자금을 외부자금이라 한다."},{"t":"외부효과","d":"어떤 경제주체의 행위가 본인의 의도와는 관계없이 다른 경제주체에게 의도하지 않은 혜 택이나 손해를 발생시키지만 그 영향에 대한 보상이 이루어지지 않는 현상을 말한다."},{"t":"외채/대외채권","d":"국제통화기금(IMF)의 “외채통계 작성 및 이용 지침”에 따르면 외채(External Debt)는 “한 나라의 거주자가 비거주자에게 미래 특정 시점에 원금이나 이자 또는 원금 및 이자를 지 급해야 하는 우발적이 아닌, 현재 확정된 채무의 잔액”으로 정의하고 있다."},{"t":"외화자금시장","d":"외환시장이 이종통화 간 매매가 수반되고 환율이 매개변수가 되는 시장을 의미하는 반면 외화자금시장은 금리를 매개변수로 하여 외환의 대출과 차입이 이루어지는 시장을 말한 다."},{"t":"외환건전성부담금제도","d":"동아시아 외환위기, 글로벌 금융위기 등 우리나라가 겪었던 금융위기는 호황기에는 자본 이 과도하게 유입되고 불황기에는 급격히 유출되는 자본유출입의 변동성에 주로 기인하 였다."},{"t":"외환결제리스크","d":"외환결제과정에 내재된 리스크로 국가간 또는 복수통화 간에 이루어지는 외환결제의 특 성상 환율, 시차, 국가간 상이한 자금이체시스템 및 법률체계 등 여러 요인에 의해 발생한 다."},{"t":"외환동시결제(PVP)","d":"외환동시결제(PVP; Payment versus Payment)는 외환결제과정에서 국가간 결제시간대 의 차이로 인하여 발생하는 외환결제리스크를 최소화하기 위하여 외환거래에 따른 수취 통화와 지급통화를 동시에 주고 받는 결제방식으로서 대표적으로 CLS은행이 이러한 방 식의 외환결제서비스를 제공하고 있다."},{"t":"외환보유액","d":"외환보유액(Official Reserve Assets)은 중앙은행이나 정부가 국제수지 불균형을 보전하 거나 외환시장 안정을 위해 언제든지 사용할 수 있도록 보유하고 있는 교환성이 있고 유 동성이나 시장성이 높은 대외지급준비자산을 말한다."},{"t":"외환스왑거래","d":"외환스왑거래란 거래당사자들이 현재의 계약환율에 따라 서로 다른 통화를 교환하고 일 정 기간 후 최초 계약 시점에서 정한 선물환율에 따라 원금을 재교환하는 거래를 말한다."},{"t":"외환시장","d":"외환시장은 좁은 의미에서 외환의 수요와 공급이 연결되는 장소를 말하나 넓은 의미에서 는 이러한 장소적 개념뿐 아니라 외환거래의 형성, 결제 등 외환거래가 정기적 또는 지속 적으로 이루어지는 일련의 메커니즘을 포괄한다."},{"t":"외환전산망","d":"1997년 외환위기 이후 우리나라가 주식·채권시장을 전면 개방하고 외국인직접투자도 전 면 허용하는 등 외환거래 자유화조치를 취함에 따라, 국외 여건 변화에 따른 빈번한 외자 유출입 등으로 우리 경제의 변동성이 확대될 가능성이 크게 높아졌다."},{"t":"요소비용","d":"국민소득을 평가하는 데는 두 가지 방법이 있다."},{"t":"요소비용 국민소득","d":"요소비용에 의한 국민소득(NI at factor cost)은 통상 국민소득(NI)이라 불리며 한 나라 의 국민이 제공한 생산요소에서 발생한 소득의 총액, 즉 노동에 대한 대가인 피용자보수 와 토지, 자본, 경영에 대한 대가인 영업잉여의 합계로서 고정자본소모와 순생산 및 수 입세가 포함되지 않으므로 한 나라 국민이 벌어들인 순수한 소득을 나타내는 지표이다."},{"t":"우발부채(채무)","d":"과거에 발생한 원인은 있으나 채무의 확정이 미래 불확실한 사건의 발생 여부에 달려있는 잠재적 의무를 의미한다."},{"t":"우발전환사채(코코본드)","d":"우발전환사채(Contingent Convertible Bond)는 발행기관이 경영개선명령을 받거나 부 실금융기관으로 지정될 경우 상각되거나 보통주로 전환되는 조건이 부가되어 있는 채권 (조건부자본증권)을 말한다."},{"t":"운영리스크","d":"부적절하거나 잘못된 내부 프로세스(internal process), 인력, 시스템, 외부사건(external events) 등으로 인해 발생할 수 있는 손실 가능성을 말한다."},{"t":"워싱턴 컨센서스","d":"1990년대 미국이 중남미 국가들에 대해 제시하였던 미국식 시장경제체제의 확산 전략 을 뜻하며 미국이 주도하는 신자유주의의 대명사로도 인식되고 있다."},{"t":"워크아웃","d":"기업과 금융기관의 협의로 진행되는 재무구조 개선과정 및 결과를 포괄적으로 이르는 말이다."},{"t":"원금리스크","d":"외환결제리스크 중 가장 대표적인 리스크로 매도통화를 이미 지급하였거나 매도통화의 지급을 취소할 수 없는 상황에서 거래상대방이 파산하는 경우 매입통화를 전액 수취하지 못하는 리스크를 원금리스크(Principal Risk)라고 한다."},{"t":"원금이자분리채권(STRIPS)","d":"이표채의 원금과 미래의 이자금액을 분리하여 각각 무이표채(zero coupon bond)의 형 태로 거래할 수 있는 채권을 말한다."},{"t":"원/위안 직거래시장","d":"원/위안 직거래시장은 달러를 매개로 하지 않고 원화를 위안화로, 위안화를 원화로 바로 환전할 수 있는 시장을 의미한다."},{"t":"위조지폐","d":"우리나라의 지폐는 한국은행의 의뢰에 따라 한국조폐공사가 제조하고 있는데 스캐너, 프 린터 등을 이용하여 현용 지폐처럼 보이도록 만든 지폐를 위조지폐라고 한다."},{"t":"위험가중자산/위험가중치","d":"자기자본비율 산출시 대차대조표상 자산계정의 단순 합계를 분모로 사용할 경우 자산을 구성하는 각 익스포저에 따른 리스크를 반영할 수 없는 문제가 있다."},{"t":"위험회피심리","d":"일반적으로 투자자들이 동일한 기대현금흐름에 대해 보다 덜 위험한 투자안을 선호하는 경향을 위험회피(Risk Aversion)심리라고 한다."},{"t":"유동비율","d":"단기채무에 충당할 수 있는 유동자산이 얼마나 되는가를 평가하여 기업의 단기지급능력 을 판단할 수 있는 대표적 지표로서 유동비율이 높을수록 단기지급능력이 양호하다고 볼 수 있으나 과다한 유동자산 보유는 자산운용 효율성을 떨어뜨려 수익성을 저해한다."},{"t":"유동성","d":"유동성(Liquidity)이란 자산을 가치의 손실 없이 얼마나 쉽고 빠르게 현금으로 바꿀 수 있 는지를 나타내는 개념이다."},{"t":"유동성리스크","d":"거래 일방이 일시적인 자금부족으로 인해 정해진 결제 시점에서 결제의무를 이행하지 못 함에 따라 거래상대방의 자금조달 계획 등에 악영향을 미치게 되는 위험을 말한다."},{"t":"유동성커버리지비율","d":"유동성커버리지비율(LCR; Liquidity Coverage Ratio)은 단기 유동성 규제비율로서 은행 이 유동성 부족에 대비하여 보유한 고유동성자산 규모를 30일간의 유동성스트레스 시나 리오 하에서 예상되는 순현금유출액으로 나눈 비율이다."},{"t":"유동성 함정","d":"유동성 함정(Liquidity Trap)이란 금리 인하를 통한 확장적 통화정책이 투자나 소비 등 실 물경제에 영향을 주지 못하는 상태를 말한다."},{"t":"유럽부흥개발은행(EBRD)","d":"EBRD(European Bank for Reconstruction and Development)는 중·동부 유럽 국가 의 시장경제체제로의 전환 촉진과 경제개발 지원을 목적으로 1991년 3월 설립된 국제금 융기구로서 영국 런던에 본부를 두고 있다."},{"t":"유럽연합(EU)","d":"유럽연합(EU; European Union)은 1991년 12월 마스트리히트 유럽이사회에서 유럽공 동체(EC) 12개국 정상이 유럽통합의 방향과 주요 원칙에 합의한 뒤, 1992년 2월 마스트 리히트조약(Treaty on European Union)에 서명하고 1993년 11월 동 조약이 발효되면 서 종전의 유럽공동체를 계승하는 지역공동체로 공식 출범하였다."},{"t":"유럽중앙은행(ECB)","d":"유럽연합(EU)의 통화정책을 수행하는 중앙은행으로서 1994년에 설립된 유럽통화기구 (EMI)를 승계하여 1998년 6월 출범하였으며 독일 프랑크푸르트에 본부를 두고 있다."},{"t":"유로달러(Euro dollar)","d":"미국 외의 국가에 소재하는 은행에 예치된 미국 달러화를 말하는데, 런던 등 주요 금융시 장에서 많이 거래되고 있다."},{"t":"유로마켓(Euro market)","d":"뉴욕, 동경 등 선진국의 국제금융시장에 대비되는 순수한 의미의 국제금융시장으로, 어 떤 통화로 표시된 자금이 해당 통화 발행국 이외의 국가에서 거래되는 시장이다."},{"t":"유통시장","d":"유통시장(또는 제2차 시장, Secondary Market)은 이미 발행된 채권, 주식 등 유가증 권이 투자자들 사이에서 매매되는 시장을 말한다."},{"t":"유틸리티 토큰(Utility Token)","d":"유틸리티 토큰은 특정 플랫폼(Platform) 내에서 운영기관 또는 제휴기관이 제공되는 특 정 재화 또는 서비스에 대한 접근 권한을 부여하기 위한 수단으로 발행된다."},{"t":"은선","d":"은행권의 위조방지를 위한 장치의 하나로 은행권용지에 삽입된 플라스틱 또는 금속으 로 된 가는 선형필름을 말하며, 삽입된 필름의 문양 또는 글자 등을 확인할 수 있다."},{"t":"은행경영공시제도","d":"은행의 건전성을 유지하기 위해서는 감독당국의 직접적인 감독 이외에 예금자, 채권자 및 주주 등 이해관계자에 의한 시장규율(market discipline)이 중요하다."},{"t":"은행인수어음(BA)","d":"은행인수어음(BA; Banker’s Acceptance)은 은행의 단기무역신용공급방식의 하나로 수 출입대금결제를 위해 발행된 환어음을 은행이 인수(accept)하는 것을 말하며, 은행이 어 음상의 지급의무를 부담한 것이므로 그 신용도가 높아 시장에서 자유로이 양도되고 자산 보유의 형태로도 이용되고 있다."},{"t":"을기금(Capital B)","d":"외국은행 국내지점의 동일인 및 동일계열기업군 여신한도 등 은행법상의 영업규제와 관 련하여 자기자본을 확대해줌으로써 여신기능이 원활히 수행될 수 있도록 하기 위한 명목 상의 자본금으로 대차대조표에는 나타나지 않는다."},{"t":"의중임금","d":"의중임금이란 유보임금이라고도 하는데 특정 근로자로 하여금 노동을 공급하게 하기 위 해 지불해야 할 최소한의 임금을 말한다."},{"t":"이구환신","d":"이구환신은 중국 정부가 소비를 촉진하여 내수를 확대하고 생산활동을 활성화하기 위해 시행한 정책이다."},{"t":"이슬람금융","d":"이슬람금융이란 이슬람교 율법인 샤리아(Shariah)에 따라 행해지는 금융을 말한다."},{"t":"이연차액결제","d":"이연차액결제는 일정 기간중 지급결제시스템에 참가하는 기관의 양자간 또는 다자간 에 지급할 총금액과 수취할 총금액을 모아서 상계 처리한 차액을 일정 시점 후에 결제하 는 방식이다."},{"t":"이자보상배율","d":"영업이익을 이자비용으로 나눈 값으로 측정하는 지표이다."},{"t":"이전소득수지","d":"이전소득수지는 국제수지표상 경상수지를 구성하는 항목 중의 하나로 거주자와 비거주자 사이에 무상으로 주고받는 거래의 수지를 말한다."},{"t":"이중통화채(Dual Currency Bond)","d":"국제 간 환율 및 금리 전망을 바탕으로 채권 발행 통화와 상환 통화를 달리하여 발행하는 채권을 말한다."},{"t":"이차전지","d":"외부의 전기 에너지를 화학 에너지의 형태로 전환하여 내부에 저장해 두었다가 필요할 때 재사용할 수 있도록 만들어진 장치가 이차전지(Secondary Cell)이다."},{"t":"이표채","d":"국채·금융채·회사채 등의 채권은 이자지급 방법에 따라 할인채(Discount Bond), 이표채 (Coupon Bond), 복리채(Compound Interest Bond) 등으로 구분되는데 이표채는 채권 의 권면에 이표(쿠폰, coupon)가 붙어 있어 이자지급일에 이를 떼어 제시함으로써 이자를 지급받는 채권을 말한다."},{"t":"익스포저","d":"특정 리스크에 노출되어 있는 금액을 의미하며 리스크 유형에 따라 시장리스크 익스포저, 신용리스크 익스포저 등으로 구분된다."},{"t":"인구고령화","d":"인간의 평균 수명이 증가하고 출산율이 감소함에 따라 선진국을 중심으로 고령자의 인 구 비율이 점차 높아져 가는 현상 또는 그러한 상태를 고령화라고 한다."},{"t":"인적자본","d":"개인이 보유한 능력, 기술숙련도, 지식 등을 포괄하는 것으로 노동의 질적 수준을 의미한 다."},{"t":"인터넷뱅킹","d":"인터넷뱅킹이란 고객이 자금이체, 계좌조회 등 은행 업무를 인터넷을 통해 원격지에서 처 리할 수 있는 금융서비스이다."},{"t":"인플레이션","d":"물가수준이 지속적으로 상승하는 현상을 인플레이션이라고 한다."},{"t":"인플레이션감축법(IRA)","d":"인플레이션감축법(IRA; Inflation Reduction Act)은 미국이 높은 인플레이션 상황에 대 응하여 국민생활 안정화를 위해 2022년 8월 시행한 법률이다."},{"t":"일대일로","d":"일대일로는 아시아·아프리카·유럽을 잇는 중국의 대규모 경제권역 구상으로 2014년 11월 중국 개최 아시아태평양경제협력체(APEC) 정상회의에서 당시 시진핑 총서기가 공식적으 로 발표하였다."},{"t":"일물일가의 법칙","d":"완전경쟁이 이루어질 때 동일한 시기, 동일한 시장에서는 품질이 동일한 상품의 가격이 2 개 이상 형성될 수 없다는 법칙이다."},{"t":"일반특혜관세","d":"개발도상국의 수출 확대 및 공업화 촉진을 위하여, 선진국이 개발도상국으로부터 수입되 는 농수산물, 공산품 및 반제품에 대하여는 아무런 조건 없이 “일반적”으로 무관세 또는 저율의 관세를 부과하는 관세 상의 특혜대우를 말한다."},{"t":"일중RP제도","d":"일중RP제도는 총액결제시스템에서 중앙은행이 참가기관에게 환매조건부증권매매(RP)를 통해 당일 상환을 조건으로 결제에 가용할 수 있는 일중유동성을 제공하는 방법이다."},{"t":"일중당좌대출제도","d":"일중당좌대출제도는 한은금융망의 자금결제가 원활히 이루어지도록 은행 참가기관에 대 하여 영업시간 중 일시적인 결제부족자금을 실시간으로 지원하는 제도로 2000년 9월 도 입되었다."},{"t":"입금이체","d":"입금이체(Credit Transfer)는 지급인이 자신이 거래하는 금융기관에 지급을 지시하여 이 체금액을 수취인의 계좌로 입금하도록 하는 계좌이체 방식을 말한다."},{"t":"자금결제시스템","d":"자금지급시스템과 연계되어 결제가 이루어지는 외환매매거래나 증권매매거래와 달리 자 금을 지급하는 거래 자체는 자금이 예금되어 있는 은행내에서 계좌간 이체만으로도 결제 가 완료된다."},{"t":"자금관리서비스(CMS)공동망","d":"CMS(Cash Management Service)공동망은 금융기관을 통해 대량의 출금 및 입금서비 스를 제공하는 지급시스템으로 금융결제원이 1996년 8월부터 가동하였다."},{"t":"자금순환표","d":"국민경제 내에 존재하는 자금의 흐름은 실물거래와 관련하여 일어나는 산업적 유통과 채 권과 채무의 변동을 나타내는 금융적 유통으로 나누어 볼 수 있는데 경제활동을 올바르게 분석하기 위해서는 양 거래를 연결하여 동시에 파악하여야 한다."},{"t":"자금조달비용지수(COFIX)","d":"COFIX(Cost of Funds Index)는 은행이 조달한 자금의 평균금리를 나타내는 지수로 은 행 변동금리형 대출의 준거금리로 활용되고 있다."},{"t":"자기띠 카드","d":"신용카드나 전화카드와 같이 얇은 플라스틱 카드에 자성체 물질을 띠 모양으로 입히고 필요한 정보를 기록한 카드이다."},{"t":"자기자본비율","d":"자산(= 부채+자기자본) 중에서 자기자본이 차지하는 비중(자기자본비율 = 자기자본/총자본 ×100)을 나타내는 대표적인 재무구조 지표이다."},{"t":"자기자본이익률(ROE)","d":"자기자본을 이용해 얼마나 효율적으로 이익을 창출했는지를 보여주는 수익성 지표이다."},{"t":"자동안정화장치","d":"경제정책을 입안하고 시행하는 과정은 간단하지 않다."},{"t":"자발적 실업","d":"자발적 실업이란 일할 의사가 있어 고용되기를 원하지만 현재의 임금수준이 낮다고 생각 하여 스스로 일하고 있지 않는 상태에 있는 실업이다."},{"t":"자본거래자유화","d":"자본거래의 자유화란 직접투자나 간접투자를 불문하고 정부 혹은 민간이 제3국과의 사이 에 자본을 사용 목적, 방법 등에 대해 어떠한 간섭도 받지 않은 채 자유롭게 공급 또는 도 입하고 나아가 동 자본의 원금과 이자의 상환 등에 제한을 받지 않도록 하는 것, 간단히 말해 국경 간의 자본이동을 자유화하는 것을 의미한다."},{"t":"자본생산성","d":"재화 및 서비스를 생산하기 위하여 투입한 자본의 양과 그 결과 생산된 산출물의 양의 비 율을 자본생산성(Capital Productivity)이라 한다."},{"t":"자본시장법","d":"증권거래법, 간접투자자산운용업법, 신탁업법 등 자본시장 관련 6개 법률을 통합한 「자본 시장과 금융투자업에 관한 법률」(2009년 2월 시행)을 말한다."},{"t":"자본적정성","d":"자본이란 재무상태표상 자산에서 부채를 차감한 금액으로 순자산(net worth)으로 불리기 도 하며, 납입자본 및 이익잉여금 등으로 구성된다."},{"t":"자본적지출","d":"자본재에 대한 사용 가능 햇수(내용연수)의 연장을 목적으로 한 대수선 또는 개보수나 생 산성 또는 생산되는 재화의 질과 양을 현저하게 향상시키는 지출을 말한다."},{"t":"자산건전성 분류","d":"금융기관이 보유자산 등에 대해 건전성 여부를 분석하여 불건전자산의 발생을 예방하고 이미 발생한 불건전자산에 대하여는 조기 정상화를 촉진하게 함으로써 금융기관의 자산 운용 건전화를 도모하는 한편 영업활동에서 발생하는 손실 중 사전에 예상되는 손실에 대 한 손실흡수력을 확보하고 있다."},{"t":"자산유동화","d":"일반적으로 특수목적기구(SPV)가 자산보유자로부터 자산을 양도·신탁 받아 이를 기초 로 자산유동화증권(ABS)을 발행하고 해당 유동화자산의 관리·운용·처분에 의한 수익이 나 차입금으로 자산유동화증권의 원리금 또는 배당금을 지급하는 일련의 행위를 말한다."},{"t":"자연독점","d":"상품의 특성 때문에 시장에서 자연스럽게 생겨난 독점을 말한다."},{"t":"자연실업률","d":"1968년 프리드먼(M."},{"t":"자원민족주의","d":"석유, 가스, 광물 등 천연자원을 보유한 국가가 이에 대한 소유권과 관리권을 강화하고 이 를 지렛대 삼아 국제사회에 대한 경제적, 정치적 영향력을 확대하는 국가주의적 경향을 자원민족주의라 일컫는다."},{"t":"자유무역협정(FTA)","d":"협정을 체결한 국가 간에 상품이나 서비스 교역에 대한 관세 및 무역장벽을 철폐함으로써 무역특혜를 서로 부여하는 협정을 말한다."},{"t":"자유재","d":"희소성이 높지 않고 아무런 대가를 치르지 않아도 무상으로 얻을 수 있는 재화를 말한다."},{"t":"작업증명","d":"작업증명(Proof-of-Work)은 제3자로부터의 서비스 요청(request)이 악의적인 공격 (spam 또는 DoS, Denial of Service)이 아님을 증명하기 위해서, 자원이 소모되는 작업 을 추가로 수행할 것을 요구하는 것을 의미한다."},{"t":"잠상","d":"은행권 위조방지를 위한 장치의 하나로 인쇄된 글자나 문양이 보통상태에서는 잘 보이지 않으나 보는 각도나 빛의 방향에 따라 보이는 장치를 말한다."},{"t":"잠재GDP성장률","d":"잠재GDP성장률은 노동이나 자본 등의 자원을 최대로 활용하였을 때 유지되는 실질GDP 의 증가율로서 한 나라 경제의 최대성장능력을 의미한다."},{"t":"잠재경제활동인구","d":"취업자도 아니고 실업자도 아닌 상태로 인해 비경제활동인구로 분류되었지만 취업 가능 성과 의사 등을 고려하여 잠재적인 측면에서 경제활동인구로 간주되는 잠재취업가능자와 잠재구직자를 합한 개념이다."},{"t":"장기금융시장(자본시장)","d":"금융시장은 거래 금융상품의 만기를 기준으로 단기금융시장(Money Market)과 자본시장 (Capital Market)으로 구분되는데 자본시장은 만기 1년 이상의 장기채권이나 만기가 없 는 주식이 거래되는 시장을 말한다."},{"t":"장기침체","d":"장기침체(Secular Stagnation)는 1938년 Hansen이 기술 정체와 인구증가율 둔화에 따른 투자기회의 대폭 축소로 미국경제가 1930년대 대공황 발생 이후에도 회복되지 못하 고 과소 투자 및 총수요 부족에 직면할 것으로 예측하면서 처음 사용한 용어로 알려져 있 으며, 최근에는 하버드대학의 Summers 교수가 IMF경제포럼(2013."},{"t":"장내시장","d":"장내시장이란 주식과 같은 유가증권이나 금융상품 등이 표준화된 거래방식에 따라 거래 가 이루어지는 조직화된 시장을 말한다."},{"t":"장단기금리차","d":"장단기금리차란 일정 시점에서 장기금리와 단기금리의 차이를 의미한다."},{"t":"장외시장","d":"장외시장(OTC; Over-The-Counter)이란 장내시장이 아닌 시장에서 중개기관을 통해 개 별적으로 거래가 이루어지는 시장을 말한다."},{"t":"재산소득","d":"국민계정에서 재산소득(Property Income)이란 금융자산 또는 자연자원(주로 토지 및 지 하자원)의 소유주가 타 경제주체에게 자금을 공급하거나 유형 비생산자산을 사용하도록 하고 그 대가로서 수취하는 소득을 말한다."},{"t":"재정수지","d":"정부의 수입과 지출의 차이를 재정수지라고 한다."},{"t":"재정정책","d":"정부의 지출과 조세를 정책수단으로 사용하는 정부의 제반 정책을 일컬어 재정정책이라 고 한다."},{"t":"재정환율","d":"자국 통화와 다른 외국 통화가 국내외환시장에서 직접적으로 거래되지 않는 경우 각각의 시장에서 결정되는 가격을 이용해 산출하는 환율을 말한다."},{"t":"적기시정조치제도","d":"부실화 징후가 있는 금융기관(은행, 보험사, 저축은행, 금융투자업자, 여전사 등)에 대하 여 적기에 경영개선을 유도·강제함으로써 조기에 경영을 정상화시키거나 경영정상화 가 능성이 없는 금융기관은 퇴출시키는 제도이다."},{"t":"전방연쇄효과","d":"전방연쇄효과란 특정 산업에서 제품의 생산이 증가할 때 동 생산품을 중간재나 원재료로 사용하는 산업에 미치는 경제적 파급 효과를 말한다."},{"t":"전산업생산지수","d":"우리나라 경제전체의 모든 산업을 대상으로 재화와 용역에 대한 생산활동의 흐름과 변화 를 월별지수로 나타낸 것이다."},{"t":"전세가율","d":"전세가율은 주택매매가격 대비 전세가격(전세보증금)의 비율을 의미하는데, 예를 들어 매 매가격이 10억원이고 전세가격이 6억원이라면 전세가율은 60%이다."},{"t":"전월세 전환율","d":"전월세 전환율이란 전세보증금을 월세로 전환할 때 적용되는 비율로, 임대인은 요구수익 률, 임차인은 전월세 선택 및 월세 계약시 기회비용을 계산하는 지표로 활용되고 있다."},{"t":"전자금융","d":"금융업무에 컴퓨터 및 정보통신기술을 적용하여 자동화 및 전자화(Network 화)를 구 현하는 것을 말한다."},{"t":"전자금융공동망","d":"전자금융공동망은 ARS공동망을 확대 개편하여 2001년 4월부터 가동된 시스템으로 인터 넷뱅킹, 모바일뱅킹 등 전자금융서비스에 대한 중계업무를 처리하고 있다."},{"t":"전자단기사채","d":"전자단기사채란 자본시장법상의 채무증권으로서 실물이 아닌 전자적으로 발행·유통되 는 단기금융상품을 말한다."},{"t":"전자상거래","d":"인터넷을 이용하여 가상공간에서 광고, 발주, 수주 등의 상거래 및 대금지급을 수행하는 것을 말한다."},{"t":"전자서명","d":"전자서명은 수기서명의 전자적인 대체물로서 전자 문서의 진정성 및 작성자의 신원을 확 인할 수 있도록 암호화한 정보를 말한다."},{"t":"전자어음","d":"전자어음은 실물어음이 아닌 전자적 형태로 발행된 어음으로 발행인, 수취인, 금액 등 어 음 정보를 전자문서 형태로 작성하며 전자어음 관리기관(금융결제원)의 전산시스템에 등 록된 약속어음이다."},{"t":"전자정보교환제도","d":"금융기관 수납장표의 전자정보교환제도(Truncation)란 공과금 납부용지, 지로용지, 어 음, 수표 등 금융기관에서 수납하는 각종 장표를 표준화하고 전산화하여 장표 실물의 이 동 없이 전산망을 통한 정보(전산데이터)의 이동만으로 교환 업무를 처리하는 제도이다."},{"t":"전자지급결제대행(PG)","d":"전자지급결제대행(PG; Payment Gateway)이란 인터넷 쇼핑몰 등의 전자상거래에서 구 매자로부터 대금을 수취하여 판매자에게 지급될 수 있도록 지급정보를 송·수신하는 것 또 는 그 대가의 정산을 대행하거나 매개하는 것을 의미한다."},{"t":"전자화폐","d":"IC카드 등에 화폐가치를 저장하였다가 상품 등의 구매에 사용할 수 있는 전자지급수단으 로서 범용성과 환금성을 갖춘 것을 말한다."},{"t":"전자화폐공동망","d":"전자화폐공동망은 금융기관이 공동으로 개발한 한국형 전자화폐(K-CASH) 이용시 발생한 금융기관간 정산금액을 결제하기 위한 시스템으로 2000년 7월 가동되었다."},{"t":"전환사채(CB)","d":"전환사채(Convertible Bond)란 사채로 발행되었지만, 일정 기간이 지난 후 소유자의 청 구에 의하여 발행회사의 주식(보통주)으로 전환할 수 있는 권리가 부여된 사채를 말한다."},{"t":"정규직/비정규직","d":"정규직은 법적인 개념은 아니지만 기간이 정해져 있지 않은 고용형태로 근로자와 사업주 가 직접 근로계약을 체결하고 전일제로 근무하면서 정년까지 보장된다는 의미로 받아들 이고 있다."},{"t":"정보의 비대칭성","d":"시장에서 거래의 당사자인 쌍방 간의 상호작용에 필요한 정보량에 차이가 있는 경우를 말 한다."},{"t":"정부당좌예금계정","d":"정부의 재정활동과 관련하여 발생하는 모든 국고금의 수입과 지출을 관리하는 계정을 정 부당좌예금계정이라 한다."},{"t":"정부실패","d":"시장실패를 교정하기 위한 정부의 시장개입과 규제가 자원배분의 효율성을 높이기보다 오히려 해치는 경우가 있는데 이를 시장실패에 비유하여 정부실패(Government Failure) 라고 한다."},{"t":"정책모기지/주택 정책대출","d":"정부의 주택 정책목표(주거복지 증진과 대출 접근성 제고)를 달성하기 위해 정부재정을 직·간접적으로 투입하여 주택금융공사와 주택도시기금으로 하여금 구입 주택 혹은 전월 세 보증금을 담보로 시중보다 낮은 금리로 관련 주택자금을 제공하도록 하는 다양한 주택 관련 정책대출 상품(보금자리론, 디딤돌대출, 버팀목대출 등)을 의미한다."},{"t":"정책시차","d":"정책시차(Policy Lag)란 어떤 경제정책을 시행해야 하는 원인이 발생하여 동 정책을 집행 하는 데까지 걸리는 시간과 정책이 실제로 집행된 후 정책효과가 나타나는 데 걸리는 시 간을 말한다."},{"t":"정크본드","d":"정크본드(Junk Bond)란 리스크가 상대적으로 큰 기업들이 자금 조달을 목적으로 발행한 고수익·고위험 채권을 말한다."},{"t":"제1차 통화조치","d":"한국전쟁의 여파로 산업활동이 크게 위축되고 물가가 급등하는 등 경제가 큰 혼란에 빠짐 에 따라 이를 타개하기 위하여 1953년 2월 15일 화폐단위를 ‘원(圓)’에서 ‘환(圜)’으로 변 경하고 100대 1로 절하(100圓 → 1圜)하는 긴급통화조치를 단행하였다."},{"t":"제2차 통화조치","d":"정부는 1962년부터 「경제개발 5개년 계획」을 추진하면서 퇴장자금의 산업 자금화 등을 위하여 1962년 6월 10일 긴급통화조치를 단행하여 화폐단위를‘환(圜)’에서 ‘원’으로 변 경하고 10대 1로 절하(10圜 → 1원)하고 ‘환(圜)’ 표시 화폐의 유통과 거래를 금지하였다 (단, 50환화와 10환화는 1975년 3월 21일까지 유통)."},{"t":"제로금리정책","d":"금융기관 간에 여유자금과 부족자금을 빌리는 단기금융시장에서 거래되는 초단기 자금의 금리(한국과 일본의 콜금리, 미국의 페더럴펀드금리 등)를 0%에 가까운 수준으로 떨어뜨 리는 통화정책을 말한다."},{"t":"제조업생산능력/가동률지수","d":"생산능력지수는 공급능력의 수준과 동향이 어떻게 변화하는가를 나타낸 것이며, 가동률 지수는 생산실적과 생산능력의 비율인 설비이용도를 지수화한 것으로서 경기동향 분석의 기초 자료로 이용된다."},{"t":"제조업평균가동률갭","d":"제조업평균가동률만으로는 경제내에 유휴생산능력이 있는지 여부와 그 크기를 판단하는 데 한계가 있게 된다."},{"t":"조세부담률","d":"조세부담률은 국민계정에서 조세수입이 국민총소득(GNI)에서 차지하는 비중으로 정의된 다."},{"t":"종합금융투자사업자","d":"신성장 동력 산업과 대규모 해외 프로젝트 등을 지원할 수 있는 투자은행 출현을 유도하 기 위해 2013년 도입된 제도이다."},{"t":"죄수의 딜레마","d":"전략적 상황에 처한 경제주체들의 행동을 분석하는데 유용하게 활용되는 게임이론의 한 예로서, 협력적인 선택이 양자에게 최선임에도 불구하고 자신의 이익에 치중한 선택으로 인해 오히려 두 사람 모두에게 바람직하지 않은 결과를 가져오는 상황을 말한다."},{"t":"주가수익비율(PER)","d":"주가가 실제 기업의 가치에 비해 고평가되어 있는지, 아니면 저평가되어 있는지 여부를 판단할 때 활용하는 대표적인 지표로 주가수익비율(PER; Price Earning Ratio)이 있다."},{"t":"주가순자산비율(PBR)","d":"주가순자산비율(PBR; Price to Book Ratio)은 주가를 주당순자산가치(BPS; Book- value Per Share)로 나눈 비율이다."},{"t":"주가연계증권(ELS)","d":"주가연계증권(ELS; Equity Linked Security)은 개별 주식의 가격이나 특정 주가지수의 변동에 연계되어 특정조건 충족시 약정된 투자손익이 결정되는 금융투자상품이다."},{"t":"주가지수","d":"주가지수는 주식가격의 전반적인 수준을 나타내는 지표이다."},{"t":"주가지수선물거래","d":"주가지수선물의 거래유형으로는 헤지거래, 투기거래, 차익거래, 스프레드거래 등이 있 다."},{"t":"주가지수옵션","d":"주가지수옵션(Stock Index Options)은 주가지수(기초자산)를 만기일에 사전에 약정한 가격(행사가격)으로 매입하거나 매도할 수 있는 권리를 거래하는 파생금융상품으로서 매입권리인 콜옵션(call option)과 매도권리인 풋옵션(put option)으로 구분된다."},{"t":"주당순이익(EPS)","d":"주당순이익(EPS; Earning Per Share)은 기업이 벌어들인 당기순이익을 동 기업이 발행 한 총 주식수로 나눈 값을 말한다."},{"t":"주식시장","d":"주식시장은 주식회사의 지분권을 표시하는 유가증권인 주식이 거래되는 시장이다."},{"t":"주주환원정책","d":"주주환원정책은 배당 확대, 자사주 매입 등 주주가치를 제고할 수 있는 정책을 의미한다."},{"t":"주택저당증권(MBS)","d":"주택저당증권(MBS; Mortgage-Backed Securities)이란 자산유동화증권(ABS)의 일종 으로써 모기지(또는 주택담보대출)를 기초자산으로 발행되는 증권이다."},{"t":"중간소비","d":"생산과정에서 원재료, 광열비, 간접비 등으로 소비된 비내구재 및 서비스를 말하는 것으 로써 고정자산의 유지보수를 위한 지출 등이 포함되고 중고품과 폐품의 순판매액은 차감 된다."},{"t":"중개무역","d":"수출입 양 당사자 간의 물품거래가 제3국 상인의 중개로 이루어지는 무역형태를 말한다."},{"t":"중계무역","d":"물품을 수입하되 이를 국내에 반입하지 아니하고 가공하지 않은 원형 그대로 직접 제3 국으로 수출하는 형태의 무역거래를 말한다."},{"t":"중앙거래당사자","d":"중앙거래당사자(CCP; Central Counterparty)는 증권거래 계약의 매도자에 대해 매수자 역할을, 매수자에 대해서는 매도자 역할을 수행하는 기관으로서 다자간 차감에 의한 청산 업무를 수행하여 결제 유동성을 절약하는 한편 결제이행보증 서비스를 제공하여 참가자 의 리스크관리 부담을 경감시키고 신용 및 유동성리스크를 집중하여 관리하는 역할을 수 행하고 있다."},{"t":"중앙예탁기관","d":"중앙예탁기관(CSD; Central Securities Depository)은 각종 증권을 집중적으로 예탁받 아 관리하는 기관으로서, 증권 발행 및 유통시장에서 예탁자와 예탁자의 고객을 대상으 로 증권의 예탁, 계좌대체, 예탁증권의 권리행사 등의 업무를 수행한다."},{"t":"중앙은행","d":"일반적으로 중앙은행은 독점적 발권력을 바탕으로 금융기관에 부족자금을 대출하는 은행 의 은행 기능과 정부의 세입 및 세출을 관리하고 필요시 부족자금을 대출하는 정부의 은 행 기능을 수행한다."},{"t":"중앙은행 디지털화폐(CBDC)","d":"중앙은행 디지털화폐(CBDC; Central Bank Digital Currency)는 중앙은행 내 지준예 치금이나 결제성 예금과는 별도로 중앙은행이 발행하는 새로운 전자적 형태의 화폐를 의 미한다."},{"t":"증거금","d":"증권 현물을 거래할 경우 또는 선물/옵션을 거래할 경우에 매매당사자 일방 또는 매매당 사자 쌍방이 매매약정을 이행한다는 증거로 중개회사에 예치하는 금액을 말한다."},{"t":"증권결제리스크","d":"증권결제리스크는 매매증권의 인도와 대금지급이 예정대로 이행되지 않아 발생할 수 있 는 손실가능성을 말하며 원금리스크, 대체비용리스크, 유동성리스크 등으로 구분된다."},{"t":"증권대금동시결제(DVP)","d":"증권대금동시결제(DVP; Delivery versus Payment)는 중앙예탁기관의 증권결제시스템 을 대금결제은행의 지급시스템과 연계하여 증권 인도를 전제로 자금을 지급하거나 자금 지급을 전제로 증권을 인도하는 방식이다."},{"t":"증권커스터디서비스","d":"증권커스터디서비스는 유가증권에 투자하는 투자자를 대신하여 해당 증권의 보고 (safekeeping) 및 기록(record keeping), 이전(delivery), 원리금 및 배당금 수령, 통지 등 제반 관리서비스를 제공하는 업무를 말한다."},{"t":"증시주변자금","d":"증시주변자금은 주식시장에 직접 투자되지는 않지만, 언제든지 유입될 수 있는 대기성 자 금이다."},{"t":"지급","d":"지급(Payment)은 개인이나 기업 등 경제주체가 경제거래를 한 후 현금, 수표, 신용카드, 자금이체 등 지급수단을 이용하여 예금 등 화폐적 가치에 대한 청구권을 이전하는 행위를 말한다."},{"t":"지급결제 및 시장인프라 위원회(BIS CPMI)","d":"국제결제은행(BIS)의 「지급 및 시장인프라 위원회」 (CPMI; Committee on Payments and Market Infrastructures)는 1990년 설립된 「지급결제제도위원회」(CPSS; Committee on Payment and Settlement Systems)의 명칭을 2014년 9월 1일부터 변경한 것으로, 처음에는 주요국의 지급결제제도 동향을 모니터링하고 분석하기 위해 설 립되었다."},{"t":"지급결제보고서","d":"한국은행이 매년 발행하는 지급결제보고서는 국내 지급결제제도의 운영 현황, 지급결제 시스템별 동향, 정책 추진 및 혁신 노력, 주요 현안 분석 등을 종합적으로 담은 공식 보고 서이다."},{"t":"지급결제시스템","d":"개인·기업·정부 등 경제주체들의 금융거래나 경제활동에서 발생하는 지급, 청산 및 결제 가 원활히 이루어지도록 해주는 금융시스템의 하부구조로서 중앙은행, 은행, 청산기관, 관련 법규, 지급수단 등으로 구성된다."},{"t":"지급결제제도 감시","d":"국제결제은행(BIS)의 지급결제 및 시장인프라 위원회는 지급결제제도 감시(Oversight of Payment Systems)를 “기존 시스템 및 구축 예정인 시스템을 모니터링하고 동 시스템에 대해 평가하는 한편, 필요시 개선을 유도함으로써 동 시스템들의 안전성 및 효율성의 증 진을 도모하는 중앙은행의 기능”으로 정의하고 있다."},{"t":"지급수단","d":"지급수단(Payment Instruments)은 크게 현금과 현금 이외의 지급수단으로 구분된다."},{"t":"지급여력비율/K-ICS비율","d":"보험회사의 지급여력(Solvency Margin)을 나타내는 지표로, 「보험업법 시행령」에서는 지급여력금액을 지급여력기준금액으로 나눈 비율로 규정하고 있다."},{"t":"지급준비자산제도","d":"지급준비자산제도란 한국은행이 필요하다고 인정될 때 금융기관에 대하여 예금지급준비 금과는 별도의 지급준비자산을 보유할 수 있는 제도(「한국은행법」 제63조)이다."},{"t":"지급준비제도","d":"중앙은행이 금융기관으로 하여금 예금 등과 같은 채무의 일정비율에 해당하는 금액을 중 앙은행에 예치하도록 하는 제도이다."},{"t":"지니계수","d":"지니계수란 이탈리아의 통계학자 지니(Gini)가 소득분배상태를 파악하기 위하여 로렌 츠곡선의 단점을 보완, 로렌츠곡선이 나타내는 내용을 하나의 단순한 숫자로 표시한 것 이다."},{"t":"지로(GIRO)","d":"지로는 대량수납 및 대량지급거래 등 다수인과의 지급거래를 중계센터를 통해 처리하는 소액대량 지급수단중 하나이다."},{"t":"지방은행공동망","d":"지방은행공동망은 지방은행이 공동으로 운영하는 지급시스템인 뱅크라인(Bankline) 업 무를 처리하는 공동망으로서 1997년 6월 가동되었다."},{"t":"지분형 모기지","d":"지분형 모기지는 정부나 공공기관이 주택의 일부를 지분으로 투자함으로써 주택 구매자 의 자금 부담을 완화해 주는 주택금융 제도이다."},{"t":"지식서비스 무역통계","d":"지식서비스 무역통계는 국가 간의 지식 기반 서비스 거래 흐름을 계량적으로 측정하고 분 석하기 위한 통계로서, 국제수지 통계의 서비스수지에 포함되어 있는 ① 지식재산권 사용 료 ② 정보·통신서비스 ③ 문화·여가서비스 ④ 전문·사업서비스 등 4대 지식서비스 분야 를 세분화하여 제공한다."},{"t":"지식재산권","d":"지식재산권(Intellectual Property Rights)은 인간의 창의적 활동이나 지식 기반의 산출 물에 대해 창작자나 발명가, 개발자 등에게 독점적 사용과 배타적 권리를 부여하는 법적 권리이다."},{"t":"지식재산생산물투자","d":"지식재산생산물투자는 국민계정 체계(SNA; System of National Accounts)에서 건설투 자, 설비투자와 함께 총고정자본형성(=투자)을 구성하는 항목이다."},{"t":"지정시점처리제도","d":"실시간 총액결제시스템에서 금융기관의 이체지시는 신청 즉시 처리되는 것이 원칙이나 어음교환, 타행환 등의 차액결제와 같이 거래 성격상 다수 금융기관 간에 일괄결제가 필 요한 거래는 영업시간중 특정시점에 처리하고 있는데 이를 지정시점처리제도라 한다."},{"t":"지주회사","d":"지주회사는 다른 회사의 주식을 소유하여 그 회사의 사업내용을 지배하는 것을 주된 사업 으로 하는 회사이다."},{"t":"직불카드","d":"직불카드(Debit Card)는 카드소지인(고객)이 물품이나 서비스를 구매하는 경우 동 카드 를 이용하여 판매점에 설치되어 있는 단말기와 카드 발급은행의 주전산기를 통하여 고객 의 예금계좌에서 구매대금을 인출하고 이를 판매자의 예금계좌로 자동이체해 주는 용도 로 사용되는 카드이다."},{"t":"직불카드공동망","d":"직불카드공동망은 직불카드 소지자가 판매점에서 동 카드를 사용하여 상품·서비스를 구 입하면 판매대금이 카드소지자 은행 계좌에서 인출되어 다음 영업일 판매자 은행 계좌 로 입금되는 지급시스템으로 1996년 2월 가동되었다."},{"t":"직접투자","d":"직접투자는 한 나라의 기업이 국외 현지법인의 경영에 직접 참여하여 영업이익을 획득할 목적으로 자사 보유 자본, 기술 및 인력 등의 생산요소를 국외로 이전하는 거래행위를 말 한다."},{"t":"진성어음/융통어음","d":"진성어음(Commercial Bill)이란 기업간 상거래에 있어 대금결제를 위해 발행되는 어음 으로 상업어음, 물품대금어음(물대어음)이라고도 한다."},{"t":"집단대출","d":"주택담보대출 중 신규분양, 재건축·재개발아파트 입주(예정)자 등 일정 자격요건을 갖춘 차주 집단을 대상으로 개별심사 없이 일괄승인방식으로 실행되는 여신을 말한다."},{"t":"집중도 지수(HHI)","d":"특정 산업에 속한 시장참여자들의 매출액이나 자산규모 등을 기준으로 시장점유율을 백 분율(%)로 산출한 후 이들 모두를 각각 제곱한 값을 합산한 수치로, 이 수치가 높을수록 해당 산업이 소수의 참여자들에 의한 지배력이 커짐을 나타낸다."},{"t":"차액결제선물환(NDF) 거래","d":"만기 시 당초 약정한 환율에 의해 특정 통화를 거래당사자 간에 인도 또는 인수하는 일 반적인 선물환거래와 달리 만기에 계약원금의 교환 없이 약정환율과 만기 시 현물환율 인 지정환율(fixing rate) 간의 차액만을 지정통화로 결제하는 거래를 말한다."},{"t":"차액결제시스템","d":"결제시스템에 참가하는 금융기관 간 자금결제에서 일정 기간(보통 1일) 동안 발생한 거래 의 상호 지급액과 수취액을 모두 상계처리한 다음 그 차액만을 이체하여 결제하는 시스템 으로 양자간 차액결제시스템과 어음교환, CD, 타행환시스템 등과 같이 다수의 금융기관 간에 이루어지는 다자간 차액결제시스템으로 구분된다."},{"t":"차입매수(LBO)","d":"차입매수(LBO; Leveraged Buy out)란 기업을 매수하려는 주체가 인수에 필요한 자금 이 충분하지 않은 경우 금융기관 등으로부터 인수대상 기업의 자산을 담보로 인수자금을 차입하여 기업을 매수하는 방식을 말한다."},{"t":"채권시가평가","d":"채권시가평가(Mark to Market)란 금융기관들이 보유하고 있는 채권에 대한 가치를 적절 한 가격(시장에서 거래가 활발한 채권은 시장가격으로, 거래부진으로 시장가격을 발견하 기 곤란한 경우에는 보유채권을 시장에 매각할 경우 받을 수 있을 것으로 합리적으로 추 정되는 공정가격)으로 평가하는 것을 의미하며 2000년 7월부터 전면 시행되었다."},{"t":"채권시장","d":"채권시장은 채권이 거래되는 시장이다."},{"t":"채권시장안정펀드","d":"채권시장안정펀드란 2008년 9월 미국발 금융위기로 국내 금융시장이 경색됨에 따라 국 내 금융기관이나 기업이 채권이나 기업어음 발행을 통해 원활하게 자금을 조달할 수 있도 록 2008년 11월에 만들어진 펀드이다."},{"t":"채무불이행","d":"채무불이행(Default)은 채무자가 계약상 또는 법률상 부담하는 채무를 그 내용대로 이행 하지 않거나, 이행할 수 없는 객관적인 상태에 빠지는 것을 의미한다."},{"t":"채무상환유예(Moratorium)","d":"라틴어로 ‘지체하다’ 란 뜻의 ‘morari’에서 파생된 말로, 한 국가가 경제·정치적인 이유로 외국에서 빌려 온 차관에 대해 일시적으로 상환을 연기하는 ‘지불유예(支拂猶豫)’를 말한 다."},{"t":"청년실업률","d":"청년실업률이란 15세에서 29세에 해당하는 청년층의 경제활동인구 중 실업자의 비율을 말한다."},{"t":"청산","d":"자금지급 거래에서 청산(Clearing)은 경제주체간 지급행위가 수표, 계좌이체 등 비현금수 단을 이용하여 이루어진 경우 지급인과 수취인의 거래은행들이 주고 받을 금액을 정산하 고 최종 확정하는 과정을 말한다."},{"t":"청산소","d":"청산소(Clearing House)는 금융시장에서 은행, 증권사 등 거래당사자들 사이에 발생하 는 다수의 지급 거래를 집중적으로 처리하여, 각 거래의 채권·채무를 확정하고 최종결제 를 위한 포지션을 산정하는 핵심 금융인프라이다."},{"t":"총고정자본형성","d":"기업에서는 지속적인 생산능력을 유지하고 경쟁력을 확보하기 위해 노후설비를 새로운 설비로 대체하거나 신규 사업 진출을 위해 공장도 짓고 기계도 구매하는데 이러한 경제활 동은 해당연도의 이익만을 위한 것이 아니고 미래의 지속적인 수입의 보장 등 장기적인 안목에서 이루어진다."},{"t":"총부채상환비율(DTI)","d":"차주의 연간 소득 대비 연간 대출 원리금 상환액의 비율(Debt-To-Income ratio)을 의 미한다."},{"t":"총부채원리금상환비율(DSR)","d":"차주의 총 금융부채 상환부담을 판단하기 위하여 산정하는 지표로, 차주의 연간 소득 대 비 연간 금융부채 원리금 상환액의 비율(Debt-Service-Ratio)을 의미한다."},{"t":"총산출","d":"총산출(Gross Output)이란 생산된 재화와 용역의 화폐평가액을 총합한 것으로 재고품 과 자가소비를 포함한다."},{"t":"총수입스왑(Total Return Swap)","d":"총수익스왑(TRS; Total Return Swap)은 기초자산 보유에 따라 발생하는 이자, 자본수익 등 총수익을 대가로 약정이자(통상 LIBOR+spread)를 수취하는 거래를 말한다."},{"t":"총액결제시스템","d":"거액지급시스템에 참가하는 금융기관들의 지급액과 수취액을 상계시키지 않고 지급지시 건별로 그 지급지시 금액(총액)을 이체하는 총액결제방식을 채택한 거액지급시스템을 말 한다."},{"t":"총저축/총저축률/평균소비성향/평균저축성향","d":"총저축은 국민총처분가능소득에서 소비하고 남은 부분이다."},{"t":"최저임금제","d":"국가가 노사 간의 임금결정 과정에 개입하여 임금의 최저수준을 정하고 그 이상 임금을 지급하도록 강제함으로써 근로자를 보호하는 제도이다."},{"t":"최종대부자 기능","d":"최종대부자(Lender of Last Resort) 기능은 금융시장 불안 등으로 일시적인 지급불능 상 태에 빠진 금융기관에 대하여 중앙은행이 발권
